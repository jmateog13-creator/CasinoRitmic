<!DOCTYPE html>
<html lang="ca">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interval Rítmic</title>
    <link rel="stylesheet" href="css/casino-common.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        .game-layout {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex: 1;
            padding: 40px;
            width: 100%;
        }

        .cards-container {
            display: flex;
            gap: 30px;
            margin: 40px 0;
            perspective: 1000px;
        }

        .card-slot {
            width: 150px;
            height: 220px;
            border: 2px dashed rgba(255,215,0,0.2);
            border-radius: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .playing-card {
            width: 100%;
            height: 100%;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            transform-style: preserve-3d;
            position: relative;
        }
        .playing-card img { width: 70%; pointer-events: none; }
        .playing-card .val { font-size: 1.5rem; font-weight: bold; color: #333; margin-top: 10px; }

        .spread-banner {
            background: rgba(0,0,0,0.8);
            border: 2px solid var(--gold);
            padding: 10px 30px;
            border-radius: 30px;
            color: var(--gold);
            font-family: 'Playfair Display', serif;
            font-size: 1.5rem;
            margin-bottom: 20px;
            opacity: 0;
            transition: opacity 0.5s;
        }

        .bet-controls { display: flex; gap: 20px; margin-top: 40px; }
        
        .chips-hud {
            position: absolute;
            bottom: 40px;
            right: 40px;
            background: rgba(0,0,0,0.8);
            padding: 15px 30px;
            border-radius: 15px;
            border: 1px solid var(--gold);
            text-align: right;
        }
    </style>
</head>

<body>
    <div class="casino-table">
        <div class="game-layout">
            <div class="spread-banner" id="banner">INTERVAL: <span id="spread-val">0</span></div>

            <div class="cards-container">
                <div class="card-slot" id="slot-0"></div>
                <div class="card-slot" id="slot-1"></div>
                <div class="card-slot" id="slot-2"></div>
            </div>

            <div class="bet-controls" id="actions">
                <button class="modal-btn" onclick="game.startDeal()" id="btn-deal">APOSTAR 10 🪙</button>
                <button class="modal-btn" onclick="game.decide(true)" id="btn-raise" style="display:none;">DOBLAR (x2) 🚀</button>
                <button class="modal-btn" onclick="game.decide(false)" id="btn-call" style="display:none;">PASSAR 🃏</button>
            </div>

            <div class="chips-hud">
                <div style="font-size:0.8rem; color:#aaa;">SALDO ACTUAL</div>
                <div style="font-size:1.8rem; color:var(--gold); font-weight:bold;"><span id="chips">1000</span> 🪙</div>
                <div style="font-size:0.8rem; color:#888; margin-top:5px;">VICTÒRIES RANG: <span id="wins">0</span>/5</div>
            </div>
        </div>
    </div>

    <script src="js/casino-common.js"></script>
    <script>
        Casino.Audio.init('music/background_music_interval.mp3');
        Casino.UI.injectBasicUI('Interval Rítmic');

        const TYPES = [
            { id: 'rodona', v: 4, img: 'images/rodona.jpg' },
            { id: 'blanca', v: 2, img: 'images/blanca.jpg' },
            { id: 'negra', v: 1, img: 'images/negra.jpg' },
            { id: 'corxera', v: 0.5, img: 'images/corxera.jpg' },
            { id: 'semicorxera', v: 0.25, img: 'images/semicorxera.jpg' }
        ];

        class IntervalGame {
            constructor() {
                this.chips = 1000;
                this.wins = 0;
                this.bet = 0;
                this.cards = [];
                this.init();
            }

            init() {
                Casino.UI.showModal('int-instr', 'LA TROMPETA D\'AIDA', 
                    'Aposta si la tercera figura rítmica tindrà una durada intermèdia entre les dues primeres.<br><br>' +
                    '<b>Repte:</b> Aconsegueix 5 victòries d\'interval "Doblat" per guanyar la trompeta egípcia original de Verdi.', 'ENTRAR AL JOC');
                this.updateUI();
            }

            updateUI() {
                document.getElementById('chips').textContent = this.chips;
                document.getElementById('wins').textContent = this.wins;
            }

            async startDeal() {
                if(this.chips < 10) return;
                this.chips -= 10; this.bet = 10; this.updateUI();
                this.cards = [];
                [0,1,2].forEach(i => document.getElementById('slot-'+i).innerHTML = '');
                document.getElementById('banner').style.opacity = '0';
                document.getElementById('btn-deal').style.display = 'none';

                this.cards[0] = TYPES[Math.floor(Math.random()*TYPES.length)];
                this.cards[1] = TYPES[Math.floor(Math.random()*TYPES.length)];
                
                await this.placeC(0, this.cards[0]);
                await this.placeC(2, this.cards[1]);
                
                const min = Math.min(this.cards[0].v, this.cards[1].v);
                const max = Math.max(this.cards[0].v, this.cards[1].v);
                const spread = max - min;

                if(spread <= 0.25) {
                    alert("No hi ha espai per a un interval! Empat.");
                    this.chips += 10; this.updateUI();
                    document.getElementById('btn-deal').style.display = 'block';
                } else {
                    document.getElementById('spread-val').textContent = spread;
                    document.getElementById('banner').style.opacity = '1';
                    document.getElementById('btn-raise').style.display = 'block';
                    document.getElementById('btn-call').style.display = 'block';
                }
            }

            async placeC(slot, card) {
                Casino.Audio.playTone(400, 'sine', 0.1);
                const s = document.getElementById('slot-'+slot);
                const el = document.createElement('div');
                el.className = 'playing-card';
                el.innerHTML = `<img src="${card.img}"><div class="val">${card.v}</div>`;
                s.appendChild(el);
                return new Promise(r => setTimeout(r, 600));
            }

            async decide(raise) {
                document.getElementById('btn-raise').style.display = 'none';
                document.getElementById('btn-call').style.display = 'none';
                
                if(raise) {
                    if(this.chips >= 10) { this.chips -= 10; this.bet = 20; this.updateUI(); }
                    else alert("Saldo insuficient per doblar, jugues amb l'aposta inicial.");
                }

                this.cards[2] = TYPES[Math.floor(Math.random()*TYPES.length)];
                await this.placeC(1, this.cards[2]);

                const min = Math.min(this.cards[0].v, this.cards[1].v);
                const max = Math.max(this.cards[0].v, this.cards[1].v);
                const v = this.cards[2].v;

                if(v > min && v < max) {
                    Casino.Audio.playTone(800, 'sine', 0.2);
                    this.chips += this.bet * 2;
                    if(raise) this.wins++;
                } else {
                    Casino.Audio.playTone(100, 'sawtooth', 0.4);
                }

                this.updateUI();
                if(this.wins >= 5) this.win();
                else {
                    setTimeout(() => {
                        document.getElementById('btn-deal').style.display = 'block';
                    }, 1500);
                }
            }

            win() {
                Casino.Audio.playWin();
                Casino.Rewards.saveProgress('reward_interval');
                Casino.UI.showVictory("Saps llegir els silencis entre les notes! La trompeta d'Aida és teva.", () => location.href = 'menu.html');
            }
        }

        const game = new IntervalGame();
    </script>
</body>
</html>
