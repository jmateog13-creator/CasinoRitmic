<!DOCTYPE html>
<html lang="ca">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dards Rítmics</title>
    <link rel="stylesheet" href="css/casino-common.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        .game-layout {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-around;
            flex: 1;
            padding: 20px;
        }

        .target-hud {
            text-align: center;
            background: rgba(0,0,0,0.5);
            padding: 20px 40px;
            border-radius: 15px;
            border: 2px solid var(--gold);
            backdrop-filter: blur(10px);
        }

        #target-val { font-size: 3rem; color: var(--gold); font-weight: bold; }
        #current-sum { font-size: 1.5rem; color: #ff4444; margin-top: 10px; }

        .board-container {
            position: relative;
            cursor: crosshair;
        }

        #dartboard {
            border-radius: 50%;
            border: 10px solid #333;
            box-shadow: 0 0 50px rgba(0,0,0,0.8);
        }

        .scoreboard {
            position: absolute;
            top: 100px;
            right: 40px;
            background: rgba(0,0,0,0.6);
            border: 2px solid var(--glass-border);
            border-radius: 10px;
            padding: 20px;
            min-width: 200px;
        }

        .score-row { display: flex; justify-content: space-between; margin: 10px 0; color: #aaa; }
        .score-row.active { color: var(--gold); font-weight: bold; }
    </style>
</head>

<body>
    <div class="casino-table">
        <div class="game-layout">
            <div class="target-hud">
                <div style="color:#aaa;">OBJECTIU RÍTMIC</div>
                <div id="target-val">2.0</div>
                <div id="current-sum">Suma Actual: 0.0</div>
            </div>

            <div class="board-container">
                <canvas id="dartboard" width="500" height="500"></canvas>
            </div>

            <div class="scoreboard">
                <div style="text-align:center; color:var(--gold); border-bottom:1px solid #444; padding-bottom:5px; margin-bottom:10px;">MARCADOR</div>
                <div class="score-row active" id="p1-row"><span>TU</span><span id="p1-score">0</span></div>
                <div class="score-row" id="p2-row"><span>EL DESAFINAT</span><span id="p2-score">0</span></div>
                <div class="score-row" id="p3-row"><span>EL VIRTUÓS</span><span id="p3-score">0</span></div>
            </div>
            
            <div style="color:#aaa; font-style:italic;">Fes clic a la diana per llançar els dards!</div>
        </div>
    </div>

    <script src="js/casino-common.js"></script>
    <script>
        Casino.Audio.init('music/background_music_dardos.mp3');
        Casino.UI.injectBasicUI('Dards Rítmics');

        const SECTIONS = [
            { val: 4, label: 'RODONA', color: '#8b0000' },
            { val: 2, label: 'BLANCA', color: '#eecfa1' },
            { val: 1, label: 'NEGRA', color: '#000000' },
            { val: 0.5, label: 'CORXERA', color: '#8b0000' },
            { val: 0.25, label: 'SEMICORXERA', color: '#eecfa1' }
        ];

        class DartGame {
            constructor() {
                this.canvas = document.getElementById('dartboard');
                this.ctx = this.canvas.getContext('2d');
                this.rotation = 0;
                this.target = 2.0;
                this.players = [
                    { name: 'TU', score: 0, sum: 0, darts: 3 },
                    { name: 'IA1', score: 0, sum: 0, darts: 3 },
                    { name: 'IA2', score: 0, sum: 0, darts: 3 }
                ];
                this.turn = 0;
                this.init();
            }

            init() {
                Casino.UI.showModal('dart-instr', 'L\'ANELL DEL NIBELUNG', 
                    'Aconsegueix la suma exacta de temps llançant dards a la diana giratòria.<br><br>' +
                    '<b>Alerta:</b> Si et passes de l\'objectiu (Bust), perdràs els punts de la ronda!', 'ENTRAR AL PUB');
                this.canvas.onclick = (e) => this.throwDart(e);
                this.loop();
            }

            throwDart(e) {
                if(this.turn !== 0 || this.players[0].darts <= 0) return;
                const rect = this.canvas.getBoundingClientRect();
                const x = e.clientX - rect.left - 250;
                const y = e.clientY - rect.top - 250;
                this.resolveThrow(x, y);
            }

            resolveThrow(x, y) {
                const dist = Math.sqrt(x*x + y*y);
                if(dist > 240) return; // Miss

                let angle = Math.atan2(y, x) - this.rotation;
                angle = (angle % (Math.PI*2) + (Math.PI*2)) % (Math.PI*2);
                const idx = Math.floor(angle / (Math.PI*2/5));
                const val = SECTIONS[idx].val;

                const p = this.players[this.turn];
                p.sum = Math.round((p.sum + val)*100)/100;
                p.darts--;
                
                Casino.Audio.playTone(400, 'square', 0.1);
                this.updateUI();

                if(p.sum > this.target || p.darts === 0) {
                    setTimeout(() => this.nextTurn(), 1000);
                }
            }

            nextTurn() {
                this.turn++;
                if(this.turn >= 3) this.endRound();
                else this.aiTurn();
                this.updateUI();
            }

            aiTurn() {
                const p = this.players[this.turn];
                const interval = setInterval(() => {
                    const val = SECTIONS[Math.floor(Math.random()*5)].val;
                    p.sum += val;
                    p.darts--;
                    Casino.Audio.playTone(300, 'square', 0.1);
                    this.updateUI();
                    if(p.sum > this.target || p.darts === 0) {
                        clearInterval(interval);
                        setTimeout(() => this.nextTurn(), 1000);
                    }
                }, 800);
            }

            endRound() {
                this.players.forEach(p => {
                    if(p.sum <= this.target) p.score += Math.round(p.sum * 100);
                    p.sum = 0; p.darts = 3;
                });
                this.target = [2, 3, 4][Math.floor(Math.random()*3)];
                this.turn = 0;
                this.updateUI();
                if(this.players[0].score >= 700) this.win();
            }

            updateUI() {
                document.getElementById('target-val').textContent = this.target.toFixed(1);
                document.getElementById('current-sum').textContent = `Suma Actual: ${this.players[0].sum.toFixed(2)}`;
                document.getElementById('p1-score').textContent = this.players[0].score;
                document.getElementById('p2-score').textContent = this.players[1].score;
                document.getElementById('p3-score').textContent = this.players[2].score;
                document.querySelectorAll('.score-row').forEach((r, i) => i === this.turn ? r.classList.add('active') : r.classList.remove('active'));
            }

            loop() {
                this.ctx.clearRect(0,0,500,500);
                this.rotation += 0.02;
                this.ctx.save();
                this.ctx.translate(250, 250);
                this.ctx.rotate(this.rotation);
                for(let i=0; i<5; i++) {
                    this.ctx.beginPath();
                    this.ctx.moveTo(0,0);
                    this.ctx.arc(0, 0, 240, i*Math.PI*2/5, (i+1)*Math.PI*2/5);
                    this.ctx.fillStyle = SECTIONS[i].color;
                    this.ctx.fill();
                }
                this.ctx.restore();
                requestAnimationFrame(() => this.loop());
            }

            win() {
                Casino.Audio.playWin();
                Casino.Rewards.saveProgress('reward_dardos');
                Casino.UI.showVictory("Ets el campió del pub! L'anell del Nibelung és teu.", () => location.href = 'menu.html');
            }
        }

        const game = new DartGame();
    </script>
</body>
</html>
