<!DOCTYPE html>
<html lang="ca">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dominó Rítmic</title>
    <link rel="stylesheet" href="css/casino-common.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        .game-layout {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            flex: 1;
            padding: 20px;
            width: 100%;
        }

        .board-container {
            width: 95%;
            height: 300px;
            background: rgba(0,0,0,0.3);
            border: 2px solid var(--glass-border);
            border-radius: 20px;
            overflow-x: auto;
            display: flex;
            align-items: center;
            padding: 20px;
            backdrop-filter: blur(10px);
        }

        .board-tiles { display: flex; align-items: center; gap: 5px; margin: 0 auto; }

        .hand-area {
            width: 90%;
            height: 140px;
            background: rgba(0,0,0,0.2);
            border: 1px solid var(--glass-border);
            border-radius: 15px;
            display: flex;
            align-items: center;
            padding: 10px;
            gap: 10px;
            overflow-x: auto;
        }

        .tile {
            width: 60px;
            height: 120px;
            background: #fff8e1;
            border-radius: 5px;
            box-shadow: 2px 4px 8px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            cursor: pointer;
            transition: transform 0.2s;
            position: relative;
        }
        .tile:hover { transform: translateY(-10px); }
        .tile.horizontal { width: 120px; height: 60px; flex-direction: row; }

        .tile-half { flex: 1; display: flex; justify-content: center; align-items: center; position: relative; border: 1px solid rgba(0,0,0,0.1); }
        .tile-half img { width: 80%; }
        
        .play-indicator {
            position: absolute;
            background: rgba(0,255,0,0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            color: #000;
            z-index: 10;
        }

        .action-bar { display: flex; gap: 20px; margin-top: 10px; }
    </style>
</head>

<body>
    <div class="casino-table">
        <div class="game-layout">
            <div id="cpu-info" style="color:var(--gold);">IA: 7 Fitxes</div>

            <div class="board-container">
                <div class="board-tiles" id="board">
                    <!-- Tiles here -->
                </div>
            </div>

            <div class="hand-area" id="player-hand">
                <!-- Player tiles here -->
            </div>

            <div class="action-bar">
                <button class="modal-btn" onclick="game.draw()">ROBAR FITXA 🃏</button>
            </div>
        </div>
    </div>

    <script src="js/casino-common.js"></script>
    <script>
        Casino.Audio.init('music/background_music_main.mp3');
        Casino.UI.injectBasicUI('Dominó Rítmic');

        const RHYTHMS = [
            { v: 0.5, img: 'images/corxera.jpg' },
            { v: 1.0, img: 'images/negra.jpg' },
            { v: 2.0, img: 'images/blanca.jpg' },
            { v: 4.0, img: 'images/rodona.jpg' }
        ];

        class DominoGame {
            constructor() {
                this.deck = [];
                this.pHand = [];
                this.cHand = [];
                this.board = [];
                this.ends = { left: null, right: null };
                this.turn = 'player';
                this.init();
            }

            init() {
                Casino.UI.showModal('dom-instr', 'LA CAIXA DE RAVEL', 
                    'Connecta les fitxes fent coincidir els valors rítmics als extrems.<br><br>' +
                    '<b>Guanyador:</b> Qui es quedi sense fitxes primer.', 'COMENÇAR PARTIDA');
                this.setupDeck();
                this.deal();
                this.startBoard();
                this.render();
            }

            setupDeck() {
                for(let i=0; i<RHYTHMS.length; i++) {
                    for(let j=i; j<RHYTHMS.length; j++) {
                        this.deck.push({ v1: RHYTHMS[i], v2: RHYTHMS[j], id: Math.random() });
                    }
                }
                const base = [...this.deck];
                this.deck = [...base, ...base, ...base].sort(() => Math.random() - 0.5);
            }

            deal() {
                for(let i=0; i<7; i++) { this.pHand.push(this.deck.pop()); this.cHand.push(this.deck.pop()); }
            }

            startBoard() {
                const t = this.deck.pop();
                this.board.push({ ...t, f: false });
                this.ends = { left: t.v1.v, right: t.v2.v };
            }

            draw() {
                if(this.turn !== 'player' || this.deck.length === 0) return;
                this.pHand.push(this.deck.pop());
                Casino.Audio.playTone(400, 'sine', 0.1);
                this.render();
            }

            play(idx, side) {
                if(this.turn !== 'player') return;
                const t = this.pHand[idx];
                let placed = false;
                if(side === 'left') {
                    if(t.v1.v === this.ends.left) { this.board.unshift({ ...t, f: true }); this.ends.left = t.v2.v; placed = true; }
                    else if(t.v2.v === this.ends.left) { this.board.unshift({ ...t, f: false }); this.ends.left = t.v1.v; placed = true; }
                } else {
                    if(t.v1.v === this.ends.right) { this.board.push({ ...t, f: false }); this.ends.right = t.v2.v; placed = true; }
                    else if(t.v2.v === this.ends.right) { this.board.push({ ...t, f: true }); this.ends.right = t.v1.v; placed = true; }
                }

                if(placed) {
                    this.pHand.splice(idx, 1);
                    Casino.Audio.playTone(600, 'sine', 0.05);
                    this.checkWin();
                    this.turn = 'cpu';
                    this.render();
                    setTimeout(() => this.aiTurn(), 1000);
                }
            }

            aiTurn() {
                let move = null;
                for(let i=0; i<this.cHand.length; i++) {
                    const t = this.cHand[i];
                    if(t.v1.v === this.ends.left || t.v2.v === this.ends.left) { move = { i, s: 'left' }; break; }
                    if(t.v1.v === this.ends.right || t.v2.v === this.ends.right) { move = { i, s: 'right' }; break; }
                }

                if(move) {
                    const t = this.cHand[move.i];
                    if(move.s === 'left') {
                        if(t.v1.v === this.ends.left) { this.board.unshift({ ...t, f: true }); this.ends.left = t.v2.v; }
                        else { this.board.unshift({ ...t, f: false }); this.ends.left = t.v1.v; }
                    } else {
                        if(t.v1.v === this.ends.right) { this.board.push({ ...t, f: false }); this.ends.right = t.v2.v; }
                        else { this.board.push({ ...t, f: true }); this.ends.right = t.v1.v; }
                    }
                    this.cHand.splice(move.i, 1);
                    Casino.Audio.playTone(500, 'sine', 0.05);
                    this.checkWin();
                } else if(this.deck.length > 0) {
                    this.cHand.push(this.deck.pop());
                    return this.aiTurn();
                }
                this.turn = 'player';
                this.render();
            }

            checkWin() {
                if(this.pHand.length === 0) {
                    Casino.Audio.playWin();
                    Casino.Rewards.saveProgress('reward_domino');
                    Casino.UI.showVictory("Ets el mestre de la constància rítmica! La caixa de Ravel és teva.", () => location.href = 'menu.html');
                } else if(this.cHand.length === 0) {
                    location.reload();
                }
            }

            render() {
                const bCont = document.getElementById('board');
                bCont.innerHTML = '';
                this.board.forEach(t => {
                    const el = this.createTileEl(t, true);
                    if(t.f) el.style.flexDirection = 'row-reverse';
                    bCont.appendChild(el);
                });

                const pCont = document.getElementById('player-hand');
                pCont.innerHTML = '';
                this.pHand.forEach((t, i) => {
                    const el = this.createTileEl(t, false);
                    if(t.v1.v === this.ends.left || t.v2.v === this.ends.left) this.addInd(el, i, 'left');
                    if(t.v1.v === this.ends.right || t.v2.v === this.ends.right) this.addInd(el, i, 'right');
                    pCont.appendChild(el);
                });

                document.getElementById('cpu-info').textContent = `IA: ${this.cHand.length} Fitxes`;
            }

            createTileEl(t, board) {
                const el = document.createElement('div');
                el.className = 'tile' + (board ? ' horizontal' : '');
                el.innerHTML = `
                    <div class="tile-half"><img src="${t.v1.img}"></div>
                    <div class="tile-half"><img src="${t.v2.img}"></div>
                `;
                return el;
            }

            addInd(el, i, side) {
                const ind = document.createElement('div');
                ind.className = 'play-indicator';
                ind.textContent = side === 'left' ? '◀' : '▶';
                ind.style.cssText = side === 'left' ? 'left:0; top:0; bottom:0; width:20px;' : 'right:0; top:0; bottom:0; width:20px;';
                ind.onclick = (e) => { e.stopPropagation(); this.play(i, side); };
                el.appendChild(ind);
            }
        }

        const game = new DominoGame();
    </script>
</body>
</html>
