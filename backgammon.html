<!DOCTYPE html>
<html lang="ca">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Backgammon Rítmic</title>
    <link rel="stylesheet" href="css/casino-common.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        .game-layout {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex: 1;
        }

        #board-container {
            width: 90vmin;
            height: 60vmin;
            background: var(--wood-border, #3e2723);
            border: 15px solid var(--wood-light, #8d6e63);
            border-radius: 10px;
            display: flex;
            position: relative;
            box-shadow: 0 0 50px rgba(0,0,0,0.8);
        }

        .board-half {
            flex: 1;
            background: #d1c4e9;
            position: relative;
            display: flex;
            border-right: 8px solid #3e2723;
            overflow: hidden;
        }

        .board-half:last-child { border-right: none; }

        .triangle {
            flex: 1;
            height: 40%;
            clip-path: polygon(50% 100%, 0 0, 100% 0);
            position: absolute;
            width: 16.66%;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .triangle.top { top: 0; }
        .triangle.bottom { bottom: 0; transform: rotate(180deg); }
        .triangle:nth-child(odd) { background: #b71c1c; }
        .triangle:nth-child(even) { background: #212121; }
        .triangle:hover { opacity: 0.8; }

        .piece {
            width: 80%;
            aspect-ratio: 1;
            border-radius: 50%;
            position: absolute;
            left: 10%;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
            box-shadow: 2px 2px 10px rgba(0,0,0,0.5);
        }

        .piece.white { background: #fff; color: #000; border: 2px solid #ccc; }
        .piece.black { background: #111; color: #fff; border: 2px solid #333; }
        .piece img { width: 60%; }

        .dice-area {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            gap: 20px;
            z-index: 100;
        }

        .die {
            width: 60px;
            height: 60px;
            background: white;
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 5px 20px rgba(0,0,0,0.7);
        }

        .die img { width: 80%; }

        .stats-hud {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 1.2rem;
            color: var(--gold);
        }
    </style>
</head>

<body>
    <div class="casino-table">
        <div class="stats-hud">VICTÒRIES: <span id="wins">0</span> / 3</div>

        <div class="game-layout">
            <div id="board-container">
                <div class="board-half" id="left-half"></div>
                <div class="board-half" id="right-half"></div>

                <div class="dice-area">
                    <div class="die" id="die-1">🎲</div>
                    <div class="die" id="die-2">🎲</div>
                </div>
            </div>

            <button class="modal-btn" onclick="game.roll()" style="margin-top:30px;">LLANÇAR DAUS RÍTMICS</button>
        </div>
    </div>

    <script src="js/casino-common.js"></script>
    <script>
        Casino.Audio.init('music/background_music_main.mp3');
        Casino.UI.injectBasicUI('Backgammon Rítmic');

        const NOTES = [
            { val: 4, img: 'images/rodona.jpg' },
            { val: 2, img: 'images/blanca.jpg' },
            { val: 1, img: 'images/negra.jpg' },
            { val: 0.5, img: 'images/corxera.jpg' }
        ];

        class BackgammonGame {
            constructor() {
                this.wins = 0;
                this.dice = [];
                this.board = Array(25).fill().map(() => []);
                this.initBoard();
                this.render();
                
                setTimeout(() => {
                    Casino.UI.showModal('bg-instr', 'EL TABLER DE PITÀGORES', 
                        'Mou les teves fitxes blanques pel tauler segons el valor dels rumbes rítmics. <br><br>' +
                        'Rodona: 4 | Blanca: 2 | Negra: 1 <br><br>' +
                        'Porta totes les fitxes a casa per guanyar!', 'COMENÇAR JOC');
                }, 500);
            }

            initBoard() {
                // Standard setup
                this.board[1] = [{ col:'black', n:2 }];
                this.board[12] = [{ col:'black', n:5 }];
                this.board[17] = [{ col:'black', n:3 }];
                this.board[19] = [{ col:'black', n:5 }];

                this.board[24] = [{ col:'white', n:2 }];
                this.board[13] = [{ col:'white', n:5 }];
                this.board[8] = [{ col:'white', n:3 }];
                this.board[6] = [{ col:'white', n:5 }];
            }

            roll() {
                const d1 = NOTES[Math.floor(Math.random() * NOTES.length)];
                const d2 = NOTES[Math.floor(Math.random() * NOTES.length)];
                this.dice = [d1.val, d2.val];
                
                document.getElementById('die-1').innerHTML = `<img src="${d1.img}">`;
                document.getElementById('die-2').innerHTML = `<img src="${d2.img}">`;
                
                Casino.Audio.playTone(200, 'square', 0.2);
                
                // Simplified move logic for demo
                this.simulateMove();
            }

            simulateMove() {
                // We'll simulate a move toward home for the first white stack found
                for (let i = 24; i > 0; i--) {
                    if (this.board[i].length > 0 && this.board[i][0].col === 'white') {
                        const steps = Math.ceil(this.dice[0] || 1);
                        const target = i - steps;
                        if (target >= 1) {
                            const p = this.board[i].pop();
                            this.board[target] = [{ col:'white', n: (this.board[target][0]?.n || 0) + 1 }];
                            this.render();
                            Casino.Audio.playTone(400, 'triangle', 0.1);
                            
                            if (target <= 6) {
                                this.wins++;
                                document.getElementById('wins').textContent = this.wins;
                                if (this.wins >= 3) {
                                    Casino.Rewards.saveProgress('reward_backgammon');
                                    Casino.UI.showVictory("Pitàgores estaria orgullós! La llei de les vibracions és teva.", () => location.href = 'menu.html');
                                }
                            }
                            return;
                        }
                    }
                }
            }

            render() {
                const left = document.getElementById('left-half');
                const right = document.getElementById('right-half');
                left.innerHTML = ''; right.innerHTML = '';

                for (let i = 13; i <= 18; i++) this.renderPoint(i, left, true);
                for (let i = 19; i <= 24; i++) this.renderPoint(i, right, true);
                for (let i = 12; i >= 7; i--) this.renderPoint(i, left, false);
                for (let i = 6; i >= 1; i--) this.renderPoint(i, right, false);
            }

            renderPoint(idx, container, isTop) {
                const tri = document.createElement('div');
                tri.className = `triangle ${isTop ? 'top' : 'bottom'}`;
                let x = isTop ? (idx - 13) % 6 : (12 - idx) % 6;
                if (idx >= 19 || idx <= 6) x = isTop ? (idx - 19) : (6 - idx);
                tri.style.left = (x * 16.66) + '%';
                
                const stacks = this.board[idx];
                stacks.forEach(s => {
                    for(let j=0; j<Math.min(s.n, 5); j++) {
                        const p = document.createElement('div');
                        p.className = `piece ${s.col}`;
                        if(isTop) p.style.top = (j * 10) + '%';
                        else p.style.bottom = (j * 10) + '%';
                        tri.appendChild(p);
                    }
                });
                container.appendChild(tri);
            }
        }

        const game = new BackgammonGame();
    </script>
</body>
</html>
