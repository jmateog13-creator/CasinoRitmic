<!DOCTYPE html>
<html lang="ca">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daus Rítmics</title>
    <link rel="stylesheet" href="css/casino-common.css?v=3">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        .game-layout {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-around;
            flex: 1;
            padding: 20px;
        }

        .dice-container {
            display: flex;
            gap: 20px;
            margin: 40px 0;
        }

        .die {
            width: 120px;
            height: 120px;
            background: #fff;
            border-radius: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
            border: 4px solid transparent;
        }

        .die img { width: 80%; pointer-events: none; }
        .die.locked { border-color: var(--gold); box-shadow: 0 0 20px var(--gold); transform: translateY(-10px); }
        .die.locked::after { content: '🔒'; position: absolute; top: 5px; right: 5px; font-size: 1.2rem; }

        .status-hud {
            text-align: center;
            background: rgba(0,0,0,0.5);
            padding: 20px 40px;
            border-radius: 15px;
            border: 2px solid var(--glass-border);
            backdrop-filter: blur(10px);
        }

        .sum-display { font-size: 3rem; color: var(--gold); font-weight: bold; }
        .rolls-display { font-size: 1.2rem; color: #aaa; margin-top: 10px; }

        .progress-tracker { display: flex; gap: 10px; margin-top: 20px; }
        .dot { width: 20px; height: 20px; border: 2px solid var(--gold); border-radius: 50%; transition: all 0.3s; }
        .dot.active { background: var(--gold); box-shadow: 0 0 10px var(--gold); }

        .rolling { animation: dieSpin 0.1s infinite linear; filter: blur(2px); }
        @keyframes dieSpin {
            0% { transform: translateY(-10px); }
            50% { transform: translateY(10px); }
            100% { transform: translateY(-10px); }
        }
    </style>
</head>

<body>
    <div class="casino-table">
        <div class="game-layout">
            <div class="status-hud">
                <div style="color:#aaa; text-transform:uppercase; letter-spacing:2px;">Quants temps sumen els daus?</div>
                <div class="sum-display" id="sum">?</div>
                <div class="rolls-display" id="rolls">Llançaments restants: 5</div>
                
                <div class="progress-tracker">
                    <div class="dot" id="dot0"></div>
                    <div class="dot" id="dot1"></div>
                    <div class="dot" id="dot2"></div>
                    <div class="dot" id="dot3"></div>
                </div>
            </div>

            <div class="dice-container">
                <div class="die" id="die0" onclick="game.toggle(0)"><img src="images/negra.jpg"></div>
                <div class="die" id="die1" onclick="game.toggle(1)"><img src="images/negra.jpg"></div>
                <div class="die" id="die2" onclick="game.toggle(2)"><img src="images/negra.jpg"></div>
                <div class="die" id="die3" onclick="game.toggle(3)"><img src="images/negra.jpg"></div>
            </div>

            <div style="display:flex; gap:15px; flex-wrap:wrap; justify-content:center;">
                <button class="modal-btn" id="roll-btn" onclick="game.roll()">LLANÇAR DAUS! 🎲</button>
                <button class="modal-btn" id="claim-btn" onclick="game.claim()" disabled>COMPÀS COMPLET! 🎼</button>
            </div>
        </div>
    </div>

    <script src="js/casino-common.js?v=3"></script>
    <script>
        Casino.Audio.init('music/background_music_dados.mp3');
        Casino.UI.injectBasicUI('Daus Rítmics');

        const FACES = [
            { v: 0.25, img: 'images/semicorxera.jpg' },
            { v: 0.5, img: 'images/corxera.jpg' },
            { v: 1, img: 'images/negra.jpg' },
            { v: 2, img: 'images/blanca.jpg' }
        ];

        class DiceGame {
            constructor() {
                this.dice = [ {v:1, locked:false}, {v:1, locked:false}, {v:1, locked:false}, {v:1, locked:false} ];
                this.rolls = 5;
                this.wins = 0;
                this.init();
            }

            init() {
                Casino.UI.showModal('dice-instr', 'EL TRESOR DE BACH', 
                    'Els daus tenen figures, no números. Quan creguis que sumen <b>exactament 4 temps</b>, prem COMPÀS COMPLET!<br><br>' +
                    'La suma no surt a la pantalla: l\'has de fer tu. Si cantes compàs i no quadra, perds un compàs guanyat.<br><br>' +
                    '<b>Estratègia:</b> fes clic als daus per bloquejar-los i no tornar-los a llançar. Tens 5 llançaments per torn.', 'A JUGAR');
                this.updateUI();
            }

            toggle(idx) {
                if(this.rolls === 5 || this.rolls === 0) return;
                this.dice[idx].locked = !this.dice[idx].locked;
                Casino.Audio.playTone(600, 'sine', 0.05);
                this.updateUI();
            }

            roll() {
                if(this.rolls <= 0) { this.reset(); return; }
                this.rolls--;
                document.getElementById('roll-btn').disabled = true;
                
                this.dice.forEach((d, i) => {
                    if(!d.locked) document.getElementById('die'+i).classList.add('rolling');
                });
                Casino.Audio.playTone(200, 'square', 0.5);

                setTimeout(() => {
                    this.dice.forEach((d, i) => {
                        if(!d.locked) {
                            const f = FACES[Math.floor(Math.random()*FACES.length)];
                            d.v = f.v;
                            document.getElementById('die'+i).querySelector('img').src = f.img;
                            document.getElementById('die'+i).classList.remove('rolling');
                        }
                    });
                    document.getElementById('roll-btn').disabled = false;
                    this.updateUI();
                }, 600);
            }

            // La destresa és aquí: l'alumne suma les figures i decideix quan canta compàs.
            claim() {
                if(this.rolls === 5) return;
                const sum = this.dice.reduce((a, b) => a + b.v, 0);
                if(sum === 4) {
                    this.wins++;
                    Casino.Audio.playWin();
                    if(this.wins >= 4) return this.winGame();
                    Casino.UI.showModal('win-round', 'COMPÀS PERFECTE!', 'Ben sumat: exactament 4 temps!', 'CONTINUAR', () => this.reset());
                } else {
                    this.wins = Math.max(0, this.wins - 1);
                    Casino.Audio.playLose();
                    Casino.UI.showModal('lose-round', 'NO QUADRA!', `Els daus sumaven <b>${sum} temps</b>, no 4. Perds un compàs guanyat.`, 'CONTINUAR', () => this.reset());
                }
                this.updateUI();
            }

            reset() {
                this.rolls = 5;
                this.dice.forEach(d => { d.locked = false; });
                this.updateUI();
            }

            updateUI() {
                document.getElementById('sum').textContent = '?';
                document.getElementById('claim-btn').disabled = this.rolls === 5;
                document.getElementById('rolls').textContent = `Llançaments restants: ${this.rolls}`;
                document.getElementById('roll-btn').textContent = this.rolls === 0 ? 'TORN NOU' : 'LLANÇAR DAUS! 🎲';
                this.dice.forEach((d, i) => {
                    const el = document.getElementById('die'+i);
                    d.locked ? el.classList.add('locked') : el.classList.remove('locked');
                });
                for(let i=0; i<4; i++) {
                    const dot = document.getElementById('dot'+i);
                    i < this.wins ? dot.classList.add('active') : dot.classList.remove('active');
                }
            }

            winGame() {
                Casino.Audio.playWin();
                Casino.Rewards.saveProgress('reward_daus');
                Casino.UI.showVictory("Has trobat el fragment de l'orgue que va tocar Bach!", () => location.href = 'menu.html');
            }
        }

        const game = new DiceGame();
    </script>
</body>
</html>
