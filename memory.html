<!DOCTYPE html>
<html lang="ca">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory Rítmic</title>
    <link rel="stylesheet" href="css/casino-common.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        .game-layout {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-around;
            flex: 1;
            padding: 20px;
        }

        .memory-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 15px;
            max-width: 800px;
            width: 100%;
        }

        .memory-card {
            aspect-ratio: 3/4;
            background: var(--card-back, #1a237e);
            border: 2px solid var(--gold);
            border-radius: 10px;
            cursor: pointer;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        .memory-card.flipped { transform: rotateY(180deg); }
        .memory-card.matched { opacity: 0.5; cursor: default; filter: grayscale(0.5); }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 8px;
        }

        .card-back { background: var(--card-back, #1a237e); }
        .card-back::after { content: "🎼"; font-size: 2rem; color: var(--gold); }
        
        .card-front {
            background: white;
            transform: rotateY(180deg);
        }

        .card-front img { width: 80%; height: auto; object-fit: contain; }

        .stats-hud {
            display: flex;
            gap: 30px;
            font-size: 1.5rem;
            color: var(--gold);
            text-shadow: var(--text-shadow);
        }
    </style>
</head>

<body>
    <div class="casino-table">
        <div class="game-layout">
            <div class="stats-hud">
                <div>PARELLES: <span id="matches">0</span> / 5</div>
                <div>INTENTS: <span id="attempts">0</span></div>
            </div>

            <div class="memory-grid" id="memory-grid">
                <!-- Cards injected here -->
            </div>

            <button class="modal-btn" onclick="location.reload()">REINICIAR DUEL</button>
        </div>
    </div>

    <script src="js/casino-common.js"></script>
    <script>
        Casino.Audio.init('music/background_music_memory.mp3');
        Casino.UI.injectBasicUI('Memory Rítmic');

        const FIGURES = [
            { id: 'rodona', img: 'images/rodona.jpg', name: 'Rodona' },
            { id: 'blanca', img: 'images/blanca.jpg', name: 'Blanca' },
            { id: 'negra', img: 'images/negra.jpg', name: 'Negra' },
            { id: 'corxera', img: 'images/corxera.jpg', name: 'Corxera' },
            { id: 'semicorxera', img: 'images/semicorxera.jpg', name: 'Semicorxera' }
        ];

        const RESTS = [
            { id: 'rodona', img: 'images/silencirodona.jpg', name: 'Silenci Rodona' },
            { id: 'blanca', img: 'images/silenciblanca.jpg', name: 'Silenci Blanca' },
            { id: 'negra', img: 'images/silencinegra.jpg', name: 'Silenci Negra' },
            { id: 'corxera', img: 'images/silencicorxera.jpg', name: 'Silenci Corxera' },
            { id: 'semicorxera', img: 'images/silencisemicorxera.jpg', name: 'Silenci Semicorxera' }
        ];

        class MemoryGame {
            constructor() {
                this.cards = [];
                this.flippedCards = [];
                this.matches = 0;
                this.attempts = 0;
                this.lockBoard = false;

                this.init();
            }

            init() {
                const deck = [...FIGURES, ...RESTS];
                this.cards = this.shuffle(deck.map(item => ({ ...item, uniqueId: Math.random() })));
                this.render();
                
                setTimeout(() => {
                    Casino.UI.showModal('memory-instr', 'EL DUEL DE MEMÒRIA', 
                        'Troba les parelles corresponents: la figura rítmica i el seu silenci!<br><br>' +
                        '<b>Exemple</b>: Rodona ↔️ Silenci de Rodona.<br><br>' +
                        'Completa el duel per guanyar la relíquia.', 'ENTRAR AL DUEL');
                }, 500);
            }

            shuffle(array) {
                return array.sort(() => Math.random() - 0.5);
            }

            render() {
                const grid = document.getElementById('memory-grid');
                grid.innerHTML = '';
                this.cards.forEach(card => {
                    const cardEl = document.createElement('div');
                    cardEl.className = 'memory-card';
                    cardEl.innerHTML = `
                        <div class="card-face card-back"></div>
                        <div class="card-face card-front"><img src="${card.img}"></div>
                    `;
                    cardEl.onclick = () => this.flipCard(cardEl, card);
                    grid.appendChild(cardEl);
                });
            }

            flipCard(cardEl, cardData) {
                if (this.lockBoard || cardEl.classList.contains('flipped') || cardEl.classList.contains('matched')) return;

                Casino.Audio.playTone(400, 'sine', 0.1);
                cardEl.classList.add('flipped');
                this.flippedCards.push({ el: cardEl, data: cardData });

                if (this.flippedCards.length === 2) {
                    this.attempts++;
                    document.getElementById('attempts').textContent = this.attempts;
                    this.checkMatch();
                }
            }

            checkMatch() {
                this.lockBoard = true;
                const [c1, c2] = this.flippedCards;
                const isMatch = c1.data.id === c2.data.id;

                if (isMatch) {
                    this.handleMatch(c1, c2);
                } else {
                    this.unflipCards(c1, c2);
                }
            }

            handleMatch(c1, c2) {
                this.matches++;
                document.getElementById('matches').textContent = this.matches;
                c1.el.classList.add('matched');
                c2.el.classList.add('matched');
                
                Casino.Audio.playTone(800, 'triangle', 0.2);
                this.flippedCards = [];
                this.lockBoard = false;

                if (this.matches === 5) {
                    setTimeout(() => this.win(), 500);
                }
            }

            unflipCards(c1, c2) {
                setTimeout(() => {
                    c1.el.classList.remove('flipped');
                    c2.el.classList.remove('flipped');
                    this.flippedCards = [];
                    this.lockBoard = false;
                }, 1000);
            }

            win() {
                Casino.Audio.playWin();
                Casino.Rewards.saveProgress('reward_memory');
                Casino.UI.showVictory("Tens una memòria fotogràfica de mestre! El Cervell de Chopin és teu.", () => location.href = 'menu.html');
            }
        }

        const game = new MemoryGame();
    </script>
</body>
</html>
