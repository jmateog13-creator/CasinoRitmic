<!DOCTYPE html>
<html lang="ca">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El Ganxo de l'Ull de Poll</title>
    <link rel="stylesheet" href="css/casino-common.css">
    <style>
        .game-layout {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex: 1;
            padding: 20px;
            width: 100%;
        }

        #game-canvas {
            background: #111;
            border: 10px solid #333;
            border-bottom: 20px solid #222;
            border-radius: 10px;
            box-shadow: 0 0 50px rgba(255,0,255,0.2), inset 0 0 100px rgba(0,0,0,0.8);
        }

        .hud-top {
            display: flex;
            gap: 40px;
            margin-bottom: 20px;
        }

        .hud-item {
            background: rgba(0,0,0,0.8);
            border: 2px solid var(--gold);
            padding: 10px 25px;
            border-radius: 10px;
            text-align: center;
            min-width: 120px;
        }

        .target-box {
            background: rgba(0,255,255,0.1);
            border: 2px solid #00ffff;
            padding: 15px 30px;
            border-radius: 30px;
            color: #00ffff;
            font-size: 1.2rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 20px;
            box-shadow: 0 0 20px rgba(0,255,255,0.2);
        }

        .controls {
            display: flex;
            gap: 20px;
            margin-top: 20px;
        }

        .btn-arcade {
            width: 120px;
            height: 60px;
            background: #444;
            border: 4px solid #666;
            border-radius: 10px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 6px 0 #222;
            transition: all 0.1s;
        }
        .btn-arcade:active { transform: translateY(4px); box-shadow: 0 2px 0 #222; }
        .btn-drop { background: #ff003c; border-color: #aa0022; width: 200px; }
    </style>
</head>

<body>
    <div class="casino-table">
        <div class="game-layout">
            <div class="hud-top">
                <div class="hud-item">
                    <div style="font-size:0.7rem; color:#888;">TEMPS</div>
                    <div id="timer" style="font-size:1.5rem; color:var(--gold);">60</div>
                </div>
                <div class="hud-item">
                    <div style="font-size:0.7rem; color:#888;">RESCATS</div>
                    <div id="score" style="font-size:1.5rem; color:var(--gold);">0/5</div>
                </div>
            </div>

            <div class="target-box">OBJECTIU: <span id="target-name">...</span></div>

            <canvas id="game-canvas" width="800" height="500"></canvas>
            
            <div class="controls">
                <button class="btn-arcade" onmousedown="game.input.left=true" onmouseup="game.input.left=false">⬅️ ESQUERRA</button>
                <button class="btn-arcade btn-drop" onclick="game.drop()">BAIXAR GANXO 🏗️</button>
                <button class="btn-arcade" onmousedown="game.input.right=true" onmouseup="game.input.right=false">DRETA ➡️</button>
            </div>
        </div>
    </div>

    <script src="js/casino-common.js"></script>
    <script>
        Casino.Audio.init('music/background_music_gancho.mp3');
        Casino.UI.injectBasicUI("El Ganxo de l'Ull de Poll");

        const FIGURES = [
            { id: 'rodona', img: 'images/rodona.jpg', n: 'RODONA' },
            { id: 'blanca', img: 'images/blanca.jpg', n: 'BLANCA' },
            { id: 'negra', img: 'images/negra.jpg', n: 'NEGRA' },
            { id: 'corxera', img: 'images/corxera.jpg', n: 'CORXERA' },
            { id: 'semicorxera', img: 'images/semicorxera.jpg', n: 'SEMICORXERA' }
        ];

        class Ball {
            constructor(x, y, data) {
                this.x = x; this.y = y; this.r = 35; this.data = data;
                this.vx = (Math.random()-0.5)*2; this.vy = 0;
                this.img = new Image(); this.img.src = data.img;
                this.grabbed = false;
            }
            update() {
                if(this.grabbed) return;
                this.vy += 0.2; this.x += this.vx; this.y += this.vy;
                if(this.y + this.r > 450) { this.y = 450-this.r; this.vy *= -0.5; this.vx *= 0.98; }
                if(this.x < this.r || this.x > 800-this.r) { this.vx *= -0.8; this.x = Math.max(this.r, Math.min(800-this.r, this.x)); }
            }
            draw(ctx) {
                ctx.save(); ctx.translate(this.x, this.y);
                const g = ctx.createRadialGradient(-10,-10,5,0,0,35);
                g.addColorStop(0, 'rgba(255,255,255,0.8)'); g.addColorStop(1, 'rgba(100,100,200,0.4)');
                ctx.beginPath(); ctx.arc(0,0,this.r,0,Math.PI*2); ctx.fillStyle = g; ctx.fill();
                ctx.strokeStyle = 'rgba(255,255,255,0.3)'; ctx.stroke();
                if(this.img.complete) ctx.drawImage(this.img, -20, -20, 40, 40);
                ctx.restore();
            }
        }

        class ClawGame {
            constructor() {
                this.canvas = document.getElementById('game-canvas');
                this.ctx = this.canvas.getContext('2d');
                this.balls = []; this.claw = { x: 400, y: 50, len: 50, state: 'IDLE', ball: null };
                this.score = 0; this.time = 60; this.target = null;
                this.input = { left:false, right:false };
                this.init();
            }

            init() {
                Casino.UI.showModal('ganxo-instr', 'LA CORDA DE PAGANINI', 
                    'Rescata les figures rítmiques de la vitrina de Paganini amb el ganxo de precisió.<br><br>' +
                    '<b>Missió:</b> Aconsegueix 5 rescats correctes abans que s\'acabi el temps.', 'INSERIR MONEDA');
                
                for(let i=0; i<15; i++) {
                    const f = FIGURES[Math.floor(Math.random()*FIGURES.length)];
                    this.balls.push(new Ball(50+Math.random()*700, 100+Math.random()*300, f));
                }
                this.setTarget();
                setInterval(() => { if(this.time > 0) { this.time--; document.getElementById('timer').textContent = this.time; } }, 1000);
                this.loop();
            }

            setTarget() {
                this.target = FIGURES[Math.floor(Math.random()*FIGURES.length)];
                document.getElementById('target-name').textContent = this.target.n;
            }

            drop() { if(this.claw.state === 'IDLE') this.claw.state = 'DOWN'; }

            update() {
                if(this.claw.state === 'IDLE') {
                    if(this.input.left && this.claw.x > 50) this.claw.x -= 5;
                    if(this.input.right && this.claw.x < 750) this.claw.x += 5;
                } else if(this.claw.state === 'DOWN') {
                    this.claw.len += 4;
                    const b = this.balls.find(b => !b.grabbed && Math.hypot(this.claw.x - b.x, (this.claw.y + this.claw.len) - b.y) < 40);
                    if(b) { this.claw.ball = b; b.grabbed = true; this.claw.state = 'UP'; }
                    if(this.claw.len > 400) this.claw.state = 'UP';
                } else if(this.claw.state === 'UP') {
                    this.claw.len -= 3;
                    if(this.claw.len <= 50) {
                        if(this.claw.ball) {
                            if(this.claw.ball.data.id === this.target.id) {
                                this.score++; Casino.Audio.playTone(800, 'sine', 0.2);
                                this.balls = this.balls.filter(x => x !== this.claw.ball);
                                if(this.score >= 5) this.win();
                                else this.setTarget();
                            } else {
                                Casino.Audio.playTone(100, 'sawtooth', 0.4);
                                this.claw.ball.grabbed = false;
                                this.claw.ball.y = 100;
                            }
                            this.claw.ball = null;
                            document.getElementById('score').textContent = `${this.score}/5`;
                        }
                        this.claw.state = 'IDLE';
                    }
                }
                this.balls.forEach(b => {
                    b.update();
                    if(b.grabbed && this.claw.ball === b) { b.x = this.claw.x; b.y = this.claw.y + this.claw.len; }
                });
            }

            draw() {
                this.ctx.clearRect(0,0,800,500);
                this.ctx.fillStyle = '#222'; this.ctx.fillRect(0, 450, 800, 50); // Floor
                
                // Claw cable
                this.ctx.beginPath(); this.ctx.moveTo(this.claw.x, 0); this.ctx.lineTo(this.claw.x, this.claw.y + this.claw.len);
                this.ctx.strokeStyle = '#666'; this.ctx.lineWidth = 4; this.ctx.stroke();
                // Claw head
                this.ctx.fillStyle = '#888'; this.ctx.fillRect(this.claw.x-15, this.claw.y + this.claw.len, 30, 20);

                this.balls.forEach(b => b.draw(this.ctx));
            }

            loop() {
                this.update(); this.draw();
                if(this.score < 5 && this.time > 0) requestAnimationFrame(() => this.loop());
                else if(this.time <= 0) location.reload();
            }

            win() {
                Casino.Audio.playWin();
                Casino.Rewards.saveProgress('reward_gancho');
                Casino.UI.showVictory("Ets un autèntic virtuós del ganxo! La corda de Paganini és teva.", () => location.href = 'menu.html');
            }
        }

        const game = new ClawGame();
    </script>
</body>
</html>
