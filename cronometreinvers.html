<!DOCTYPE html>
<html lang="ca">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El Cronòmetre Invers</title>
    <link rel="stylesheet" href="css/casino-common.css?v=3">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        .game-layout {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex: 1;
            gap: 40px;
            padding: 20px;
        }

        .timer-display {
            background: rgba(0,0,0,0.5);
            border: 4px solid var(--gold);
            border-radius: 20px;
            padding: 40px;
            text-align: center;
            min-width: 300px;
            box-shadow: 0 0 50px rgba(255,215,0,0.2);
            backdrop-filter: blur(10px);
        }

        .countdown-val {
            font-size: 6rem;
            color: #ff4444;
            font-family: 'Share Tech Mono', monospace;
            text-shadow: 0 0 20px rgba(255,68,68,0.5);
            margin-bottom: 20px;
        }

        .progress-bar {
            width: 100%;
            height: 10px;
            background: rgba(255,255,255,0.1);
            border-radius: 5px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: var(--gold);
            width: 100%;
            transition: width 0.1s linear;
        }

        .controls-grid {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .note-btn {
            width: 120px;
            height: 120px;
            background: rgba(255,255,255,0.05);
            border: 2px solid var(--glass-border);
            border-radius: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
        }

        .note-btn:hover { background: rgba(255,255,255,0.1); border-color: var(--gold); transform: translateY(-5px); }
        .note-btn img { width: 50%; filter: drop-shadow(0 0 5px white); }
        .note-val { margin-top: 10px; color: var(--gold); font-weight: bold; }

        .level-card {
            font-size: 1.5rem;
            color: var(--gold);
            margin-bottom: 20px;
        }
    </style>
</head>

<body>
    <div class="casino-table">
        <div class="game-layout">
            <div class="level-card" id="lvl-info">NIVELL 1 / 5</div>

            <div class="timer-display">
                <div class="countdown-val" id="display">5.00</div>
                <div class="progress-bar">
                    <div class="progress-fill" id="fill"></div>
                </div>
                <div style="color:#aaa; margin-top:10px; font-size:0.8rem;">TEMPS RESTANT: <span id="clock">20</span>s</div>
            </div>

            <div class="controls-grid">
                <div class="note-btn" onclick="game.sub(4)">
                    <img src="images/rodona.jpg">
                    <div class="note-val">-4.0</div>
                </div>
                <div class="note-btn" onclick="game.sub(2)">
                    <img src="images/blanca.jpg">
                    <div class="note-val">-2.0</div>
                </div>
                <div class="note-btn" onclick="game.sub(1)">
                    <img src="images/negra.jpg">
                    <div class="note-val">-1.0</div>
                </div>
                <div class="note-btn" onclick="game.sub(0.5)">
                    <img src="images/corxera.jpg">
                    <div class="note-val">-0.5</div>
                </div>
                <div class="note-btn" onclick="game.sub(0.25)">
                    <img src="images/semicorxera.jpg">
                    <div class="note-val">-0.25</div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/casino-common.js?v=3"></script>
    <script>
        Casino.Audio.init('music/background_music_main.mp3');
        Casino.UI.injectBasicUI('El Cronòmetre Invers');

        const LEVELS = [3.0, 5.0, 7.5, 9.0, 12.0];

        class InversGame {
            constructor() {
                this.level = 0;
                this.current = 0;
                this.timeLeft = 20;
                this.timer = null;
                this.running = false;
                this.init();
            }

            init() {
                Casino.UI.showModal('invers-instr', 'LA LLEI DEL TEMPO', 
                    'Resta valors musicals al cronòmetre per arribar EXACTAMENT a 0.00.<br><br>' +
                    '<b>Alerta:</b> No et passis ni deixis que s\'esgoti el temps de la tirada!', 'ACTIVAR METRÒNOM');
                this.startLvl();
            }

            startLvl() {
                this.current = LEVELS[this.level];
                this.timeLeft = 20;
                this.running = true;
                document.getElementById('lvl-info').textContent = `NIVELL ${this.level + 1} / 5`;
                if(this.timer) clearInterval(this.timer);
                this.timer = setInterval(() => this.tick(), 100);
                this.update();
            }

            tick() {
                if(!this.running) return;
                this.timeLeft -= 0.1;
                if(this.timeLeft <= 0) this.fail("S'HA ACABAT EL TEMPS!");
                this.update();
            }

            sub(v) {
                if(!this.running) return;
                this.current = Math.round((this.current - v) * 100) / 100;
                Casino.Audio.playTone(800, 'sine', 0.1);
                this.update();
                if(this.current === 0) this.winLvl();
                else if(this.current < 0) this.fail("T'HAS PASSAT!");
            }

            update() {
                document.getElementById('display').textContent = this.current.toFixed(2);
                document.getElementById('clock').textContent = Math.max(0, this.timeLeft).toFixed(1);
                document.getElementById('fill').style.width = (this.timeLeft / 20 * 100) + '%';
            }

            fail(msg) {
                this.running = false;
                Casino.Audio.playLose();
                Casino.UI.showModal('fail', 'ERROR DE CÀLCUL', msg, 'REINTENTAR NIVELL', () => this.startLvl());
            }

            winLvl() {
                this.running = false;
                clearInterval(this.timer);
                Casino.Audio.playWin();
                this.level++;
                if(this.level >= LEVELS.length) {
                    Casino.Rewards.saveProgress('reward_cronometreinvers');
                    Casino.UI.showVictory("Has dominat el temps amb precisió algebraica! El metrònom de Maelzel és teu.", () => location.href = 'menu.html');
                } else {
                    Casino.UI.showModal('win', 'EXCEL·LENT!', 'Passem al següent repte.', 'CONTINUAR', () => this.startLvl());
                }
            }
        }

        const game = new InversGame();
    </script>
</body>
</html>
