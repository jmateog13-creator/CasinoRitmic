<!DOCTYPE html>
<html lang="ca">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Casino Rítmic</title>
    <link rel="stylesheet" href="css/casino-common.css?v=2">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        h1 {
            font-size: clamp(3rem, 10vw, 6rem);
            margin-bottom: 0.1em;
            text-shadow: var(--text-shadow);
            color: var(--gold);
        }

        h2 {
            font-size: clamp(1.2rem, 4vw, 2rem);
            margin-top: 0;
            margin-bottom: 2em;
            color: #ccc;
            font-weight: normal;
            font-style: italic;
        }

        .warning-box {
            border: 2px solid var(--gold);
            padding: 25px;
            border-radius: 15px;
            background: rgba(0, 0, 0, 0.4);
            max-width: 700px;
            margin-bottom: 40px;
            backdrop-filter: blur(5px);
        }

        .warning-title {
            color: var(--gold);
            font-weight: bold;
            font-size: 1.3em;
            margin-bottom: 12px;
            display: block;
            text-transform: uppercase;
        }

        .warning-text {
            color: #eee;
            font-size: 1em;
            line-height: 1.6;
        }
    </style>
</head>

<body>
    <div class="casino-table" style="align-items: center; justify-content: center; text-align: center;">
        <h1>CASINO RÍTMIC</h1>
        <h2>El Casino de Beethoven</h2>

        <div class="warning-box">
            <span class="warning-title">⚠️ AVÍS IMPORTANT:</span>
            <span class="warning-text">Aquests jocs són per a practicar les figures rítmiques. En cap moment s’està
                fomentant el joc ni les apostes. S'ha de tenir molt de compte amb els jocs d’atzar i l'addicció al joc.</span>
        </div>

        <a href="menu.html" class="modal-btn" style="text-decoration: none;">ENTRAR AL CASINO</a>
    </div>

    <script src="js/casino-common.js?v=2"></script>
    <script>
        // Init audio context on index just to be ready
        Casino.Audio.init('music/background_music_main.mp3');
    </script>
</body>

</html>
