<!DOCTYPE html>
<html lang="ca">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>L'Embut Classificador</title>
    <link rel="stylesheet" href="css/casino-common.css">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Press Start 2P', cursive; }
        .game-layout {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex: 1;
            padding: 20px;
        }

        #game-canvas {
            background: #111;
            border: 4px solid var(--gold);
            box-shadow: 0 0 50px rgba(0,0,0,0.8), 0 0 20px rgba(255,215,0,0.2);
            image-rendering: pixelated;
        }

        .score-hud {
            position: absolute;
            top: 100px;
            right: 40px;
            background: rgba(0,0,0,0.8);
            border: 2px solid var(--gold);
            padding: 20px;
            color: var(--gold);
            text-align: center;
        }

        .controls-hint {
            margin-top: 20px;
            color: #aaa;
            font-size: 0.8rem;
            text-transform: uppercase;
        }
    </style>
</head>

<body>
    <div class="casino-table">
        <div class="game-layout">
            <div class="score-hud">
                <div>PUNTS</div>
                <div id="points" style="font-size:1.5rem; margin-top:10px;">0</div>
                <div style="font-size:0.6rem; margin-top:5px; color:#666;">OBJECTIU: 1000</div>
            </div>

            <canvas id="game-canvas" width="600" height="700"></canvas>
            
            <div class="controls-hint">FLESXES PER MOURE EL CANAL</div>
        </div>
    </div>

    <script src="js/casino-common.js"></script>
    <script>
        Casino.Audio.init('music/background_music_main.mp3'); // Generic background
        Casino.UI.injectBasicUI("L'Embut Classificador");

        const IMGS = {
            4: 'images/rodona.jpg',
            2: 'images/blanca.jpg',
            1: 'images/negra.jpg',
            0.5: 'images/corxera.jpg',
            0.25: 'images/semicorxera.jpg'
        };

        class EmbutGame {
            constructor() {
                this.canvas = document.getElementById('game-canvas');
                this.ctx = this.canvas.getContext('2d');
                this.score = 0;
                this.notes = [];
                this.bins = [
                    { t: 2, c: 0, l: '2/4', color: '#ff4444' },
                    { t: 3, c: 0, l: '3/4', color: '#44ff44' },
                    { t: 4, c: 0, l: '4/4', color: '#4444ff' }
                ];
                this.gateX = 300;
                this.gateDir = 0;
                this.spawnTimer = 0;
                this.running = false;
                this.loadedImgs = {};
                this.init();
            }

            async init() {
                Casino.UI.showModal('embut-instr', 'EL PÈNDOL D\'HAYDN', 
                    'Dirigeix les notes rítmiques cap als compassos correctes. Omple cada compàs exactament.<br><br>' +
                    '<b>Alerta:</b> Si et passes del temps (Bust), perdràs punts de prestigi!', 'ENTRAR AL TEMPLE');
                
                // Preload
                for(let v in IMGS) {
                    const img = new Image();
                    img.src = IMGS[v];
                    this.loadedImgs[v] = img;
                }

                window.addEventListener('keydown', e => {
                    if(e.key === 'ArrowLeft') this.gateDir = -1;
                    if(e.key === 'ArrowRight') this.gateDir = 1;
                });
                window.addEventListener('keyup', e => this.gateDir = 0);

                this.running = true;
                this.loop();
            }

            spawn() {
                const vals = [4, 2, 1, 0.5, 0.25];
                const v = vals[Math.floor(Math.random()*vals.length)];
                this.notes.push({ x: this.gateX, y: 0, v, vy: 3 + (this.score/500) });
            }

            update() {
                this.gateX += this.gateDir * 8;
                if(this.gateX < 60) this.gateX = 60;
                if(this.gateX > 540) this.gateX = 540;

                this.spawnTimer++;
                if(this.spawnTimer > 80) { this.spawn(); this.spawnTimer = 0; }

                for(let i=this.notes.length-1; i>=0; i--) {
                    const n = this.notes[i];
                    n.y += n.vy;
                    if(n.y < 500) n.x = this.gateX;

                    if(n.y > 620) {
                        this.hit(n);
                        this.notes.splice(i, 1);
                    }
                }
            }

            hit(n) {
                const bIdx = Math.floor(n.x / 200);
                const b = this.bins[bIdx];
                b.c += n.v;
                Casino.Audio.playTone(200, 'square', 0.1);

                if(Math.abs(b.c - b.t) < 0.01) {
                    this.score += 100;
                    b.c = 0;
                    Casino.Audio.playTone(880, 'sine', 0.2);
                } else if(b.c > b.t) {
                    this.score = Math.max(0, this.score - 50);
                    b.c = 0;
                    Casino.Audio.playTone(100, 'sawtooth', 0.3);
                }
                document.getElementById('points').textContent = this.score;
                if(this.score >= 1000) this.win();
            }

            draw() {
                this.ctx.fillStyle = '#111';
                this.ctx.fillRect(0,0,600,700);

                // Bins
                this.bins.forEach((b, i) => {
                    this.ctx.fillStyle = '#222';
                    this.ctx.fillRect(i*200, 600, 200, 100);
                    this.ctx.strokeStyle = '#444';
                    this.ctx.strokeRect(i*200+10, 610, 180, 80);
                    
                    this.ctx.fillStyle = b.color;
                    this.ctx.font = '14px "Press Start 2P"';
                    this.ctx.textAlign = 'center';
                    this.ctx.fillText(b.l, i*200+100, 640);

                    const p = Math.min(b.c/b.t, 1);
                    this.ctx.fillRect(i*200+20, 660, 160*p, 20);
                });

                // Chute
                this.ctx.strokeStyle = '#ffd700';
                this.ctx.lineWidth = 4;
                this.ctx.beginPath();
                this.ctx.moveTo(this.gateX-30, 0);
                this.ctx.lineTo(this.gateX-30, 500);
                this.ctx.moveTo(this.gateX+30, 0);
                this.ctx.lineTo(this.gateX+30, 500);
                this.ctx.stroke();

                // Notes
                this.notes.forEach(n => {
                    const img = this.loadedImgs[n.v];
                    if(img && img.complete) {
                        this.ctx.drawImage(img, n.x-20, n.y-25, 40, 50);
                    }
                });
            }

            loop() {
                if(!this.running) return;
                this.update();
                this.draw();
                requestAnimationFrame(() => this.loop());
            }

            win() {
                this.running = false;
                Casino.Audio.playWin();
                Casino.Rewards.saveProgress('reward_embut');
                Casino.UI.showVictory("Has dominat el tempo clàssic! El pèndol d'Haydn és teu.", () => location.href = 'menu.html');
            }
        }

        const game = new EmbutGame();
    </script>
</body>
</html>
