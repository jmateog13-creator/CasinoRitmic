<!DOCTYPE html>
<html lang="ca">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simon Rítmic</title>
    <link rel="stylesheet" href="css/casino-common.css?v=2">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        .game-layout {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-around;
            flex: 1;
        }

        .simon-board {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            width: 320px;
            height: 320px;
            padding: 20px;
            background: rgba(0,0,0,0.5);
            border-radius: 50%;
            border: 10px solid var(--wood-border);
            box-shadow: 0 0 50px rgba(0,0,0,0.8);
            position: relative;
        }

        .pad {
            width: 100%;
            height: 100%;
            border: 4px solid #111;
            cursor: pointer;
            transition: all 0.1s;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .pad img {
            width: 70%;
            height: 70%;
            object-fit: contain;
            filter: brightness(0.5);
            transition: all 0.1s;
        }

        .pad.active {
            filter: brightness(2);
            box-shadow: 0 0 40px currentColor;
            transform: scale(0.95);
        }

        .pad.active img {
            filter: brightness(1.2);
        }

        /* Pad colors */
        #pad-0 { border-radius: 100% 0 0 0; border-color: #ff4444; color: #ff4444; }
        #pad-1 { border-radius: 0 100% 0 0; border-color: #44ff44; color: #44ff44; }
        #pad-2 { border-radius: 0 0 0 100%; border-color: #4444ff; color: #4444ff; }
        #pad-3 { border-radius: 0 0 100% 0; border-color: #ffff44; color: #ffff44; }

        .score-hud {
            font-size: 2rem;
            color: var(--gold);
            text-shadow: var(--text-shadow);
        }

        .center-circle {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100px;
            height: 100px;
            background: var(--dark);
            border: 5px solid var(--gold);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }
    </style>
</head>

<body>
    <div class="casino-table">
        <div class="game-layout">
            <div class="score-hud">RONDA: <span id="round-display">1</span></div>

            <div class="simon-board">
                <div class="center-circle">
                    <span style="color:var(--gold); font-weight:bold; font-size:1.5rem;">🎹</span>
                </div>
                <div class="pad" id="pad-0" onclick="game.handleInput(0)"><img src="images/rodona.jpg"></div>
                <div class="pad" id="pad-1" onclick="game.handleInput(1)"><img src="images/blanca.jpg"></div>
                <div class="pad" id="pad-2" onclick="game.handleInput(2)"><img src="images/negra.jpg"></div>
                <div class="pad" id="pad-3" onclick="game.handleInput(3)"><img src="images/corxera.jpg"></div>
            </div>

            <button class="modal-btn" id="start-btn" onclick="game.start()">COMENÇAR CONCERT</button>
        </div>
    </div>

    <script src="js/casino-common.js?v=2"></script>
    <script>
        Casino.Audio.init('music/background_music_simon.mp3');
        Casino.UI.injectBasicUI('Simon Rítmic');

        // Pols: negra = 0.5s. Cada pad sona la DURADA real de la seva figura.
        const NOTES = [
            { freq: 261.63, dur: 2.0, img: 'images/rodona.jpg' },   // C4 - Rodona (4 temps)
            { freq: 329.63, dur: 1.0, img: 'images/blanca.jpg' },   // E4 - Blanca (2 temps)
            { freq: 392.00, dur: 0.5, img: 'images/negra.jpg' },    // G4 - Negra (1 temps)
            { freq: 523.25, dur: 0.25, img: 'images/corxera.jpg' }  // C5 - Corxera (1/2 temps)
        ];

        class SimonGame {
            constructor() {
                this.sequence = [];
                this.userInput = [];
                this.isPlayingSequence = false;
                this.round = 1;
                this.canInput = false;

                setTimeout(() => this.showInstructions(), 500);
            }

            showInstructions() {
                Casino.UI.showModal('simon-instr', 'EL SIMON BEETHOVEN',
                    'Observa i escolta la seqüència de figures rítmiques i repeteix-la exactament.<br><br>' +
                    'Cada figura sona la seva DURADA real: la rodona és la més llarga i la corxera la més curta. Memoritza la frase rítmica!<br><br>' +
                    'Cada ronda s\'afegeix una nota més. Arriba a la ronda 10 per guanyar la relíquia!', 'ESTRENYER L\'OÏDA');
            }

            start() {
                document.getElementById('start-btn').classList.add('hidden');
                this.sequence = [];
                this.round = 1;
                this.nextRound();
            }

            nextRound() {
                this.userInput = [];
                this.canInput = false;
                document.getElementById('round-display').textContent = this.round;
                this.sequence.push(Math.floor(Math.random() * 4));
                this.playSequence();
            }

            async playSequence() {
                this.isPlayingSequence = true;
                await new Promise(r => setTimeout(r, 1000));
                for (let i = 0; i < this.sequence.length; i++) {
                    await this.activatePad(this.sequence[i]);
                    await new Promise(r => setTimeout(r, 150)); // Silenci d'articulació entre figures
                }
                this.isPlayingSequence = false;
                this.canInput = true;
            }

            async activatePad(id) {
                const pad = document.getElementById(`pad-${id}`);
                const dur = NOTES[id].dur;
                pad.classList.add('active');
                Casino.Audio.playTone(NOTES[id].freq, 'sine', dur);
                await new Promise(r => setTimeout(r, dur * 1000));
                pad.classList.remove('active');
            }

            handleInput(id) {
                if (!this.canInput || this.isPlayingSequence) return;
                
                this.activatePad(id);
                this.userInput.push(id);
                
                const index = this.userInput.length - 1;
                if (this.userInput[index] !== this.sequence[index]) {
                    this.gameOver();
                    return;
                }

                if (this.userInput.length === this.sequence.length) {
                    this.canInput = false;
                    if (this.round === 10) {
                        this.win();
                    } else {
                        this.round++;
                        setTimeout(() => this.nextRound(), 1000);
                    }
                }
            }

            gameOver() {
                Casino.Audio.playLose();
                Casino.UI.showModal('gameover', 'DESAFINAT!', `Has arribat a la ronda ${this.round}. Torna-ho a provar!`, 'REINTENTAR', () => location.reload());
            }

            win() {
                Casino.Rewards.saveProgress('reward_simon');
                Casino.UI.showVictory("Tens una oïda absoluta! La Memòria de Bach és teva.", () => location.href = 'menu.html');
            }
        }

        const game = new SimonGame();
    </script>
</body>
</html>
