<!DOCTYPE html>
<html lang="ca">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blackjack Rítmic</title>
    <link rel="stylesheet" href="css/casino-common.css?v=3">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        .game-area {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            flex: 1;
            padding: 20px;
        }

        .hand-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .cards-row {
            display: flex;
            gap: 15px;
            min-height: 140px;
            justify-content: center;
            perspective: 1000px;
        }

        .card {
            width: 100px;
            height: 140px;
            background: white;
            border-radius: 10px;
            border: 2px solid #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            position: relative;
            animation: dealCard 0.5s ease-out;
        }

        @keyframes dealCard {
            from { transform: translateY(-200px) rotate(20deg); opacity: 0; }
            to { transform: translateY(0) rotate(0); opacity: 1; }
        }

        .card img { width: 70%; height: auto; object-fit: contain; }
        .card .value-badge {
            position: absolute;
            bottom: 5px;
            right: 5px;
            background: var(--gold);
            color: #000;
            padding: 2px 6px;
            border-radius: 5px;
            font-size: 0.8rem;
            font-weight: bold;
        }

        .score-display {
            font-size: 1.2rem;
            color: var(--gold);
            text-shadow: var(--text-shadow);
            font-weight: bold;
        }

        .controls-panel {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 20px;
        }

        .stats-hud {
            display: flex;
            justify-content: space-around;
            background: rgba(0,0,0,0.5);
            padding: 10px;
            border-radius: 15px;
            border: 1px solid var(--gold);
            margin-bottom: 20px;
        }

        .bet-input-wrap {
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--gold);
        }

        input[type="number"] {
            width: 80px;
            background: #111;
            border: 1px solid var(--gold);
            color: white;
            padding: 5px;
            border-radius: 5px;
            text-align: center;
        }
    </style>
</head>

<body>
    <div class="casino-table">
        <div class="game-area">
            <div class="stats-hud">
                <div>PUNTS: <span id="wallet" style="color:var(--gold); font-weight:bold;">0</span> / 1000</div>
                <div>MÀ: <span id="attempts-display">1</span></div>
            </div>

            <!-- Rival Hand -->
            <div class="hand-container">
                <div class="score-display">RIVAL: <span id="dealer-score">?</span></div>
                <div id="dealer-hand" class="cards-row"></div>
            </div>

            <!-- Message Area -->
            <div id="message-area" style="text-align:center; font-size:1.5rem; min-height:2rem; font-weight:bold;"></div>

            <!-- Player Hand -->
            <div class="hand-container">
                <div id="player-hand" class="cards-row"></div>
                <div class="score-display">ELS TEUS RITMES: <span id="player-score">???</span></div>
            </div>

            <!-- Controls -->
            <div class="controls-panel" id="betting-controls">
                <button class="modal-btn" onclick="game.deal()">REPARTIR</button>
            </div>

            <div class="controls-panel hidden" id="game-controls">
                <button class="modal-btn" onclick="game.hit()">MÉS RITME (+)</button>
                <button class="modal-btn" onclick="game.stand()">M'HO QUEDO</button>
            </div>

            <div class="controls-panel hidden" id="declare-controls">
                <div style="width:100%; text-align:center; font-size:1.2rem; margin-bottom:8px;">Quants temps sumen les teves cartes?</div>
                <div id="declare-options" style="display:flex; gap:10px; flex-wrap:wrap; justify-content:center;"></div>
            </div>

            <div class="controls-panel hidden" id="restart-controls">
                <button class="modal-btn" onclick="game.startBettingPhase()">NOVA MÀ</button>
            </div>
        </div>
    </div>

    <script src="js/casino-common.js?v=3"></script>
    <script>
        Casino.Audio.init('music/background_music_blackjack.mp3');
        Casino.UI.injectBasicUI('Blackjack Rítmic');

        const CARD_TYPES = [
            { name: "Rodona", value: 4.0, img: "images/rodona.jpg" },
            { name: "Blanca", value: 2.0, img: "images/blanca.jpg" },
            { name: "Negra", value: 1.0, img: "images/negra.jpg" },
            { name: "Corxera", value: 0.5, img: "images/corxera.jpg" },
            { name: "Semicorxera", value: 0.25, img: "images/semicorxera.jpg" }
        ];

        const TARGET_SCORE = 10.0;
        const DEALER_STAND = 7.5;
        const GOAL = 1000;
        const COUNT_OK = 50, HAND_WIN = 100, COUNT_KO = 50;

        // Sense apostes: els punts surten de COMPTAR bé la teva mà (les cartes no
        // porten número). Guanyar al rival només suma si, a més, l'has comptada bé.
        class BlackjackGame {
            constructor() {
                this.points = 0;
                this.playerHand = [];
                this.dealerHand = [];
                this.gameOver = false;
                this.attempts = 1;

                this.ui = {
                    wallet: document.getElementById('wallet'),
                    dealerHand: document.getElementById('dealer-hand'),
                    playerHand: document.getElementById('player-hand'),
                    dealerScore: document.getElementById('dealer-score'),
                    playerScore: document.getElementById('player-score'),
                    message: document.getElementById('message-area'),
                    bettingControls: document.getElementById('betting-controls'),
                    gameControls: document.getElementById('game-controls'),
                    declareControls: document.getElementById('declare-controls'),
                    declareOptions: document.getElementById('declare-options'),
                    restartControls: document.getElementById('restart-controls'),
                    attemptsDisplay: document.getElementById('attempts-display')
                };

                setTimeout(() => this.showInstructions(), 500);
            }

            showInstructions() {
                Casino.UI.showModal('blackjack-instr', 'BLACKJACK RÍTMIC',
                    'Demana cartes fins a acostar-te a <b>10 temps</b> sense passar-te. Les cartes no porten número: has de sumar les figures tu.<br><br>' +
                    '<b>Rodona</b>: 4 | <b>Blanca</b>: 2 | <b>Negra</b>: 1 | <b>Corxera</b>: 0.5 | <b>Semicorxera</b>: 0.25<br><br>' +
                    `Quan et plantis, digues quant suma la teva mà. Compte bo: +${COUNT_OK} punts. Si a més guanyes al rival: +${HAND_WIN} més. ` +
                    `Compte dolent: -${COUNT_KO}.<br><br>Arriba a ${GOAL} punts per guanyar la taula.`, 'ENDAVANT');
            }

            startBettingPhase() {
                this.gameOver = false;
                this.playerHand = [];
                this.dealerHand = [];
                this.ui.playerHand.innerHTML = '';
                this.ui.dealerHand.innerHTML = '';
                this.ui.dealerScore.textContent = '?';
                this.ui.playerScore.textContent = '???';
                this.ui.message.textContent = '';
                this.ui.message.className = '';
                this.ui.bettingControls.classList.remove('hidden');
                this.ui.gameControls.classList.add('hidden');
                this.ui.declareControls.classList.add('hidden');
                this.ui.restartControls.classList.add('hidden');
                this.updateUI();
            }

            deal() {
                this.ui.bettingControls.classList.add('hidden');
                this.ui.gameControls.classList.remove('hidden');
                this.dealCard(this.playerHand, this.ui.playerHand);
                this.dealCard(this.playerHand, this.ui.playerHand);
                this.dealCard(this.dealerHand, this.ui.dealerHand);
                this.ui.dealerScore.textContent = this.getScore(this.dealerHand).toFixed(2);
            }

            dealCard(hand, container) {
                const card = CARD_TYPES[Math.floor(Math.random() * CARD_TYPES.length)];
                hand.push(card);
                const cardEl = document.createElement('div');
                cardEl.className = 'card';
                cardEl.innerHTML = `<img src="${card.img}" alt="${card.name}">`;
                container.appendChild(cardEl);
                Casino.Audio.playClick();
            }

            getScore(hand) {
                return hand.reduce((sum, c) => sum + c.value, 0);
            }

            updateUI() {
                this.ui.wallet.textContent = this.points;
                this.ui.attemptsDisplay.textContent = this.attempts;
            }

            hit() {
                if (this.gameOver) return;
                this.dealCard(this.playerHand, this.ui.playerHand);
                // Cap avís automàtic de "t'has passat": saber-ho és part del repte.
            }

            stand() {
                if (this.gameOver) return;
                this.ui.gameControls.classList.add('hidden');
                this.askCount();
            }

            askCount() {
                const real = this.getScore(this.playerHand);
                const opts = new Set([real]);
                for (const d of [0.25, -0.25, 0.5, -0.5, 1, -1, 2]) {
                    if (opts.size >= 4) break;
                    if (real + d > 0 && Math.random() < 0.7) opts.add(real + d);
                }
                for (const d of [0.5, 1, 1.5, 2]) { if (opts.size < 4) opts.add(real + d); }
                this.ui.declareOptions.innerHTML = '';
                [...opts].sort((a, b) => a - b).forEach(v => {
                    const b = document.createElement('button');
                    b.className = 'modal-btn';
                    b.textContent = String(v).replace('.', ',') + ' temps';
                    b.onclick = () => this.declare(v);
                    this.ui.declareOptions.appendChild(b);
                });
                this.ui.declareControls.classList.remove('hidden');
            }

            declare(v) {
                this.ui.declareControls.classList.add('hidden');
                const pScore = this.getScore(this.playerHand);
                this.ui.playerScore.textContent = pScore.toFixed(2);
                if (Math.abs(v - pScore) > 0.001) {
                    this.points = Math.max(0, this.points - COUNT_KO);
                    return this.endRound(`COMPTE EQUIVOCAT: sumaven ${pScore} temps. -${COUNT_KO}`, 'lose');
                }
                this.points += COUNT_OK;
                if (pScore > TARGET_SCORE) return this.endRound(`BEN COMPTAT (+${COUNT_OK}), però t'has passat de 10.`, 'draw');
                this.dealerTurn();
            }

            dealerTurn() {
                const step = () => {
                    const dScore = this.getScore(this.dealerHand);
                    this.ui.dealerScore.textContent = dScore.toFixed(2);
                    if (dScore < DEALER_STAND) {
                        this.dealCard(this.dealerHand, this.ui.dealerHand);
                        setTimeout(step, 800);
                    } else {
                        this.finalize();
                    }
                };
                step();
            }

            finalize() {
                const pScore = this.getScore(this.playerHand);
                const dScore = this.getScore(this.dealerHand);
                const winMsg = `+${COUNT_OK} pel compte i +${HAND_WIN} per la mà!`;
                if (dScore > TARGET_SCORE) { this.points += HAND_WIN; this.endRound("EL RIVAL ES PASSA! " + winMsg, 'win'); }
                else if (pScore > dScore) { this.points += HAND_WIN; this.endRound("MILLOR RITME! " + winMsg, 'win'); }
                else if (pScore < dScore) this.endRound(`EL RIVAL GUANYA LA MÀ. Però has comptat bé: +${COUNT_OK}`, 'draw');
                else this.endRound(`EMPAT. Has comptat bé: +${COUNT_OK}`, 'draw');
            }

            endRound(msg, result) {
                this.gameOver = true;
                this.ui.message.textContent = msg;
                this.ui.message.className = result;
                this.ui.gameControls.classList.add('hidden');
                this.ui.restartControls.classList.remove('hidden');
                if (result === 'win') Casino.Audio.playWin();
                else if (result === 'lose') Casino.Audio.playLose();
                this.attempts++;
                this.updateUI();
                if (this.points >= GOAL) {
                    Casino.Rewards.saveProgress('reward_blackjack');
                    Casino.UI.showVictory("Has comptat cada mà com un mestre! L'As de Beethoven és teu.", () => location.href = 'menu.html');
                }
            }
        }

        const game = new BlackjackGame();
    </script>
</body>
</html>
