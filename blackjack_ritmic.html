<!DOCTYPE html>
<html lang="ca">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blackjack Rítmic</title>
    <link rel="stylesheet" href="css/casino-common.css?v=2">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        .game-area {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            flex: 1;
            padding: 20px;
        }

        .hand-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .cards-row {
            display: flex;
            gap: 15px;
            min-height: 140px;
            justify-content: center;
            perspective: 1000px;
        }

        .card {
            width: 100px;
            height: 140px;
            background: white;
            border-radius: 10px;
            border: 2px solid #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            position: relative;
            animation: dealCard 0.5s ease-out;
        }

        @keyframes dealCard {
            from { transform: translateY(-200px) rotate(20deg); opacity: 0; }
            to { transform: translateY(0) rotate(0); opacity: 1; }
        }

        .card img { width: 70%; height: auto; object-fit: contain; }
        .card .value-badge {
            position: absolute;
            bottom: 5px;
            right: 5px;
            background: var(--gold);
            color: #000;
            padding: 2px 6px;
            border-radius: 5px;
            font-size: 0.8rem;
            font-weight: bold;
        }

        .score-display {
            font-size: 1.2rem;
            color: var(--gold);
            text-shadow: var(--text-shadow);
            font-weight: bold;
        }

        .controls-panel {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 20px;
        }

        .stats-hud {
            display: flex;
            justify-content: space-around;
            background: rgba(0,0,0,0.5);
            padding: 10px;
            border-radius: 15px;
            border: 1px solid var(--gold);
            margin-bottom: 20px;
        }

        .bet-input-wrap {
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--gold);
        }

        input[type="number"] {
            width: 80px;
            background: #111;
            border: 1px solid var(--gold);
            color: white;
            padding: 5px;
            border-radius: 5px;
            text-align: center;
        }
    </style>
</head>

<body>
    <div class="casino-table">
        <div class="game-area">
            <div class="stats-hud">
                <div>CRÈDITS: <span id="wallet" style="color:var(--gold); font-weight:bold;">1000</span> 🪙</div>
                <div>APOSTA: <span id="bet-display" style="color:var(--gold); font-weight:bold;">0</span> 🪙</div>
                <div>INTENT: <span id="attempts-display">1</span></div>
            </div>

            <!-- Dealer Hand -->
            <div class="hand-container">
                <div class="score-display">BANCA: <span id="dealer-score">?</span></div>
                <div id="dealer-hand" class="cards-row"></div>
            </div>

            <!-- Message Area -->
            <div id="message-area" style="text-align:center; font-size:1.5rem; height:2rem; font-weight:bold;"></div>

            <!-- Player Hand -->
            <div class="hand-container">
                <div id="player-hand" class="cards-row"></div>
                <div class="score-display">ELS TEUS RITMES: <span id="player-score">???</span></div>
            </div>

            <!-- Controls -->
            <div class="controls-panel" id="betting-controls">
                <div class="bet-input-wrap">
                    APOSTA: <input type="number" id="bet-input" value="100" min="10" step="10">
                </div>
                <button class="modal-btn" onclick="game.placeBet()">REPARTIR</button>
            </div>

            <div class="controls-panel hidden" id="game-controls">
                <button class="modal-btn" onclick="game.hit()">MÉS RITME (+)</button>
                <button class="modal-btn" onclick="game.stand()">M'HO QUEDO</button>
                <button class="modal-btn" id="btn-reveal" onclick="game.revealScore()" style="background:var(--felt-dark); color:white;">REVELAR (500 🪙)</button>
            </div>

            <div class="controls-panel hidden" id="restart-controls">
                <button class="modal-btn" onclick="game.startBettingPhase()">NOVA JUGADA</button>
            </div>
        </div>
    </div>

    <script src="js/casino-common.js?v=2"></script>
    <script>
        Casino.Audio.init('music/background_music_blackjack.mp3');
        Casino.UI.injectBasicUI('Blackjack Rítmic');

        const CARD_TYPES = [
            { name: "Redona", value: 4.0, img: "images/rodona.jpg" },
            { name: "Blanca", value: 2.0, img: "images/blanca.jpg" },
            { name: "Negra", value: 1.0, img: "images/negra.jpg" },
            { name: "Corxera", value: 0.5, img: "images/corxera.jpg" },
            { name: "Semicorxera", value: 0.25, img: "images/semicorxera.jpg" }
        ];

        const TARGET_SCORE = 10.0;
        const DEALER_STAND = 7.5;

        class BlackjackGame {
            constructor() {
                this.wallet = 1000;
                this.bet = 0;
                this.playerHand = [];
                this.dealerHand = [];
                this.gameOver = false;
                this.scoreRevealed = false;
                this.attempts = 1;

                this.ui = {
                    wallet: document.getElementById('wallet'),
                    betDisplay: document.getElementById('bet-display'),
                    dealerHand: document.getElementById('dealer-hand'),
                    playerHand: document.getElementById('player-hand'),
                    dealerScore: document.getElementById('dealer-score'),
                    playerScore: document.getElementById('player-score'),
                    btnReveal: document.getElementById('btn-reveal'),
                    message: document.getElementById('message-area'),
                    bettingControls: document.getElementById('betting-controls'),
                    gameControls: document.getElementById('game-controls'),
                    restartControls: document.getElementById('restart-controls'),
                    betInput: document.getElementById('bet-input'),
                    attemptsDisplay: document.getElementById('attempts-display')
                };

                setTimeout(() => this.showInstructions(), 500);
            }

            showInstructions() {
                Casino.UI.showModal('blackjack-instr', 'BLACKJACK RÍTMIC', 
                    'Aconsegueix 10 punts exactes o apropa-t\'hi tant com puguis sense passar-te.<br><br>' +
                    '<b>Rodona</b>: 4 | <b>Blanca</b>: 2 | <b>Negra</b>: 1 | <b>Corxera</b>: 0.5 | <b>Semicorxera</b>: 0.25<br><br>' +
                    'Guanya 10.000 monedes per desbloquejar la relíquia!', 'ENDAVANT');
            }

            startBettingPhase() {
                this.gameOver = false;
                this.scoreRevealed = false;
                this.playerHand = [];
                this.dealerHand = [];
                this.ui.playerHand.innerHTML = '';
                this.ui.dealerHand.innerHTML = '';
                this.ui.dealerScore.textContent = '?';
                this.ui.playerScore.textContent = '???';
                this.ui.message.textContent = '';
                this.ui.message.className = '';
                this.ui.bettingControls.classList.remove('hidden');
                this.ui.gameControls.classList.add('hidden');
                this.ui.restartControls.classList.add('hidden');
                this.ui.btnReveal.disabled = false;
                this.ui.btnReveal.textContent = "REVELAR (500 🪙)";
                this.updateUI();
            }

            placeBet() {
                const bet = parseInt(this.ui.betInput.value);
                if (bet > this.wallet) return alert("S'han acabat els bitllets!");
                if (bet <= 0) return alert("Aposta una mica, no?");

                this.bet = bet;
                this.wallet -= bet;
                this.ui.bettingControls.classList.add('hidden');
                this.ui.gameControls.classList.remove('hidden');
                this.ui.betDisplay.textContent = this.bet;
                this.updateUI();
                this.startRound();
            }

            startRound() {
                this.dealCard(this.playerHand, this.ui.playerHand);
                this.dealCard(this.dealerHand, this.ui.dealerHand);
                this.updateScores(false);
            }

            dealCard(hand, container) {
                const card = CARD_TYPES[Math.floor(Math.random() * CARD_TYPES.length)];
                hand.push(card);
                const cardEl = document.createElement('div');
                cardEl.className = 'card';
                cardEl.innerHTML = `<img src="${card.img}"><div class="value-badge">${card.value}</div>`;
                container.appendChild(cardEl);
                Casino.Audio.playClick();
            }

            getScore(hand) {
                return hand.reduce((sum, c) => sum + c.value, 0);
            }

            updateScores(revealPlayer = false) {
                const pScore = this.getScore(this.playerHand);
                const dScore = this.getScore(this.dealerHand);
                this.ui.playerScore.textContent = (revealPlayer || this.scoreRevealed) ? pScore.toFixed(2) : "???";
                this.ui.dealerScore.textContent = dScore.toFixed(2);
                return { pScore, dScore };
            }

            updateUI() {
                this.ui.wallet.textContent = this.wallet;
                this.ui.attemptsDisplay.textContent = this.attempts;
                
                if (this.wallet >= 10000) {
                    Casino.Rewards.saveProgress('reward_blackjack');
                    Casino.UI.showVictory("Has acumulat una fortuna rítmica! L'As de Beethoven és teu.", () => location.href = 'menu.html');
                }
            }

            revealScore() {
                if (this.wallet < 500) return alert("Ets pobre per saber-ho!");
                this.wallet -= 500;
                this.scoreRevealed = true;
                this.ui.btnReveal.disabled = true;
                this.ui.btnReveal.textContent = "COGNICIÓ ACTIVA";
                this.updateScores(true);
                this.updateUI();
            }

            hit() {
                if (this.gameOver) return;
                this.dealCard(this.playerHand, this.ui.playerHand);
                const { pScore } = this.updateScores();
                if (pScore > TARGET_SCORE) this.endRound("T'HAS PASSAT! (BUST)", 'lose');
                else if (pScore === TARGET_SCORE) this.stand();
            }

            stand() {
                if (this.gameOver) return;
                this.ui.gameControls.classList.add('hidden');
                this.updateScores(true);
                this.dealerTurn();
            }

            dealerTurn() {
                const step = () => {
                    const dScore = this.getScore(this.dealerHand);
                    if (dScore < DEALER_STAND) {
                        this.dealCard(this.dealerHand, this.ui.dealerHand);
                        this.updateScores(true);
                        setTimeout(step, 800);
                    } else {
                        this.finalize();
                    }
                };
                step();
            }

            finalize() {
                const pScore = this.getScore(this.playerHand);
                const dScore = this.getScore(this.dealerHand);

                if (dScore > TARGET_SCORE) this.endRound("LA BANCA ES PASSA! GUANYES!", 'win');
                else if (pScore > dScore) this.endRound("MILLOR RITME! GUANYES!", 'win');
                else if (pScore < dScore) this.endRound("LA BANCA GUANYA...", 'lose');
                else this.endRound("EMPAT TÈCNIC", 'draw');
            }

            endRound(msg, result) {
                this.gameOver = true;
                this.ui.message.textContent = msg;
                this.ui.message.className = result;
                this.ui.gameControls.classList.add('hidden');
                this.ui.restartControls.classList.remove('hidden');

                if (result === 'win') {
                    this.wallet += this.bet * 2;
                    Casino.Audio.playWin();
                } else if (result === 'draw') {
                    this.wallet += this.bet;
                } else {
                    Casino.Audio.playLose();
                }
                
                this.attempts++;
                this.updateUI();
                if (this.wallet <= 0) Casino.UI.showModal('gameover', 'SENSE MONEDES', 'La casa sempre guanya. Torna-ho a intentar!', 'REINICIAR', () => location.reload());
            }
        }

        const game = new BlackjackGame();
    </script>
</body>
</html>
