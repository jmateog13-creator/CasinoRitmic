<!DOCTYPE html>
<html lang="ca">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Derby Rítmic</title>
    <link rel="stylesheet" href="css/casino-common.css?v=3">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        .game-layout {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            flex: 1;
            padding: 20px;
            width: 100%;
        }

        .track-container {
            width: 95%;
            height: 250px;
            background: linear-gradient(90deg, #2d5a27 0%, #3e7a36 100%);
            border: 10px solid #4a3728;
            border-radius: 20px;
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 0 50px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            justify-content: space-around;
        }

        .lane { height: 100px; position: relative; border-bottom: 2px dashed rgba(255,255,255,0.1); }
        .finish-line { position: absolute; left: 60px; top: 0; bottom: 0; width: 15px; background: repeating-linear-gradient(0deg, #fff, #fff 10px, #000 10px, #000 20px); z-index: 5; }

        .horse {
            width: 80px;
            height: 80px;
            font-size: 3.5rem;
            position: absolute;
            right: 20px;
            transition: right 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            display: flex;
            justify-content: center;
            align-items: center;
            filter: drop-shadow(0 5px 10px rgba(0,0,0,0.5));
        }

        .challenge-hud {
            text-align: center;
            background: rgba(0,0,0,0.6);
            border: 2px solid var(--gold);
            border-radius: 15px;
            padding: 20px 40px;
            backdrop-filter: blur(10px);
            box-shadow: 0 0 30px rgba(255,215,0,0.2);
        }

        #challenge-val { font-size: 2.5rem; color: var(--gold); font-weight: bold; margin-top: 10px; }

        .rhythm-grid { display: flex; gap: 15px; margin-top: 30px; }
        .note-btn {
            width: 100px; height: 100px; background: white; border-radius: 12px;
            display: flex; justify-content: center; align-items: center; cursor: pointer;
            transition: all 0.2s; box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        .note-btn:hover { transform: translateY(-5px); box-shadow: 0 10px 20px rgba(0,0,0,0.4); }
        .note-btn img { width: 80%; }
        .note-btn.wrong { background: #ff4444; animation: shake 0.3s; }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }
    </style>
</head>

<body>
    <div class="casino-table">
        <div class="game-layout">
            <div style="color:var(--gold); font-size:1.5rem;">VICTÒRIES: <span id="wins">0</span> / 5</div>

            <div class="track-container">
                <div class="finish-line"></div>
                <div class="lane">
                    <div class="horse" id="h-player">🏇<div style="position:absolute; top:-20px; font-size:0.8rem; color:#4fc3f7; font-weight:bold;">TU</div></div>
                </div>
                <div class="lane">
                    <div class="horse" id="h-cpu">🤖<div style="position:absolute; top:-20px; font-size:0.8rem; color:#ff5252; font-weight:bold;">IA</div></div>
                </div>
            </div>

            <div class="challenge-hud">
                <div style="color:#aaa; text-transform:uppercase;">Impuls necessari</div>
                <div id="challenge-val">GENERANT...</div>
            </div>

            <div class="rhythm-grid" id="note-grid">
                <!-- Notes will be injected here -->
            </div>
        </div>
    </div>

    <script src="js/casino-common.js?v=3"></script>
    <script>
        Casino.Audio.init('music/background_music_camellos.mp3');
        Casino.UI.injectBasicUI('Derby Rítmic');

        const NOTES = [
            { id: 'rodona', v: 4, img: 'images/rodona.jpg' },
            { id: 'blanca', v: 2, img: 'images/blanca.jpg' },
            { id: 'negra', v: 1, img: 'images/negra.jpg' },
            { id: 'corxera', v: 0.5, img: 'images/corxera.jpg' },
            { id: 'semicorxera', v: 0.25, img: 'images/semicorxera.jpg' }
        ];

        class DerbyGame {
            constructor() {
                this.wins = 0;
                this.pPos = 20;
                this.cPos = 20;
                this.target = 0;
                this.running = false;
                this.finishDist = 0;
                this.timer = null;
                this.init();
            }

            init() {
                Casino.UI.showModal('derby-instr', 'L\'ARC DE VIVALDI',
                    'Guanya la cursa identificant ràpidament la figura rítmica demanada.<br><br>' +
                    '<b>Sèrie de victòries:</b> Aconsegueix 5 victòries per desbloquejar l\'arc d\'en Vivaldi.', 'A LES PISTES',
                    () => this.startRace());

                this.finishDist = document.querySelector('.track-container').offsetWidth - 130;
                this.genNote();
                this.updateUI();
            }

            startRace() {
                this.pPos = 20; this.cPos = 20;
                this.running = true;
                if(this.timer) clearInterval(this.timer);
                this.timer = setInterval(() => this.aiMove(), 100);
            }

            aiMove() {
                if(!this.running) return;
                const speed = 0.5 + (this.wins * 0.1) + (Math.random() * 2);
                this.cPos += speed;
                this.updateUI();
                if(this.cPos >= this.finishDist) this.endRace('cpu');
            }

            genNote() {
                const note = NOTES[Math.floor(Math.random()*NOTES.length)];
                this.target = note.v;
                document.getElementById('challenge-val').textContent = note.v + ' TEMPS';
                
                const grid = document.getElementById('note-grid');
                grid.innerHTML = '';
                [...NOTES].sort(() => Math.random()-0.5).forEach(n => {
                    const btn = document.createElement('div');
                    btn.className = 'note-btn';
                    btn.innerHTML = `<img src="${n.img}">`;
                    btn.onclick = () => this.check(n, btn);
                    grid.appendChild(btn);
                });
            }

            check(note, btn) {
                if(!this.running) return;
                if(note.v === this.target) {
                    this.pPos += 60;
                    Casino.Audio.playTone(600, 'sine', 0.1);
                    this.updateUI();
                    if(this.pPos >= this.finishDist) this.endRace('player');
                    else this.genNote();
                } else {
                    Casino.Audio.playLose();
                    btn.classList.add('wrong');
                    setTimeout(() => btn.classList.remove('wrong'), 300);
                }
            }

            updateUI() {
                document.getElementById('h-player').style.right = this.pPos + 'px';
                document.getElementById('h-cpu').style.right = this.cPos + 'px';
                document.getElementById('wins').textContent = this.wins;
            }

            endRace(winner) {
                this.running = false;
                clearInterval(this.timer);
                if(winner === 'player') {
                    this.wins++;
                    Casino.Audio.playWin();
                    if(this.wins >= 5) {
                        Casino.Rewards.saveProgress('reward_derby');
                        Casino.UI.showVictory("Has dominat l'hipòdrom! L'arc del violí de Vivaldi és teu.", () => location.href = 'menu.html');
                    } else {
                        Casino.UI.showModal('win', 'VICTÒRIA!', 'Has creuat la meta el primer. Continuem!', 'SEGÜENT CURSA', () => this.startRace());
                    }
                } else {
                    Casino.Audio.playLose();
                    Casino.UI.showModal('lose', 'DERROTA', 'La IA t\'ha superat aquesta vegada.', 'REINTENTAR', () => this.startRace());
                }
                this.updateUI();
            }
        }

        const game = new DerbyGame();
    </script>
</body>
</html>
