<!DOCTYPE html>
<html lang="ca">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gin Rumy Rítmic</title>
    <link rel="stylesheet" href="css/casino-common.css?v=2">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        .game-layout {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            flex: 1;
            padding: 20px;
            width: 100%;
        }

        .opponent-area { height: 120px; display: flex; gap: 10px; margin-bottom: 20px; }
        .center-area { flex: 1; display: flex; justify-content: center; align-items: center; gap: 40px; }
        .player-area { height: 250px; display: flex; flex-direction: column; align-items: center; gap: 20px; }

        .card {
            width: 90px;
            height: 135px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.2s;
            border: 3px solid transparent;
            position: relative;
        }
        .card img { width: 70%; pointer-events: none; }
        .card .val { position: absolute; top: 5px; left: 5px; color: #333; font-weight: bold; font-size: 0.8rem; }
        .card.selected { border-color: var(--gold); transform: translateY(-20px); box-shadow: 0 0 20px var(--gold); }
        .card.back { background: linear-gradient(45deg, #4a0404, #2a0505); border: 2px solid white; cursor: default; }

        .pile {
            width: 100px;
            height: 150px;
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            border: 2px dashed rgba(255,255,255,0.2);
            transition: transform 0.2s;
        }
        .pile:hover { transform: scale(1.05); }
        .pile.stock { background: repeating-linear-gradient(45deg, #001f3f, #001f3f 10px, #0074d9 10px, #0074d9 20px); border: 2px solid white; }
        .pile.discard { background: rgba(255,255,255,0.05); border: 2px dashed var(--gold); }

        .status-hud {
            background: rgba(0,0,0,0.8);
            border: 2px solid var(--gold);
            padding: 10px 30px;
            border-radius: 30px;
            color: var(--gold);
            font-family: 'Playfair Display', serif;
            text-align: center;
        }
    </style>
</head>

<body>
    <div class="casino-table">
        <div class="game-layout">
            <div class="opponent-area" id="cpu-hand"></div>

            <div class="center-area">
                <div class="pile stock" onclick="game.draw('stock')"></div>
                <div class="pile discard" id="discard-pile" onclick="game.draw('discard')"></div>
            </div>

            <div class="player-area">
                <div class="status-hud">
                    SUMA: <span id="sum">0</span> / 4.0 | REPTES: <span id="wins">0</span>/3
                    <div id="phase-msg" style="font-size:0.8rem; color:#fff; margin-top:5px;">ROBA UNA CARTA</div>
                </div>
                <div style="display:flex; gap:15px; align-items:center;">
                    <div id="player-hand" style="display:flex; gap:10px;"></div>
                    <button class="modal-btn" id="discard-btn" onclick="game.discard()" style="display:none; height:135px;">DES-<br>CARTA</button>
                </div>
            </div>
        </div>
    </div>

    <script src="js/casino-common.js?v=2"></script>
    <script>
        Casino.Audio.init('music/background_music_ginrumy.mp3');
        Casino.UI.injectBasicUI('Gin Rumy Rítmic');

        const TYPES = [
            { id: 'rodona', v: 4, img: 'images/rodona.jpg' },
            { id: 'blanca', v: 2, img: 'images/blanca.jpg' },
            { id: 'negra', v: 1, img: 'images/negra.jpg' },
            { id: 'corxera', v: 0.5, img: 'images/corxera.jpg' },
            { id: 'semicorxera', v: 0.25, img: 'images/semicorxera.jpg' }
        ];

        class GinGame {
            constructor() {
                this.deck = [];
                this.pHand = [];
                this.cHand = [];
                this.discardPile = [];
                this.wins = 0;
                this.sel = null;
                this.phase = 'draw'; // draw, discard
                this.init();
            }

            init() {
                Casino.UI.showModal('gin-instr', 'EL CLARINET DE MOZART', 
                    'Aconsegueix una mà de 4 cartes que sumin EXACTAMENT 4 temps per guanyar la ronda.<br><br>' +
                    '<b>Repte:</b> Guanya 3 rondes al mestre Salieri per obtenir el clarinet original de Mozart.', 'SEURE A LA TAULA');
                
                this.startRound();
            }

            startRound() {
                this.deck = [];
                for(let i=0; i<10; i++) TYPES.forEach(t => this.deck.push({...t, uid: Math.random()}));
                this.deck.sort(() => Math.random()-0.5);
                
                this.pHand = this.deck.splice(0, 4);
                this.cHand = this.deck.splice(0, 4);
                this.discardPile = [this.deck.pop()];
                this.phase = 'draw';
                this.render();
            }

            render() {
                const pH = document.getElementById('player-hand');
                pH.innerHTML = '';
                let sum = 0;
                this.pHand.forEach(c => {
                    sum += c.v;
                    const el = this.createC(c);
                    if(this.sel === c.uid) el.classList.add('selected');
                    el.onclick = () => { if(this.phase === 'discard') { this.sel = c.uid; this.render(); } };
                    pH.appendChild(el);
                });

                const cH = document.getElementById('cpu-hand');
                cH.innerHTML = '';
                this.cHand.forEach(() => {
                    const el = document.createElement('div');
                    el.className = 'card back';
                    el.style.width = '60px'; el.style.height = '90px';
                    cH.appendChild(el);
                });

                const dP = document.getElementById('discard-pile');
                const top = this.discardPile[this.discardPile.length-1];
                dP.innerHTML = top ? `<div class="card"><img src="${top.img}"><div class="val">${top.v}</div></div>` : '';

                document.getElementById('sum').textContent = sum;
                document.getElementById('wins').textContent = this.wins;
                document.getElementById('phase-msg').textContent = this.phase === 'draw' ? 'ROBA UNA CARTA DEL MAÇ O DEL DESCART' : 'SELECCIONA UNA CARTA I DESCARTA-LA';
                document.getElementById('discard-btn').style.display = this.phase === 'discard' ? 'block' : 'none';

                if(sum === 4 && this.pHand.length === 4) this.winRound('player');
            }

            createC(c) {
                const el = document.createElement('div');
                el.className = 'card';
                el.innerHTML = `<img src="${c.img}"><div class="val">${c.v}</div>`;
                return el;
            }

            draw(source) {
                if(this.phase !== 'draw') return;
                const card = source === 'stock' ? this.deck.pop() : this.discardPile.pop();
                this.pHand.push(card);
                Casino.Audio.playTone(600, 'sine', 0.1);
                this.phase = 'discard';
                this.render();
            }

            discard() {
                if(!this.sel) return;
                const c = this.pHand.find(x => x.uid === this.sel);
                this.pHand = this.pHand.filter(x => x.uid !== this.sel);
                this.discardPile.push(c);
                Casino.Audio.playTone(400, 'sine', 0.1);
                this.sel = null;
                this.phase = 'draw';
                this.render();
                setTimeout(() => this.ai(), 1500);
            }

            ai() {
                const c = this.deck.pop(); // AI always draws from stock for simplicity
                this.cHand.push(c);
                
                // Find best card to discard (keep sum near 4)
                let bestIdx = 0; let bestDist = 999;
                for(let i=0; i<this.cHand.length; i++) {
                    let s = 0;
                    for(let j=0; j<this.cHand.length; j++) if(i!==j) s += this.cHand[j].v;
                    if(Math.abs(4-s) < bestDist) { bestDist = Math.abs(4-s); bestIdx = i; }
                }
                
                this.discardPile.push(this.cHand.splice(bestIdx, 1)[0]);
                Casino.Audio.playTone(400, 'sine', 0.1);
                
                let fs = 0; this.cHand.forEach(x => fs += x.v);
                if(fs === 4) this.winRound('cpu');
                else this.render();
            }

            winRound(who) {
                Casino.Audio.playTone(1000, 'sine', 0.5);
                if(who === 'player') {
                    this.wins++;
                    if(this.wins >= 3) {
                        Casino.Audio.playWin();
                        Casino.Rewards.saveProgress('reward_ginrumy');
                        Casino.UI.showVictory("Ets el mestre del contrapunt! El clarinet de Mozart ja és teu.", () => location.href = 'menu.html');
                    } else {
                        alert("Has guanyat la ronda!");
                        this.startRound();
                    }
                } else {
                    alert("Salieri ha completat el compàs! Perds la ronda.");
                    this.startRound();
                }
            }
        }

        const game = new GinGame();
    </script>
</body>
</html>
