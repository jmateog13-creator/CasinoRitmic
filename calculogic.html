<!DOCTYPE html>
<html lang="ca">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El Càlcul Lògic</title>
    <link rel="stylesheet" href="css/casino-common.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        .game-layout {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-around;
            flex: 1;
            padding: 20px;
        }

        .equation-bar {
            display: flex;
            align-items: center;
            gap: 20px;
            background: rgba(0, 0, 0, 0.4);
            padding: 30px;
            border-radius: 20px;
            border: 2px solid var(--glass-border);
            backdrop-filter: blur(10px);
        }

        .slot {
            width: 100px;
            height: 100px;
            border: 2px dashed var(--gold);
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: rgba(0,0,0,0.3);
            font-size: 2rem;
            color: var(--gold);
            position: relative;
        }

        .slot.filled { border-style: solid; background: white; }
        .slot img { width: 80%; pointer-events: none; }

        .operator-symbol { font-size: 3rem; color: var(--gold); font-weight: bold; }

        .inventory-panel {
            display: flex;
            gap: 50px;
            margin-top: 40px;
        }

        .inv-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        .draggable {
            width: 80px;
            height: 80px;
            background: rgba(255,255,255,0.1);
            border: 1px solid var(--gold);
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: grab;
            font-size: 1.5rem;
            transition: transform 0.2s;
        }

        .draggable:hover { transform: scale(1.1); background: rgba(255,255,255,0.2); }
        .draggable img { width: 70%; pointer-events: none; }

        .stats-hud {
            font-size: 1.5rem;
            color: var(--gold);
            margin-bottom: 20px;
        }
    </style>
</head>

<body>
    <div class="casino-table">
        <div class="stats-hud">NIVELL: <span id="level">1</span> / 7</div>

        <div class="game-layout">
            <div class="equation-bar" id="pipeline">
                <div class="slot filled" id="in-slot"></div>
                <div class="slot" id="op-slot" ondrop="game.drop(event, 'op')" ondragover="event.preventDefault()">?</div>
                <div class="slot" id="note-slot" ondrop="game.drop(event, 'note')" ondragover="event.preventDefault()">?</div>
                <div class="operator-symbol">=</div>
                <div class="slot filled" id="out-slot"></div>
            </div>

            <div class="inventory-panel">
                <div class="inv-group">
                    <div style="color:var(--gold)">OPERADORS</div>
                    <div style="display:flex; gap:10px;">
                        <div class="draggable" draggable="true" ondragstart="game.drag(event, 'op', '+')">+</div>
                        <div class="draggable" draggable="true" ondragstart="game.drag(event, 'op', '-')">-</div>
                        <div class="draggable" draggable="true" ondragstart="game.drag(event, 'op', '*')">×</div>
                        <div class="draggable" draggable="true" ondragstart="game.drag(event, 'op', '/')">÷</div>
                    </div>
                </div>
                <div class="inv-group">
                    <div style="color:var(--gold)">NOTES</div>
                    <div id="notes-inv" style="display:flex; gap:10px;">
                        <!-- Injected -->
                    </div>
                </div>
            </div>

            <button class="modal-btn" onclick="game.check()" style="margin-top:30px;">VERIFICAR EQUACIÓ 🧪</button>
        </div>
    </div>

    <script src="js/casino-common.js"></script>
    <script>
        Casino.Audio.init('music/background_music_main.mp3');
        Casino.UI.injectBasicUI('El Càlcul Lògic');

        const NOTES = [
            { id: 'rodona', val: 4, img: 'images/rodona.jpg' },
            { id: 'blanca', val: 2, img: 'images/blanca.jpg' },
            { id: 'negra', val: 1, img: 'images/negra.jpg' },
            { id: 'corxera', val: 0.5, img: 'images/corxera.jpg' }
        ];

        const LEVELS = [
            { in: 2, out: 4 }, { in: 1, out: 0.5 }, { in: 4, out: 1 },
            { in: 0.5, out: 1 }, { in: 2, out: 1 }, { in: 1, out: 4 }, { in: 0.5, out: 2 }
        ];

        class Calculogic {
            constructor() {
                this.level = 0;
                this.currentOp = null;
                this.currentNote = null;
                this.init();
            }

            init() {
                Casino.UI.showModal('calc-instr', 'EL SERIALISME DE SCHOENBERG', 
                    'Resol l\'equació rítmica arrossegant l\'operador i la nota correctes.<br><br>' +
                    '<b>Exemple:</b> [Blanca] [+] [Blanca] = [Rodona]', 'ENTRAR AL LABORATORI');
                this.renderNotes();
                this.loadLevel();
            }

            renderNotes() {
                const inv = document.getElementById('notes-inv');
                NOTES.forEach(n => {
                    const d = document.createElement('div');
                    d.className = 'draggable';
                    d.draggable = true;
                    d.innerHTML = `<img src="${n.img}">`;
                    d.ondragstart = (e) => this.drag(e, 'note', n.val, n.img);
                    inv.appendChild(d);
                });
            }

            loadLevel() {
                if (this.level >= LEVELS.length) return this.win();
                const lvl = LEVELS[this.level];
                document.getElementById('level').textContent = this.level + 1;
                
                const inNote = NOTES.find(n => n.val === lvl.in);
                document.getElementById('in-slot').innerHTML = `<img src="${inNote.img}">`;
                
                const outNote = NOTES.find(n => n.val === lvl.out);
                document.getElementById('out-slot').innerHTML = `<img src="${outNote.img}">`;
                
                this.currentOp = null; this.currentNote = null;
                document.getElementById('op-slot').innerHTML = '?';
                document.getElementById('note-slot').innerHTML = '?';
            }

            drag(e, type, val, img) {
                e.dataTransfer.setData('type', type);
                e.dataTransfer.setData('val', val);
                if(img) e.dataTransfer.setData('img', img);
            }

            drop(e, target) {
                const type = e.dataTransfer.getData('type');
                if(type !== target) return;
                
                const val = e.dataTransfer.getData('val');
                const img = e.dataTransfer.getData('img');
                Casino.Audio.playTone(600, 'sine', 0.1);

                if(type === 'op') {
                    this.currentOp = val;
                    e.target.textContent = val === '*' ? '×' : (val === '/' ? '÷' : val);
                } else {
                    this.currentNote = parseFloat(val);
                    e.target.innerHTML = `<img src="${img}">`;
                    e.target.classList.add('filled');
                }
            }

            check() {
                if(!this.currentOp || !this.currentNote) return;
                const lvl = LEVELS[this.level];
                let res = 0;
                if(this.currentOp === '+') res = lvl.in + this.currentNote;
                else if(this.currentOp === '-') res = lvl.in - this.currentNote;
                else if(this.currentOp === '*') res = lvl.in * this.currentNote;
                else if(this.currentOp === '/') res = lvl.in / this.currentNote;

                if(Math.abs(res - lvl.out) < 0.01) {
                    Casino.Audio.playWin();
                    this.level++;
                    this.loadLevel();
                } else {
                    Casino.Audio.playLose();
                    Casino.UI.showModal('fail', 'ERROR DE CÀLCUL', 'L\'equació rítmica no és correcta. Revisa els valors!', 'TORNAR A PROVAR');
                }
            }

            win() {
                Casino.Audio.playWin();
                Casino.Rewards.saveProgress('reward_calculogic');
                Casino.UI.showVictory("Ets un mestre de la lògica serial! La matriu de Schoenberg és teva.", () => location.href = 'menu.html');
            }
        }

        const game = new Calculogic();
    </script>
</body>
</html>
