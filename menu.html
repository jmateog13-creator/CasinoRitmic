<!DOCTYPE html>
<html lang="ca">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menú - Casino Rítmic</title>
    <link rel="stylesheet" href="css/casino-common.css?v=3">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        .game-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            width: 100%;
            overflow-y: auto;
            flex: 1;
            padding: 20px;
            box-sizing: border-box;
            scrollbar-width: thin;
            scrollbar-color: var(--gold) var(--felt-dark);
        }

        .game-grid::-webkit-scrollbar { width: 8px; }
        .game-grid::-webkit-scrollbar-track { background: var(--felt-dark); }
        .game-grid::-webkit-scrollbar-thumb { background: var(--gold); border-radius: 4px; }

        .game-card {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--glass-border);
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            text-decoration: none;
            color: var(--gold);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            aspect-ratio: 1/1;
            backdrop-filter: blur(10px);
        }

        .game-card:hover {
            transform: translateY(-8px) scale(1.02);
            box-shadow: var(--gold-glow);
            border-color: var(--gold);
            background: rgba(255, 215, 0, 0.1);
        }

        .game-card .icon { font-size: 3.5rem; margin-bottom: 10px; transition: transform 0.3s; }
        .game-card:hover .icon { transform: scale(1.1); }
        .game-card h2 { font-size: 1.1rem; margin: 0; font-family: inherit; }

        .game-card.completed {
            border: 2px solid var(--gold);
            background: linear-gradient(135deg, rgba(255, 215, 0, 0.1), rgba(0, 0, 0, 0.4));
        }
        .game-card.completed::after {
            content: "👑";
            position: absolute;
            top: 10px;
            right: 10px;
            font-size: 1.2rem;
        }

        .menu-controls {
            display: flex;
            gap: 15px;
            margin: 20px 0;
            flex-wrap: wrap;
            justify-content: center;
        }

        .relic-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 15px;
            padding: 20px;
        }

        .relic-item {
            text-align: center;
            padding: 10px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.05);
            transition: all 0.3s;
        }

        .relic-item.locked { opacity: 0.3; filter: grayscale(1); }
        .relic-icon { font-size: 2.5rem; margin-bottom: 5px; }
        .relic-name { font-size: 0.8rem; line-height: 1.2; }

        .save-slot {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--gold);
            padding: 15px;
            margin: 10px 0;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }
    </style>
</head>

<body>
    <div class="casino-table">
        <div id="ui-mount"></div> <!-- Casino.UI will inject here or we do it manually -->
        
        <div class="menu-controls">
            <button class="modal-btn" onclick="showRewards()">🏆 PREMIS</button>
            <button class="modal-btn" onclick="openSaveModal()">💾 GUARDAR / CARREGAR</button>
        </div>

        <div id="circuit-bar" style="text-align:center; color:var(--gold); font-size:1.1rem; margin-bottom:6px;"></div>

        <div class="game-grid" id="game-grid">
            <!-- Dynamic Grid -->
        </div>
    </div>

    <script src="js/casino-common.js?v=3"></script>
    <script src="js/game-data.js"></script>
    <script>
        Casino.Audio.init('music/background_music_main.mp3');
        Casino.UI.injectBasicUI('Selecció de Joc');

        const grid = document.getElementById('game-grid');
        const rewards = JSON.parse(sessionStorage.getItem('casinoRewards') || '{}');

        // Circuit: l'XP real només arriba quan guanyes N taules diferents.
        const circ = Casino.Circuit.read();
        const fets = circ.taules.length;
        document.getElementById('circuit-bar').innerHTML =
            `CIRCUIT: ${'●'.repeat(fets)}${'○'.repeat(Casino.Circuit.size - fets)} &nbsp;(${fets}/${Casino.Circuit.size} taules)` +
            (circ.tancats ? ` &nbsp;·&nbsp; Circuits tancats: ${circ.tancats}` : '') +
            `<div style="font-size:0.85rem; color:#ccc;">Guanya ${Casino.Circuit.size} taules diferents per tancar un circuit. Els punts de la sala es queden aquí: no valen res fora.</div>`;

        // Render Games
        Object.entries(CasinoGames).forEach(([id, game]) => {
            const card = document.createElement('a');
            card.href = game.url;
            card.className = `game-card ${rewards[game.key] ? 'completed' : ''}`;
            card.id = id;
            card.innerHTML = `
                <div class="icon">${game.icon}</div>
                <h2>${game.name}</h2>
            `;
            grid.appendChild(card);
        });

        function showRewards() {
            const currentRewards = JSON.parse(sessionStorage.getItem('casinoRewards') || '{}');
            let content = '<div class="relic-grid">';
            Object.values(CasinoGames).forEach(game => {
                const unlocked = currentRewards[game.key];
                content += `
                    <div class="relic-item ${unlocked ? '' : 'locked'}">
                        <div class="relic-icon">${game.icon}</div>
                        <div class="relic-name">${game.name}</div>
                    </div>
                `;
            });
            content += '</div>';
            Casino.UI.showModal('rewards-modal', 'SALA DE TROFEUS', content, 'TANCAR');
        }

        function openSaveModal() {
            renderSaveSlots();
        }

        function renderSaveSlots() {
            const slots = JSON.parse(localStorage.getItem('casinoSaveSlots') || '[null, null, null]');
            let content = '<div style="max-height: 60vh; overflow-y: auto;">';
            slots.forEach((slot, index) => {
                if (slot) {
                    content += `
                        <div class="save-slot">
                            <div style="text-align:left;">
                                <div style="color:var(--gold); font-weight:bold;">${slot.name}</div>
                                <div style="font-size:0.7rem; opacity:0.6;">${slot.date}</div>
                            </div>
                            <div style="display:flex; gap:5px;">
                                <button class="modal-btn" style="padding:5px 10px; font-size:0.8rem;" onclick="loadGame(${index})">CARREGAR</button>
                                <button class="modal-btn" style="padding:5px 10px; font-size:0.8rem; background:#ff4444;" onclick="deleteSlot(${index})">X</button>
                            </div>
                        </div>
                    `;
                } else {
                    content += `
                        <div class="save-slot" style="border-style:dashed; opacity:0.6;">
                            <div>BUIT</div>
                            <button class="modal-btn" style="padding:5px 10px; font-size:0.8rem;" onclick="saveGame(${index})">GUARDAR</button>
                        </div>
                    `;
                }
            });
            content += `</div><button class="modal-btn" style="background:#ff4444; width:100%;" onclick="startNewGame()">NOVA PARTIDA (RESET)</button>`;
            
            Casino.UI.showModal('save-modal', 'PARTIDES GUARDADES', content, 'CANCELLAR');
        }

        // Exposed global functions for modal clicks
        window.saveGame = (index) => {
            const name = prompt("Nom de la partida:", `Partida ${index + 1}`);
            if (!name) return;
            const slots = JSON.parse(localStorage.getItem('casinoSaveSlots') || '[null, null, null]');
            slots[index] = {
                name: name,
                date: new Date().toLocaleString(),
                rewards: JSON.parse(sessionStorage.getItem('casinoRewards') || '{}')
            };
            localStorage.setItem('casinoSaveSlots', JSON.stringify(slots));
            renderSaveSlots();
        };

        window.loadGame = (index) => {
            const slots = JSON.parse(localStorage.getItem('casinoSaveSlots') || '[null, null, null]');
            if (slots[index] && confirm("Carregar partida?")) {
                sessionStorage.setItem('casinoRewards', JSON.stringify(slots[index].rewards));
                location.reload();
            }
        };

        window.deleteSlot = (index) => {
            if (confirm("Esborrar?")) {
                const slots = JSON.parse(localStorage.getItem('casinoSaveSlots') || '[null, null, null]');
                slots[index] = null;
                localStorage.setItem('casinoSaveSlots', JSON.stringify(slots));
                renderSaveSlots();
            }
        };

        window.startNewGame = () => {
            if (confirm("Reiniciar tot?")) {
                sessionStorage.removeItem('casinoRewards');
                location.reload();
            }
        };
    </script>
</body>
</html>
