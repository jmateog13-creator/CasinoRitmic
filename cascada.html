<!DOCTYPE html>
<html lang="ca">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Cascada d'Or</title>
    <link rel="stylesheet" href="css/casino-common.css?v=3">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        .game-layout {
            display: flex;
            width: 100%;
            height: 100%;
            gap: 20px;
            padding: 20px;
        }

        .push-panel {
            flex: 2;
            background: rgba(0,0,0,0.4);
            border: 5px solid var(--gold);
            border-radius: 15px;
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 0 50px #000;
        }

        #gameCanvas { display: block; background: transparent; }

        .question-panel {
            flex: 1;
            background: rgba(0,0,0,0.3);
            border: 2px solid var(--glass-border);
            border-radius: 15px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            backdrop-filter: blur(10px);
        }

        .question-text {
            font-size: 1.3rem;
            color: var(--gold);
            text-align: center;
            min-height: 80px;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
        }

        .option-btn {
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--gold);
            color: white;
            padding: 15px;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
        }

        .option-btn:hover { background: var(--gold); color: black; }

        .stats-hud {
            font-size: 1.5rem;
            color: var(--gold);
            text-align: center;
            margin-bottom: 10px;
        }
    </style>
</head>

<body>
    <div class="casino-table">
        <div class="stats-hud">PUNTS: <span id="score">0</span> / 25</div>

        <div class="game-layout">
            <div class="push-panel">
                <canvas id="gameCanvas" width="800" height="800"></canvas>
            </div>

            <div class="question-panel">
                <div class="question-text" id="q-text">Carregant pregunta...</div>
                <div class="options-grid" id="opts">
                    <!-- Options here -->
                </div>
                <div style="text-align:center; color:#aaa; font-style:italic; font-size:0.9rem;">
                    Respon correctament per baixar la premsa!
                </div>
            </div>
        </div>
    </div>

    <script src="js/casino-common.js?v=3"></script>
    <script>
        Casino.Audio.init('music/background_music_cascada.mp3');
        Casino.UI.injectBasicUI('La Cascada d\'Or');

        const QUESTIONS = [
            { q: "Quant suma una Negra + dos Corxeres?", a: "2 temps", opts: ["1 temps", "1.5 temps", "2 temps", "3 temps"] },
            { q: "A quantes Negres equival una Blanca amb Punt?", a: "3", opts: ["2", "3", "4", "1.5"] },
            { q: "Quina figura val la meitat d'una Negra?", a: "Corxera", opts: ["Blanca", "Semicorxera", "Corxera", "Rodona"] },
            { q: "Quant val una Rodona en compàs 4/4?", a: "4 temps", opts: ["2 temps", "3 temps", "4 temps", "1 temps"] }
        ];

        class Coin {
            constructor(x, y, r) {
                this.x = x; this.y = y; this.r = r;
                this.vx = 0; this.vy = 0;
            }
            update() {
                this.x += this.vx; this.y += this.vy;
                this.vx *= 0.95; this.vy *= 0.95;
                if(this.x < this.r) { this.x = this.r; this.vx *= -1; }
                if(this.x > 800 - this.r) { this.x = 800 - this.r; this.vx *= -1; }
            }
            draw(ctx) {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.r, 0, Math.PI*2);
                const grad = ctx.createRadialGradient(this.x-this.r/3, this.y-this.r/3, this.r/5, this.x, this.y, this.r);
                grad.addColorStop(0, '#fff'); grad.addColorStop(0.3, '#ffd700'); grad.addColorStop(1, '#b8860b');
                ctx.fillStyle = grad; ctx.fill();
                ctx.strokeStyle = '#000'; ctx.lineWidth = 1; ctx.stroke();
            }
        }

        class CascadaGame {
            constructor() {
                this.score = 0;
                this.coins = [];
                this.pusherY = 100;
                this.targetPusherY = 100;
                this.canvas = document.getElementById('gameCanvas');
                this.ctx = this.canvas.getContext('2d');
                this.init();
            }

            init() {
                Casino.UI.showModal('cascada-instr', 'EL BOLERO DE RAVEL', 
                    'Respon correctament les preguntes musicals per empènyer els discs daurats. Cada disc que cau és un punt.<br><br>' +
                    '<b>Objectiu:</b> 25 punts.', 'A JUGAR');
                
                for(let i=0; i<30; i++) this.coins.push(new Coin(Math.random()*700+50, Math.random()*400+300, 30+Math.random()*10));
                this.ask();
                this.loop();
            }

            ask() {
                const q = QUESTIONS[Math.floor(Math.random()*QUESTIONS.length)];
                document.getElementById('q-text').textContent = q.q;
                const opts = document.getElementById('opts');
                opts.innerHTML = '';
                q.opts.forEach(o => {
                    const btn = document.createElement('button');
                    btn.className = 'option-btn';
                    btn.textContent = o;
                    btn.onclick = () => this.check(o, q.a);
                    opts.appendChild(btn);
                });
            }

            check(sel, cor) {
                if(sel === cor) {
                    this.targetPusherY += 40;
                    Casino.Audio.playTone(800, 'sine', 0.1);
                    if(this.targetPusherY > 700) this.targetPusherY = 100; // Reset premsa
                } else {
                    this.targetPusherY -= 40;
                    if(this.targetPusherY < 100) this.targetPusherY = 100;
                    Casino.Audio.playLose();
                }
                this.ask();
            }

            loop() {
                this.ctx.clearRect(0,0,800,800);
                
                // Update Pusher
                if(Math.abs(this.targetPusherY - this.pusherY) > 1) this.pusherY += (this.targetPusherY - this.pusherY) * 0.1;
                this.ctx.fillStyle = '#444';
                this.ctx.fillRect(0, 0, 800, this.pusherY);
                this.ctx.strokeStyle = '#ffd700';
                this.ctx.lineWidth = 5;
                this.ctx.strokeRect(0, 0, 800, this.pusherY);

                // Update Coins
                for(let i=this.coins.length-1; i>=0; i--) {
                    const c = this.coins[i];
                    if(c.y < this.pusherY + c.r) { c.y = this.pusherY + c.r; c.vy += 2; }
                    c.update();
                    c.draw(this.ctx);
                    if(c.y > 850) { 
                        this.score++; 
                        document.getElementById('score').textContent = this.score;
                        this.coins.splice(i, 1);
                        Casino.Audio.playTone(400, 'triangle', 0.2);
                        if(this.score >= 25) this.win();
                    }
                }

                // Simple collisions
                for(let i=0; i<this.coins.length; i++) {
                    for(let j=i+1; j<this.coins.length; j++) {
                        const c1 = this.coins[i], c2 = this.coins[j];
                        const dx = c2.x - c1.x, dy = c2.y - c1.y, d = Math.sqrt(dx*dx+dy*dy);
                        if(d < c1.r + c2.r) {
                            const angle = Math.atan2(dy, dx);
                            c1.vx -= Math.cos(angle)*0.5; c1.vy -= Math.sin(angle)*0.5;
                            c2.vx += Math.cos(angle)*0.5; c2.vy += Math.sin(angle)*0.5;
                        }
                    }
                }

                if(this.score < 25) requestAnimationFrame(() => this.loop());
            }

            win() {
                Casino.Audio.playWin();
                Casino.Rewards.saveProgress('reward_cascada');
                Casino.UI.showVictory("Has dominat la constància del Bolero! La baqueta d'or és teva.", () => location.href = 'menu.html');
            }
        }

        const game = new CascadaGame();
    </script>
</body>
</html>
