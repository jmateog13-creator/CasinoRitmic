<!DOCTYPE html>
<html lang="ca">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Martell Rítmic</title>
    <link rel="stylesheet" href="css/casino-common.css?v=2">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        .game-layout {
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: center;
            flex: 1;
            padding: 40px;
            gap: 60px;
            width: 100%;
        }

        .quiz-panel {
            flex: 1;
            background: rgba(0,0,0,0.4);
            border: 2px solid var(--glass-border);
            border-radius: 20px;
            padding: 30px;
            backdrop-filter: blur(10px);
            display: flex;
            flex-direction: column;
            gap: 20px;
            max-width: 500px;
        }

        .question-box {
            background: rgba(255,255,255,0.05);
            padding: 20px;
            border-radius: 15px;
            font-size: 1.2rem;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .options-list { display: flex; flex-direction: column; gap: 10px; }
        .opt-btn {
            padding: 15px;
            background: rgba(255,255,255,0.1);
            border: 1px solid var(--gold);
            color: white;
            border-radius: 8px;
            cursor: pointer;
            text-align: left;
            transition: all 0.2s;
        }
        .opt-btn:hover { background: var(--gold); color: #000; }

        .tower-panel {
            width: 300px;
            height: 500px;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
        }

        .tower {
            width: 40px;
            height: 100%;
            background: linear-gradient(to bottom, #d32f2f, #fbc02d, #388e3c);
            border: 4px solid #333;
            border-radius: 10px;
            position: relative;
        }

        .weight {
            width: 60px;
            height: 20px;
            background: silver;
            border: 2px solid #000;
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            transition: bottom 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 2;
        }

        .bell {
            width: 100px;
            height: 100px;
            background: radial-gradient(circle, var(--gold), #b8860b);
            border-radius: 50%;
            position: absolute;
            top: -50px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            border: 5px solid white;
            box-shadow: 0 0 30px var(--gold);
        }

        .hammer {
            font-size: 6rem;
            position: absolute;
            bottom: -20px;
            right: -100px;
            transform: rotate(45deg);
            transition: transform 0.2s;
        }
        .hammer.hit-anim { transform: rotate(-45deg); }
    </style>
</head>

<body>
    <div class="casino-table">
        <div class="game-layout">
            <div class="quiz-panel" id="quiz-ui">
                <div style="color:var(--gold); font-size:0.8rem; text-transform:uppercase; letter-spacing:2px;">Pregunta <span id="q-idx">1</span>/10</div>
                <div class="question-box" id="question">Carregant preguntes...</div>
                <div class="options-list" id="options"></div>
            </div>

            <div class="tower-panel">
                <div class="bell">🔔</div>
                <div class="tower">
                    <div class="weight" id="weight"></div>
                </div>
                <div class="hammer" id="hammer">🔨</div>
            </div>
        </div>
    </div>

    <script src="js/casino-common.js?v=2"></script>
    <script>
        Casino.Audio.init('music/background_music_main.mp3');
        Casino.UI.injectBasicUI('Martell Rítmic');

        const QUESTIONS = [
            { q: "Quantes Negres caben en una Rodona?", opts: ["2", "4", "8"], a: 1 },
            { q: "Quina figura dura 0.5 temps?", opts: ["Negra", "Corxera", "Blanca"], a: 1 },
            { q: "Quants temps dura una Blanca amb punt?", opts: ["2", "3", "4"], a: 1 },
            { q: "Quina nota va després de Do?", opts: ["Mi", "Re", "Si"], a: 1 },
            { q: "Què significa 'Allegro'?", opts: ["Lent", "Ràpid", "Trist"], a: 1 },
            { q: "Quants semitons hi ha en una octava?", opts: ["8", "10", "12"], a: 2 },
            { q: "Quina clau s'usa per a notes greus?", opts: ["Sol", "Fa", "Do"], a: 1 },
            { q: "Quin compàs té 3 temps?", opts: ["2/4", "4/4", "3/4"], a: 2 },
            { q: "Quina figura val 2 temps?", opts: ["Blanca", "Negra", "Rodona"], a: 0 },
            { q: "Com es diu el silenci de negra?", opts: ["Z", "Barret", "Rodona"], a: 0 }
        ];

        class StrikerGame {
            constructor() {
                this.cur = 0;
                this.force = 0;
                this.init();
            }

            init() {
                Casino.UI.showModal('strik-instr', 'EL MARTELL DE WAGNER',
                    'Posa a prova els teus coneixements musicals per carregar el martell de Richard Wagner.<br><br>' +
                    '<b>Repte:</b> Respon 10 preguntes correctament per tocar la campana i guanyar el martell del destí.', 'DEMOSTRAR FORÇA');
                
                this.load();
            }

            load() {
                if(this.cur >= QUESTIONS.length) { this.resolve(); return; }
                const q = QUESTIONS[this.cur];
                document.getElementById('q-idx').textContent = this.cur + 1;
                document.getElementById('question').textContent = q.q;
                const opts = document.getElementById('options');
                opts.innerHTML = '';
                q.opts.forEach((o, i) => {
                    const btn = document.createElement('button');
                    btn.className = 'opt-btn';
                    btn.textContent = o;
                    btn.onclick = () => this.answer(i);
                    opts.appendChild(btn);
                });
            }

            answer(idx) {
                if(idx === QUESTIONS[this.cur].a) {
                    this.force++;
                    Casino.Audio.playTone(800, 'sine', 0.1);
                    this.cur++;
                    this.load();
                } else {
                    Casino.Audio.playTone(100, 'sawtooth', 0.5);
                    this.resolve();
                }
            }

            resolve() {
                document.getElementById('quiz-ui').style.opacity = '0.5';
                document.getElementById('quiz-ui').style.pointerEvents = 'none';
                
                const h = document.getElementById('hammer');
                h.classList.add('hit-anim');
                
                setTimeout(() => {
                    Casino.Audio.playTone(100, 'square', 0.3);
                    const w = document.getElementById('weight');
                    const pct = (this.force / 10) * 100;
                    w.style.bottom = pct + '%';
                    
                    if(this.force === 10) {
                        setTimeout(() => this.win(), 1000);
                    } else {
                        setTimeout(() => {
                            alert(`Has aconseguit ${this.force} punts de força. Necessites 10 per guanyar!`);
                            location.reload();
                        }, 1500);
                    }
                }, 300);
            }

            win() {
                Casino.Audio.playTone(1500, 'sine', 1); // Bell sound
                Casino.Audio.playWin();
                Casino.Rewards.saveProgress('reward_highstriker');
                Casino.UI.showVictory("Has dominat el martell del destí! La relíquia de Wagner és teva.", () => location.href = 'menu.html');
            }
        }

        const game = new StrikerGame();
    </script>
</body>
</html>
