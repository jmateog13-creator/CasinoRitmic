<!DOCTYPE html>
<html lang="ca">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>L'Orella de Rossini</title>
    <link rel="stylesheet" href="css/casino-common.css?v=3">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        .game-layout {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-around;
            flex: 1;
        }

        #wheel-container {
            position: relative;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            border: 15px solid var(--wood-border);
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.8), inset 0 0 20px rgba(0, 0, 0, 0.5);
            background: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        #wheel-image {
            width: 80%;
            height: 80%;
            object-fit: contain;
            transition: transform 3s cubic-bezier(0.1, 0, 0.1, 1);
        }

        .blur-spin {
            animation: spinBlur 0.1s infinite linear;
            filter: blur(5px) !important;
        }

        @keyframes spinBlur {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .stats-hud {
            display: flex;
            gap: 40px;
            font-size: 1.5rem;
            color: var(--gold);
            text-shadow: var(--text-shadow);
        }

        .controls-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            min-height: 200px;
        }


        .question-text {
            font-size: 1.8rem;
            color: var(--gold);
            text-shadow: var(--text-shadow);
            text-align: center;
            font-weight: bold;
        }

        .options-grid {
            display: grid;
            grid-template-columns: repeat(5, minmax(0, 1fr));
            gap: 10px;
        }

        .fig-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            padding: 8px;
            font-size: 0.8rem;
        }

        .fig-btn img { width: 56px; height: 56px; object-fit: contain; background: #fff; border-radius: 8px; }

        #wheel-mystery {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 6rem;
            background: #fff;
        }

    </style>
</head>

<body>
    <div class="casino-table">
        <div class="game-layout">
            <div class="stats-hud">
                <div>PUNTS: <span id="points">500</span> / 1500</div>
                <div>RATXA: <span id="streak">0</span> 🔥</div>
            </div>

            <div id="wheel-container">
                <img id="wheel-image" src="images/rodona.jpg" alt="Figura de la ruleta">
                <div id="wheel-mystery" class="hidden" aria-hidden="true">🎧</div>
            </div>

            <div class="controls-area">
                <div id="spin-phase">
                    <p style="text-align:center;">La ruleta tria la figura. Tu l'has d'endevinar d'orella.</p>
                    <button class="modal-btn" id="btn-spin" onclick="game.spin()">GIRAR LA RULETA</button>
                </div>

                <div id="challenge-phase" class="hidden">
                    <div class="question-text">Quina figura ha sonat? Compta els clics.</div>
                    <div class="options-grid" id="options"></div>
                    <div style="text-align:center; margin-top:12px;">
                        <button class="modal-btn" id="btn-replay" onclick="game.listen()">🔁 TORNA-LA A ESCOLTAR</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/casino-common.js?v=3"></script>
    <script>
        Casino.Audio.init('music/background_music_ruleta.mp3');
        Casino.UI.injectBasicUI("L'Orella de Rossini");

        // beats = durada en temps de negra
        const NOTES = [
            { name: "RODONA", beats: 4, img: "images/rodona.jpg" },
            { name: "BLANCA", beats: 2, img: "images/blanca.jpg" },
            { name: "NEGRA", beats: 1, img: "images/negra.jpg" },
            { name: "CORXERA", beats: 0.5, img: "images/corxera.jpg" },
            { name: "SEMICORXERA", beats: 0.25, img: "images/semicorxera.jpg" }
        ];
        const BPM = 100, BEAT = 60 / BPM;         // negra = 0,6 s → semicorxera = 150 ms, audible
        const GOAL = 1500, HIT = 100, MISS = 50, RESCUE = 300;

        // Clic de metrònom i nota sostinguda, programats sobre el rellotge d'àudio
        // (no setTimeout): la durada que sent l'alumne és exacta al mil·lisegon.
        function click(ctx, t, freq, vol) {
            const o = ctx.createOscillator(), g = ctx.createGain();
            o.type = 'square'; o.frequency.setValueAtTime(freq, t);
            g.gain.setValueAtTime(0.25 * vol, t);
            g.gain.exponentialRampToValueAtTime(0.001, t + 0.04);
            o.connect(g).connect(ctx.destination); o.start(t); o.stop(t + 0.05);
        }
        function tone(ctx, t, dur, vol) {
            const o = ctx.createOscillator(), g = ctx.createGain();
            o.type = 'triangle'; o.frequency.setValueAtTime(523.25, t);
            g.gain.setValueAtTime(0, t);
            g.gain.linearRampToValueAtTime(0.35 * vol, t + 0.01);
            g.gain.setValueAtTime(0.35 * vol, t + dur - 0.02);
            g.gain.linearRampToValueAtTime(0, t + dur);
            o.connect(g).connect(ctx.destination); o.start(t); o.stop(t + dur + 0.01);
        }

        class RuletaGame {
            constructor() {
                this.points = 500;
                this.streak = 0;
                this.currentNote = null;
                this.busy = false;
                this.renderOptions();
                setTimeout(() => this.showInstructions(), 500);
            }

            showInstructions() {
                Casino.UI.showModal('ruleta-instr', "L'ORELLA DE ROSSINI",
                    'Gira la ruleta: la sort només tria <b>quina figura</b> sonarà.<br><br>' +
                    'Sentiràs 4 clics de compte enrere i, al cinquè, una nota llarga o curta mentre els clics continuen. ' +
                    'Compta quants clics dura i tria la figura.<br><br>' +
                    `Encert: +${HIT} punts · Error: -${MISS} punts. Arriba a ${GOAL} punts per guanyar la taula.`, 'A ESCOLTAR');
            }

            renderOptions() {
                const box = document.getElementById('options');
                box.innerHTML = '';
                NOTES.forEach(n => {
                    const b = document.createElement('button');
                    b.className = 'modal-btn fig-btn';
                    b.innerHTML = `<img src="${n.img}" alt=""><span>${n.name}</span>`;
                    b.onclick = () => this.checkAnswer(n);
                    box.appendChild(b);
                });
            }

            updateUI() {
                document.getElementById('points').textContent = this.points;
                document.getElementById('streak').textContent = this.streak;
            }

            spin() {
                if (this.busy) return;
                this.busy = true;
                document.getElementById('spin-phase').classList.add('hidden');
                document.getElementById('wheel-mystery').classList.add('hidden');
                Casino.Audio.playClick();

                const wheel = document.getElementById('wheel-image');
                wheel.classList.add('blur-spin');
                setTimeout(() => {
                    wheel.classList.remove('blur-spin');
                    this.currentNote = NOTES[Math.floor(Math.random() * NOTES.length)];
                    wheel.src = this.currentNote.img;       // ja carregada, però amagada fins que respongui
                    document.getElementById('wheel-mystery').classList.remove('hidden');
                    document.getElementById('challenge-phase').classList.remove('hidden');
                    this.listen();
                }, 2000);
            }

            listen() {
                if (!this.currentNote) return;
                const ctx = Casino.state.audioCtx;
                if (!ctx) return;
                if (ctx.state === 'suspended') ctx.resume();
                const bg = Casino.state.bgMusic;
                const bgWasOn = bg && !bg.paused;
                if (bgWasOn) bg.pause();                  // la música de fons taparia la nota
                const vol = Casino.state.isMuted ? 0 : Math.max(0.2, Casino.state.volume);
                const t0 = ctx.currentTime + 0.15;
                for (let i = 0; i < 8; i++) click(ctx, t0 + i * BEAT, i % 4 === 0 ? 1600 : 1000, vol);
                tone(ctx, t0 + 4 * BEAT, this.currentNote.beats * BEAT, vol);

                const btn = document.getElementById('btn-replay');
                btn.disabled = true;
                setTimeout(() => {
                    btn.disabled = false;
                    if (bgWasOn) bg.play().catch(() => {});
                }, (0.15 + 8 * BEAT) * 1000 + 100);
            }

            checkAnswer(note) {
                if (!this.currentNote) return;
                const right = note === this.currentNote;
                const played = this.currentNote;
                this.currentNote = null;
                document.getElementById('wheel-mystery').classList.add('hidden');   // revela la figura

                if (right) {
                    this.streak++;
                    this.points += HIT;
                    Casino.Audio.playWin();
                    this.updateUI();
                    if (this.points >= GOAL) return this.win();
                    Casino.UI.showModal('round-win', 'BONA ORELLA!',
                        `Era una <b>${played.name}</b>: ${played.beats} temps. +${HIT} punts.`, 'SEGÜENT GIR', () => this.nextRound());
                } else {
                    this.streak = 0;
                    this.points = Math.max(0, this.points - MISS);
                    Casino.Audio.playLose();
                    this.updateUI();
                    Casino.UI.showModal('round-lose', 'GAIREBÉ...',
                        `Has triat ${note.name} (${note.beats} temps), però sonava una <b>${played.name}</b> (${played.beats} temps). -${MISS} punts.`,
                        'SEGÜENT GIR', () => this.nextRound());
                }
            }

            nextRound() {
                document.getElementById('challenge-phase').classList.add('hidden');
                document.getElementById('spin-phase').classList.remove('hidden');
                this.busy = false;
                if (this.points <= 0) {
                    // Aquí no es fa fallida: la sala et torna punts perquè segueixis practicant.
                    this.points = RESCUE;
                    this.updateUI();
                    Casino.UI.showModal('rescue', 'LA SALA ET CONVIDA',
                        `T'has quedat sense punts, però aquí no es perd mai del tot. Tens ${RESCUE} punts nous per seguir entrenant l'orella.`, 'SEGUIR JUGANT');
                }
            }

            win() {
                Casino.Rewards.saveProgress('reward_ruleta');
                Casino.UI.showVictory("Has endevinat les figures d'orella! La partitura del Barber de Sevilla és teva.", () => location.href = 'menu.html');
            }
        }

        const game = new RuletaGame();
    </script>
</body>
</html>
