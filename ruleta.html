<!DOCTYPE html>
<html lang="ca">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Ruleta Russa del Tempo</title>
    <link rel="stylesheet" href="css/casino-common.css?v=2">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        .game-layout {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-around;
            flex: 1;
        }

        #wheel-container {
            position: relative;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            border: 15px solid var(--wood-border);
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.8), inset 0 0 20px rgba(0, 0, 0, 0.5);
            background: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        #wheel-image {
            width: 80%;
            height: 80%;
            object-fit: contain;
            transition: transform 3s cubic-bezier(0.1, 0, 0.1, 1);
        }

        .blur-spin {
            animation: spinBlur 0.1s infinite linear;
            filter: blur(5px) !important;
        }

        @keyframes spinBlur {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .stats-hud {
            display: flex;
            gap: 40px;
            font-size: 1.5rem;
            color: var(--gold);
            text-shadow: var(--text-shadow);
        }

        .controls-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            min-height: 200px;
        }

        .bet-input-group {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .question-text {
            font-size: 1.8rem;
            color: var(--gold);
            text-shadow: var(--text-shadow);
            text-align: center;
            font-weight: bold;
        }

        .options-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        #timer-container {
            width: 80%;
            height: 10px;
            background: rgba(0,0,0,0.5);
            border: 1px solid var(--gold);
            border-radius: 5px;
            overflow: hidden;
            display: none;
        }

        #timer-bar {
            width: 100%;
            height: 100%;
            background: linear-gradient(to right, #ff0000, #ff6600);
            transform-origin: left;
        }
    </style>
</head>

<body>
    <div class="casino-table">
        <div class="game-layout">
            <div class="stats-hud">
                <div>VIDES: <span id="lives">3</span> ❤️</div>
                <div>CRÈDITS: <span id="credits">1000</span> 💰</div>
            </div>

            <div id="wheel-container">
                <img id="wheel-image" src="images/rodona.jpg" alt="Nota">
            </div>

            <div id="timer-container">
                <div id="timer-bar"></div>
            </div>

            <div class="controls-area">
                <!-- Betting Phase -->
                <div id="bet-phase">
                    <p style="text-align:center;">FES LA TEVA APOSTA:</p>
                    <div class="bet-input-group">
                        <input type="number" id="bet-amount" value="100" min="10" step="10" style="width:100px; background:#000; border:1px solid var(--gold); color:white; padding:10px; border-radius:10px; text-align:center;">
                        <button class="modal-btn" onclick="game.spin()">GIRAR LA RULETA</button>
                    </div>
                </div>

                <!-- Challenge Phase -->
                <div id="challenge-phase" class="hidden">
                    <div class="question-text" id="question-text">Quantes <span id="note-name">...</span> en caben en una RODONA?</div>
                    <div class="options-grid">
                        <button class="modal-btn" onclick="game.checkAnswer(1)">1</button>
                        <button class="modal-btn" onclick="game.checkAnswer(2)">2</button>
                        <button class="modal-btn" onclick="game.checkAnswer(4)">4</button>
                        <button class="modal-btn" onclick="game.checkAnswer(8)">8</button>
                        <button class="modal-btn" onclick="game.checkAnswer(16)">16</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/casino-common.js?v=2"></script>
    <script>
        Casino.Audio.init('music/background_music_ruleta.mp3');
        Casino.UI.injectBasicUI('Ruleta Russa');

        const NOTES = [
            { name: "RODONA", value: 1, img: "images/rodona.jpg" },
            { name: "BLANCA", value: 2, img: "images/blanca.jpg" },
            { name: "NEGRA", value: 4, img: "images/negra.jpg" },
            { name: "CORXERA", value: 8, img: "images/corxera.jpg" },
            { name: "SEMICORXERA", value: 16, img: "images/semicorxera.jpg" }
        ];

        class RuletaGame {
            constructor() {
                this.lives = 3;
                this.credits = 1000;
                this.currentBet = 0;
                this.currentNote = null;
                this.timerInterval = null;
                this.isSpinning = false;

                setTimeout(() => this.showInstructions(), 500);
            }

            showInstructions() {
                Casino.UI.showModal('ruleta-instr', 'LA RULETA RUSSA', 
                    'Aposta a una figura rítmica i gira la ruleta. Quan s\'aturi, hauràs de respondre quantes figures d\'aquella mena caben en una Rodona!<br><br>' +
                    'Si falles, perds una vida. Arriba a 5.000 crèdits per guanyar la relíquia.', 'ENTENDRE EL RISC');
            }

            updateUI() {
                document.getElementById('lives').textContent = this.lives;
                document.getElementById('credits').textContent = this.credits;
                
                if (this.credits >= 5000) {
                    Casino.Rewards.saveProgress('reward_ruleta');
                    Casino.UI.showVictory("Has dominat el tempo sota pressió! La partitura del Rèquiem és teva.", () => location.href = 'menu.html');
                }
            }

            spin() {
                if (this.isSpinning) return;
                const bet = parseInt(document.getElementById('bet-amount').value);
                if (bet > this.credits || bet <= 0) return alert("Aposta no vàlida!");

                this.isSpinning = true;
                this.currentBet = bet;
                this.credits -= bet;
                this.updateUI();

                document.getElementById('bet-phase').classList.add('hidden');
                Casino.Audio.playClick();

                const wheel = document.getElementById('wheel-image');
                wheel.classList.add('blur-spin');

                // Simulate physics
                setTimeout(() => {
                    wheel.classList.remove('blur-spin');
                    this.currentNote = NOTES[Math.floor(Math.random() * NOTES.length)];
                    wheel.src = this.currentNote.img;
                    this.startChallenge();
                }, 2000);
            }

            startChallenge() {
                document.getElementById('challenge-phase').classList.remove('hidden');
                document.getElementById('note-name').textContent = this.currentNote.name;
                document.getElementById('timer-container').style.display = 'block';

                const timerBar = document.getElementById('timer-bar');
                timerBar.style.transition = 'none';
                timerBar.style.transform = 'scaleX(1)';
                void timerBar.offsetWidth; // Force reflow
                timerBar.style.transition = 'transform 3s linear';
                timerBar.style.transform = 'scaleX(0)';

                let timeLeft = 3000;
                this.timerInterval = setInterval(() => {
                    timeLeft -= 100;
                    if (timeLeft % 1000 === 0) Casino.Audio.playTone(800, 'square', 0.1);
                    if (timeLeft <= 0) this.resolveRound(false, "TEMPS ESGOTAT!");
                }, 100);
            }

            checkAnswer(val) {
                if (!this.currentNote) return;
                clearInterval(this.timerInterval);
                if (val === this.currentNote.value) {
                    this.resolveRound(true, "CORECTE!");
                } else {
                    this.resolveRound(false, "EXPLOSIÓ RÍTMICA!");
                }
            }

            resolveRound(win, msg) {
                clearInterval(this.timerInterval);
                this.isSpinning = false;
                document.getElementById('timer-container').style.display = 'none';
                
                if (win) {
                    this.credits += this.currentBet * 2;
                    Casino.Audio.playWin();
                    Casino.UI.showModal('round-win', '¡GUANYES!', msg + ` +${this.currentBet * 2} 💰`, 'CONTINUAR', () => this.nextRound());
                } else {
                    this.lives--;
                    Casino.Audio.playLose();
                    document.body.classList.add('shake');
                    setTimeout(() => document.body.classList.remove('shake'), 500);
                    Casino.UI.showModal('round-lose', '¡CABUM!', msg, 'REINTENTAR', () => {
                        if (this.lives <= 0) location.reload();
                        else this.nextRound();
                    });
                }
                this.updateUI();
            }

            nextRound() {
                document.getElementById('challenge-phase').classList.add('hidden');
                document.getElementById('bet-phase').classList.remove('hidden');
                if (this.credits <= 0) location.reload();
            }
        }

        const game = new RuletaGame();
    </script>
</body>
</html>
