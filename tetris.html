<!DOCTYPE html>
<html lang="ca">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tetris Rítmic</title>
    <link rel="stylesheet" href="css/casino-common.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        .game-layout {
            display: flex;
            gap: 30px;
            align-items: flex-start;
            justify-content: center;
            flex: 1;
            padding: 20px;
        }

        #tetris-canvas {
            border: 4px solid var(--gold);
            background: rgba(0, 0, 0, 0.6);
            box-shadow: 0 0 30px rgba(0,0,0,0.5);
        }

        .side-panel {
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 220px;
        }

        .stat-box {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid var(--gold);
            padding: 15px;
            border-radius: 10px;
            text-align: center;
        }

        .stat-label { font-size: 0.9rem; color: var(--gold); text-transform: uppercase; margin-bottom: 5px; }
        .stat-val { font-size: 1.8rem; font-weight: bold; }

        #next-canvas {
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(255,215,0,0.3);
            margin-top: 10px;
        }

        .controls-hint {
            font-size: 0.8rem;
            color: #aaa;
            line-height: 1.5;
        }
    </style>
</head>

<body>
    <div class="casino-table">
        <div class="game-layout">
            <canvas id="tetris-canvas" width="240" height="600"></canvas>
            
            <div class="side-panel">
                <div class="stat-box">
                    <div class="stat-label">Punts</div>
                    <div id="score" class="stat-val">0</div>
                    <div style="font-size:0.7rem; margin-top:5px; opacity:0.6;">OBJECTIU: 2000</div>
                </div>

                <div class="stat-box">
                    <div class="stat-label">Següent</div>
                    <canvas id="next-canvas" width="120" height="120"></canvas>
                </div>

                <div class="stat-box">
                    <div class="stat-label">Controls</div>
                    <div class="controls-hint">
                        ⬅️ ➡️ Moure Lateral<br>
                        ⬇️ Baixada Ràpida<br>
                        Pausa: (En desenvolupament)
                    </div>
                </div>

                <button class="modal-btn" onclick="location.reload()">REINICIAR</button>
            </div>
        </div>
    </div>

    <script src="js/casino-common.js"></script>
    <script>
        Casino.Audio.init('music/background_music_tetris.mp3');
        Casino.UI.injectBasicUI('Tetris Rítmic');

        const canvas = document.getElementById('tetris-canvas');
        const ctx = canvas.getContext('2d');
        const nextCanvas = document.getElementById('next-canvas');
        const nextCtx = nextCanvas.getContext('2d');

        const COLS = 8;
        const ROWS = 20;
        const SIZE = 30;

        const PIECES = [
            { type: 'corxera', width: 1, color: '#ff4444' },
            { type: 'negra', width: 2, color: '#44ff44' },
            { type: 'blanca', width: 4, color: '#4444ff' },
            { type: 'rodona', width: 8, color: '#ffff44' }
        ];

        let board = Array(ROWS).fill().map(() => Array(COLS).fill(null));
        let score = 0;
        let currentPiece = null;
        let nextPiece = null;
        let gameActive = false;
        let dropCounter = 0;
        let lastTime = 0;

        const IMGS = {};
        ['rodona', 'blanca', 'negra', 'corxera'].forEach(t => {
            IMGS[t] = new Image();
            IMGS[t].src = `images/${t}.jpg`;
        });

        function init() {
            Casino.UI.showModal('tetris-instr', 'EL COMPASSADOR', 
                'Completa línies horitzontals que formin un compàs de 4/4 (4 temps) per guanyar punts. Cada tipus de nota ocupa una amplada diferent.<br><br>' +
                '<b>Rodona</b>: 8 blocs | <b>Blanca</b>: 4 | <b>Negra</b>: 2 | <b>Corxera</b>: 1', 
                'INICIAR', () => {
                    gameActive = true;
                    spawnPiece();
                    requestAnimationFrame(update);
                });
        }

        function spawnPiece() {
            const p = nextPiece || PIECES[Math.floor(Math.random() * PIECES.length)];
            nextPiece = PIECES[Math.floor(Math.random() * PIECES.length)];
            
            currentPiece = {
                type: p.type,
                width: p.width,
                color: p.color,
                x: Math.floor((COLS - p.width) / 2),
                y: 0
            };

            if (collide()) {
                gameActive = false;
                Casino.Audio.playLose();
                Casino.UI.showModal('gameover', 'FI DEL RITME', `Has aconseguit ${score} punts.`, 'REINTENTAR', () => location.reload());
            }
            drawNext();
        }

        function collide() {
            for (let i = 0; i < currentPiece.width; i++) {
                const x = currentPiece.x + i;
                const y = currentPiece.y;
                if (x < 0 || x >= COLS || y >= ROWS || (y >= 0 && board[y][x])) return true;
            }
            return false;
        }

        function merge() {
            for (let i = 0; i < currentPiece.width; i++) {
                board[currentPiece.y][currentPiece.x + i] = currentPiece;
            }
        }

        function sweep() {
            let rowCount = 0;
            outer: for (let y = ROWS - 1; y >= 0; y--) {
                for (let x = 0; x < COLS; x++) {
                    if (!board[y][x]) continue outer;
                }
                const row = board.splice(y, 1)[0].fill(null);
                board.unshift(row);
                y++;
                rowCount++;
            }
            if (rowCount > 0) {
                score += rowCount * 100 * (rowCount === 4 ? 2 : 1);
                document.getElementById('score').textContent = score;
                Casino.Audio.playTone(600 + (rowCount * 100), 'sine', 0.3);
                if (score >= 2000) {
                    gameActive = false;
                    Casino.Rewards.saveProgress('reward_tetris');
                    Casino.UI.showVictory("Has harmonitzat el caos medieval! La Ploma de Hildegard és teva.", () => location.href = 'menu.html');
                }
            }
        }

        function update(time = 0) {
            if (!gameActive) return;
            const dt = time - lastTime;
            lastTime = time;
            dropCounter += dt;
            if (dropCounter > 1000) {
                drop();
            }
            draw();
            requestAnimationFrame(update);
        }

        function drop() {
            currentPiece.y++;
            if (collide()) {
                currentPiece.y--;
                merge();
                sweep();
                spawnPiece();
                Casino.Audio.playTone(200, 'square', 0.1);
            }
            dropCounter = 0;
        }

        function draw() {
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Grid
            ctx.strokeStyle = '#111';
            ctx.beginPath();
            for (let x = 0; x <= COLS; x++) { ctx.moveTo(x*SIZE, 0); ctx.lineTo(x*SIZE, canvas.height); }
            for (let y = 0; y <= ROWS; y++) { ctx.moveTo(0, y*SIZE); ctx.lineTo(canvas.width, y*SIZE); }
            ctx.stroke();

            // Board
            for (let y = 0; y < ROWS; y++) {
                for (let x = 0; x < COLS; x++) {
                    if (board[y][x]) drawBlock(ctx, x, y, board[y][x]);
                }
            }
            // Current
            for (let i = 0; i < currentPiece.width; i++) {
                drawBlock(ctx, currentPiece.x + i, currentPiece.y, currentPiece);
            }
        }

        function drawBlock(c, x, y, piece) {
            c.fillStyle = piece.color;
            c.fillRect(x * SIZE, y * SIZE, SIZE, SIZE);
            c.strokeStyle = '#000';
            c.strokeRect(x * SIZE, y * SIZE, SIZE, SIZE);
            try {
                c.drawImage(IMGS[piece.type], x * SIZE + 2, y * SIZE + 2, SIZE - 4, SIZE - 4);
            } catch (e) {}
        }

        function drawNext() {
            nextCtx.fillStyle = '#000';
            nextCtx.fillRect(0, 0, nextCanvas.width, nextCanvas.height);
            const p = nextPiece;
            const startX = (nextCanvas.width - p.width * 15) / 2;
            nextCtx.fillStyle = p.color;
            nextCtx.fillRect(startX, 50, p.width * 15, 15);
        }

        window.addEventListener('keydown', e => {
            if (!gameActive) return;
            if (e.key === 'ArrowLeft') { currentPiece.x--; if(collide()) currentPiece.x++; else Casino.Audio.playTone(400, 'triangle', 0.05); }
            if (e.key === 'ArrowRight') { currentPiece.x++; if(collide()) currentPiece.x--; else Casino.Audio.playTone(400, 'triangle', 0.05); }
            if (e.key === 'ArrowDown') drop();
        });

        init();
    </script>
</body>
</html>
