<!DOCTYPE html>
<html lang="ca">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Joker Poker Rítmic</title>
    <link rel="stylesheet" href="css/casino-common.css">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        .game-layout {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex: 1;
            padding: 20px;
            width: 100%;
            background: #00008b;
            font-family: 'Press Start 2P', cursive;
        }

        .pay-table {
            background: #000044;
            border: 2px solid var(--gold);
            padding: 15px;
            display: flex;
            gap: 40px;
            margin-bottom: 30px;
            font-size: 0.7rem;
            color: white;
        }

        .cards-hand {
            display: flex;
            gap: 15px;
            margin-bottom: 40px;
        }

        .poker-card {
            width: 110px;
            height: 160px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            border: 4px solid transparent;
        }
        .poker-card img { width: 60%; pointer-events: none; }
        .poker-card .val { font-size: 1rem; color: #000; margin-top: 10px; }
        .poker-card.joker { background: linear-gradient(135deg, #fff, #ffdfba); border: 2px solid #ff00ff; }
        .poker-card.joker .emoji { font-size: 3rem; }

        .game-hud {
            width: 100%;
            max-width: 600px;
            background: rgba(0,0,0,0.8);
            border: 2px solid white;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            color: var(--neon-yellow);
            margin-bottom: 20px;
        }

        .btn-poker {
            background: #ff0000;
            color: white;
            border: 4px solid white;
            padding: 15px 30px;
            font-family: 'Press Start 2P', cursive;
            cursor: pointer;
            box-shadow: 4px 4px 0 #000;
        }
        .btn-poker:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0 #000; }

        .joker-modal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            color: white;
            text-align: center;
        }
        .joker-opts { display: flex; gap: 20px; margin-top: 30px; }
    </style>
</head>

<body>
    <div class="casino-table">
        <div class="game-layout">
            <div class="pay-table">
                <div>NATURAL 4.0 <span style="color:var(--gold)">x10</span></div>
                <div>JOKER 4.0 <span style="color:var(--gold)">x5</span></div>
            </div>

            <div class="cards-hand" id="hand"></div>

            <div class="game-hud">
                <div>SALDO: <span id="credits">100</span></div>
                <div>VICTÒRIES: <span id="wins">0</span>/5</div>
            </div>

            <button class="btn-poker" id="btn-deal" onclick="game.play()">REPARTIR MÀ</button>
        </div>
    </div>

    <!-- Joker Calculation Modal -->
    <div class="joker-modal" id="j-modal">
        <h2 style="color:var(--gold); margin-bottom:20px;">JOKER WILD!</h2>
        <div id="j-equation" style="font-size:1.5rem; margin-bottom:20px;">X + 2.0 = 4.0</div>
        <p>Quin valor ha de tenir el Joker per completar el compàs?</p>
        <div class="joker-opts" id="j-opts"></div>
    </div>

    <script src="js/casino-common.js"></script>
    <script>
        Casino.Audio.init('music/background_music_jokerwild.mp3');
        Casino.UI.injectBasicUI('Joker Poker Rítmic');

        const TYPES = [
            { id: 'rodona', v: 4, img: 'images/rodona.jpg' },
            { id: 'blanca', v: 2, img: 'images/blanca.jpg' },
            { id: 'negra', v: 1, img: 'images/negra.jpg' },
            { id: 'corxera', v: 0.5, img: 'images/corxera.jpg' },
            { id: 'semicorxera', v: 0.25, img: 'images/semicorxera.jpg' }
        ];

        class PokerGame {
            constructor() {
                this.credits = 100;
                this.wins = 0;
                this.hand = [];
                this.init();
            }

            init() {
                Casino.UI.showModal('jok-instr', 'EL DIARI DE CLARA SCHUMANN', 
                    'Aconsegueix una mà que sumi exactament 4 temps. Si et surt el Joker, hauràs de calcular quin valor li falta a la teva mà.<br><br>' +
                    '<b>Repte:</b> Guanya 5 partides per obtenir el diari secret de Clara Schumann.', 'INSERIR CRÈDITS');
                this.updateUI();
            }

            updateUI() {
                document.getElementById('credits').textContent = this.credits;
                document.getElementById('wins').textContent = this.wins;
            }

            play() {
                if(this.credits < 5) return;
                this.credits -= 5; this.updateUI();
                document.getElementById('btn-deal').style.display = 'none';

                this.hand = [];
                let s = 0;
                for(let i=0; i<4; i++) {
                    const c = TYPES[Math.floor(Math.random()*5)];
                    this.hand.push(c);
                    s += c.v;
                }
                this.hand.push({ id:'joker', isJoker:true });
                this.hand.sort(() => Math.random()-0.5);

                this.render();
                Casino.Audio.playTone(600, 'square', 0.1);

                setTimeout(() => {
                    if(s > 4) {
                        alert("Has superat el límit del compàs! Perds.");
                        this.end();
                    } else if(s === 4) {
                        // Compàs natural: 4.0 exacte sense necessitar el Joker
                        this.credits += 50; this.wins++;
                        Casino.Audio.playTone(900, 'sine', 0.3);
                        alert("COMPÀS NATURAL 4.0! Premi doble.");
                        this.updateUI();
                        this.end();
                    } else {
                        this.askJoker(s);
                    }
                }, 1000);
            }

            render() {
                const h = document.getElementById('hand'); h.innerHTML = '';
                this.hand.forEach(c => {
                    const el = document.createElement('div');
                    el.className = 'poker-card' + (c.isJoker ? ' joker' : '');
                    if(c.isJoker) el.innerHTML = '<div class="emoji">🤡</div><div class="val">JOKER</div>';
                    else el.innerHTML = `<img src="${c.img}"><div class="val">${c.v}</div>`;
                    h.appendChild(el);
                });
            }

            askJoker(sum) {
                const modal = document.getElementById('j-modal');
                const needed = 4 - sum;
                document.getElementById('j-equation').textContent = `${sum} + X = 4.0`;
                
                const opts = document.getElementById('j-opts');
                opts.innerHTML = '';
                const vals = [needed, needed*2, needed/2, 1];
                const final = [...new Set(vals)].sort(() => Math.random()-0.5).slice(0,3);
                if(!final.includes(needed)) final[0] = needed;
                
                final.sort(() => Math.random()-0.5).forEach(v => {
                    const b = document.createElement('button');
                    b.className = 'btn-poker';
                    b.textContent = v;
                    b.onclick = () => this.resolve(v, needed);
                    opts.appendChild(b);
                });
                modal.style.display = 'flex';
            }

            resolve(val, target) {
                document.getElementById('j-modal').style.display = 'none';
                if(Math.abs(val - target) < 0.01) {
                    this.credits += 25; this.wins++;
                    Casino.Audio.playTone(800, 'sine', 0.2);
                    alert("CORRECTE! Joker aplicat.");
                } else {
                    Casino.Audio.playTone(100, 'sawtooth', 0.4);
                    alert(`ERROR! El valor necessari era ${target}.`);
                }
                this.updateUI();
                this.end();
            }

            end() {
                if(this.wins >= 5) this.win();
                else document.getElementById('btn-deal').style.display = 'block';
            }

            win() {
                Casino.Audio.playWin();
                Casino.Rewards.saveProgress('reward_joker');
                Casino.UI.showVictory("Ets un mestre de l'harmonia secreta! El diari de Clara Schumann és teu.", () => location.href = 'menu.html');
            }
        }

        const game = new PokerGame();
    </script>
</body>
</html>
