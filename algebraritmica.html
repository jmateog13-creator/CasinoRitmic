<!DOCTYPE html>
<html lang="ca">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Àlgebra Rítmica</title>
    <link rel="stylesheet" href="css/casino-common.css?v=2">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        #equation-board {
            width: 80%;
            max-width: 800px;
            background: rgba(0, 0, 0, 0.6);
            border: 15px solid var(--wood-border);
            border-radius: 15px;
            padding: 40px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.7);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
            backdrop-filter: blur(10px);
        }

        #equation {
            font-size: 5rem;
            display: flex;
            align-items: center;
            gap: 20px;
            color: var(--gold);
            text-shadow: var(--text-shadow);
        }

        .note-img {
            height: 100px;
            filter: drop-shadow(0 0 10px rgba(255,215,0,0.3));
        }

        .unknown {
            width: 100px;
            height: 100px;
            border: 4px dashed var(--gold);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 3rem;
            border-radius: 10px;
        }

        .options-grid {
            display: flex;
            gap: 20px;
            margin-top: 40px;
        }

        .option-card {
            width: 110px;
            height: 110px;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid var(--glass-border);
            border-radius: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.3s;
        }

        .option-card:hover {
            transform: scale(1.1);
            border-color: var(--gold);
            background: rgba(255, 215, 0, 0.1);
            box-shadow: var(--gold-glow);
        }

        .option-card img {
            width: 70%;
            height: 70%;
            object-fit: contain;
        }

        .stats-hud {
            font-size: 1.5rem;
            color: var(--gold);
            margin-bottom: 20px;
        }
    </style>
</head>

<body>
    <div class="casino-table">
        <div class="stats-hud">PROBLEMES RESOLTS: <span id="wins">0</span> / 5</div>

        <div id="equation-board">
            <div id="equation">
                <!-- Solved by JS -->
            </div>
        </div>

        <div class="options-grid" id="options">
            <!-- Solved by JS -->
        </div>
    </div>

    <script src="js/casino-common.js?v=2"></script>
    <script>
        Casino.Audio.init('music/background_music_main.mp3');
        Casino.UI.injectBasicUI('Àlgebra Rítmica');

        const NOTES = [
            { val: 4, img: 'images/rodona.jpg' },
            { val: 2, img: 'images/blanca.jpg' },
            { val: 1, img: 'images/negra.jpg' },
            { val: 0.5, img: 'images/corxera.jpg' },
            { val: 0.25, img: 'images/semicorxera.jpg' }
        ];

        class AlgebraGame {
            constructor() {
                this.wins = 0;
                this.solution = null;
                this.init();
            }

            init() {
                Casino.UI.showModal('alg-instr', 'ÀLGEBRA DE BACH', 
                    'Resol l\'equació rítmica trobant la figura que falta per completar la igualtat.<br><br>' +
                    'Resol 5 problemes per guanyar la relíquia matemàtica!', 'INICIAR CÀLCUL');
                this.nextProblem();
            }

            nextProblem() {
                const isSum = Math.random() > 0.5;
                let n1 = NOTES[Math.floor(Math.random() * NOTES.length)];
                let n2 = NOTES[Math.floor(Math.random() * NOTES.length)];
                let resVal = isSum ? n1.val + n2.val : Math.abs(n1.val - n2.val);
                
                if (!isSum && n1.val < n2.val) [n1, n2] = [n2, n1];

                this.solution = NOTES.find(n => Math.abs(n.val - resVal) < 0.001);
                if (!this.solution) return this.nextProblem(); // Retry if sum isn't a single note

                document.getElementById('equation').innerHTML = `
                    <img src="${n1.img}" class="note-img">
                    <span style="font-family: serif;">${isSum ? '+' : '-'}</span>
                    <img src="${n2.img}" class="note-img">
                    <span style="font-family: serif;">=</span>
                    <div class="unknown">?</div>
                `;

                const options = [this.solution];
                while(options.length < 4) {
                    const r = NOTES[Math.floor(Math.random() * NOTES.length)];
                    if(!options.includes(r)) options.push(r);
                }
                options.sort(() => Math.random() - 0.5);

                const optDiv = document.getElementById('options');
                optDiv.innerHTML = '';
                options.forEach(o => {
                    const card = document.createElement('div');
                    card.className = 'option-card';
                    card.innerHTML = `<img src="${o.img}">`;
                    card.onclick = () => this.check(o);
                    optDiv.appendChild(card);
                });
            }

            check(note) {
                if (note === this.solution) {
                    this.wins++;
                    document.getElementById('wins').textContent = this.wins;
                    Casino.Audio.playTone(880, 'sine', 0.2);
                    if (this.wins >= 5) {
                        Casino.Rewards.saveProgress('reward_algebra');
                        Casino.UI.showVictory("Ets un matemàtic del ritme! La Pissarra de Schoenberg és teva.", () => location.href = 'menu.html');
                    } else {
                        this.nextProblem();
                    }
                } else {
                    Casino.Audio.playLose();
                    document.body.classList.add('shake');
                    setTimeout(() => document.body.classList.remove('shake'), 500);
                }
            }
        }

        const game = new AlgebraGame();
    </script>
</body>
</html>
