<!DOCTYPE html>
<html lang="ca">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Batalla de Viena</title>
    <link rel="stylesheet" href="css/casino-common.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        .game-layout {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-around;
            flex: 1;
            padding: 20px;
        }

        .battle-center {
            display: flex;
            align-items: center;
            gap: 50px;
            margin: 40px 0;
        }

        .card-slot {
            width: 150px;
            height: 210px;
            border: 2px dashed var(--gold);
            border-radius: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: rgba(0,0,0,0.3);
            position: relative;
        }

        .card {
            width: 100%;
            height: 100%;
            background: white;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
            animation: dealCard 0.5s ease-out;
        }

        @keyframes dealCard {
            from { transform: translateY(-200px) rotate(20deg); opacity: 0; }
            to { transform: translateY(0) rotate(0); opacity: 1; }
        }

        .card img { width: 70%; height: auto; object-fit: contain; }
        .card-val { font-size: 1.5rem; color: #000; font-weight: bold; margin-top: 10px; }

        .vs-stamp {
            font-size: 3rem;
            color: var(--gold);
            font-style: italic;
            text-shadow: var(--text-shadow);
        }

        .stats-hud {
            display: flex;
            gap: 50px;
            font-size: 1.3rem;
            color: var(--gold);
            background: rgba(0,0,0,0.5);
            padding: 10px 30px;
            border-radius: 20px;
            border: 1px solid var(--gold);
        }

        .opponent-label { font-size: 1.2rem; color: #aaa; margin-bottom: 10px; }
    </style>
</head>

<body>
    <div class="casino-table">
        <div class="game-layout">
            <div class="stats-hud">
                <div>FITXES: <span id="chips">500</span> 🪙</div>
                <div>GUERRES: <span id="wars">0</span> / 3</div>
            </div>

            <!-- Opponent -->
            <div style="text-align:center;">
                <div class="opponent-label">JOHANN STRAUSS II 🤴</div>
                <div class="card-slot" id="cpu-slot"></div>
            </div>

            <div class="battle-center">
                <div class="vs-stamp">VS</div>
            </div>

            <!-- Player -->
            <div style="text-align:center;">
                <div class="card-slot" id="player-slot"></div>
                <div class="opponent-label" style="margin-top:10px;">TU 🎻</div>
            </div>

            <button class="modal-btn" id="deal-btn" onclick="game.playRound()">REPARTIR BATALLA (50 🪙)</button>
        </div>
    </div>

    <script src="js/casino-common.js"></script>
    <script>
        Casino.Audio.init('music/background_music_batalla.mp3');
        Casino.UI.injectBasicUI('La Batalla de Viena');

        const CARDS = [
            { id: 'rodona', val: 4, img: 'images/rodona.jpg' },
            { id: 'blanca', val: 2, img: 'images/blanca.jpg' },
            { id: 'negra', val: 1, img: 'images/negra.jpg' },
            { id: 'corxera', val: 0.5, img: 'images/corxera.jpg' },
            { id: 'semicorxera', val: 0.25, img: 'images/semicorxera.jpg' }
        ];

        class BatallaGame {
            constructor() {
                this.chips = 500;
                this.warsWon = 0;
                this.isProcessing = false;
                
                setTimeout(() => this.showInstructions(), 500);
            }

            showInstructions() {
                Casino.UI.showModal('batalla-instr', 'EL DUEL DELS VALSOS', 
                    'Comptueix contra Johann Strauss! Guanya qui tregui la figura rítmica de major valor.<br><br>' +
                    'Si hi ha EMPAT, entrareu en "GUERRA" i hauràs de resoldre un enigma musical.<br><br>' +
                    'Guanya 3 guerres o arriba a 2.000 fitxes per la relíquia.', 'ACCEPTAR DUEL');
            }

            playRound() {
                if (this.isProcessing || this.chips < 50) return;
                this.isProcessing = true;
                this.chips -= 50;
                this.updateUI();

                const pCard = CARDS[Math.floor(Math.random() * CARDS.length)];
                const cCard = CARDS[Math.floor(Math.random() * CARDS.length)];

                this.renderCard(pCard, 'player-slot');
                this.renderCard(cCard, 'cpu-slot');
                Casino.Audio.playTone(200, 'triangle', 0.2);

                setTimeout(() => this.resolve(pCard, cCard), 1000);
            }

            renderCard(card, slotId) {
                const slot = document.getElementById(slotId);
                slot.innerHTML = `<div class="card"><img src="${card.img}"><div class="card-val">${card.val}</div></div>`;
            }

            resolve(p, c) {
                if (p.val > c.val) {
                    this.chips += 100;
                    Casino.Audio.playWin();
                    this.status("VICTÒRIA!");
                } else if (p.val < c.val) {
                    Casino.Audio.playLose();
                    this.status("DERROTA...");
                } else {
                    this.startWar();
                }
                this.isProcessing = false;
                this.updateUI();
            }

            startWar() {
                Casino.Audio.playTone(100, 'sawtooth', 0.3);
                const q = Math.random() > 0.5 ? { t: "Què val més?", a: "Blanca + Negra", b: "Rodona", c: true } 
                                           : { t: "Quants temps falten per a la Rodona si tens 2 Negres?", a: "2 Temps", b: "1 Temps", c: true };
                
                Casino.UI.showModal('war-modal', '⚔️ GUERRA! ⚔️', 
                    `${q.t}<br><br><button class="modal-btn" onclick="game.resolveWar(true)">${q.a}</button> <button class="modal-btn" onclick="game.resolveWar(false)">${q.b}</button>`, 
                    'RENDIR-SE');
            }

            resolveWar(correct) {
                if (correct) {
                    this.chips += 200;
                    this.warsWon++;
                    Casino.Audio.playWin();
                    this.status("GUERRA GUANYADA!");
                } else {
                    Casino.Audio.playLose();
                    this.status("GUERRA PERDUDA!");
                }
                this.updateUI();
            }

            status(msg) {
                // Short hover notification or modal
            }

            updateUI() {
                document.getElementById('chips').textContent = this.chips;
                document.getElementById('wars').textContent = this.warsWon;

                if (this.chips >= 2000 || this.warsWon >= 3) {
                    Casino.Rewards.saveProgress('reward_batalla');
                    Casino.UI.showVictory("Ets el Rei del Vals! El violí de Strauss és teu.", () => location.href = 'menu.html');
                } else if (this.chips <= 0) {
                    Casino.UI.showModal('gameover', 'FALLIDA RÍTMICA', 'Strauss t\'ha deixat sense fitxes!', 'REINTENTAR', () => location.reload());
                }
            }
        }

        const game = new BatallaGame();
    </script>
</body>
</html>
