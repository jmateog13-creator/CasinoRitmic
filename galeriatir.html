<!DOCTYPE html>
<html lang="ca">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galeria de Tir Rítmic</title>
    <link rel="stylesheet" href="css/casino-common.css">
    <style>
        .game-layout {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex: 1;
            padding: 20px;
            width: 100%;
            cursor: crosshair;
        }

        #game-canvas {
            background: #1a0505;
            border: 10px solid var(--wood);
            border-radius: 10px;
            box-shadow: 0 0 50px rgba(0,0,0,0.8), inset 0 0 100px rgba(0,0,0,0.5);
            image-rendering: auto;
        }

        .hud-overlay {
            position: absolute;
            top: 100px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 40px;
            pointer-events: none;
        }

        .hud-stat {
            background: rgba(0,0,0,0.8);
            border: 2px solid var(--gold);
            padding: 10px 30px;
            border-radius: 10px;
            text-align: center;
            min-width: 150px;
        }

        .target-hint {
            position: absolute;
            bottom: 40px;
            background: rgba(0,0,0,0.8);
            padding: 20px;
            border: 2px solid var(--gold);
            border-radius: 15px;
            color: var(--gold);
            font-family: 'Playfair Display', serif;
            text-align: center;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.8; transform: scale(1.05); }
        }
    </style>
</head>

<body>
    <div class="casino-table">
        <div class="game-layout">
            <div class="hud-overlay">
                <div class="hud-stat">
                    <div style="font-size:0.8rem; color:#aaa;">PUNTS</div>
                    <div id="score" style="font-size:1.8rem; color:var(--gold); font-weight:bold;">0</div>
                </div>
                <div class="hud-stat">
                    <div style="font-size:0.8rem; color:#aaa;">RONDA</div>
                    <div id="round" style="font-size:1.8rem; color:var(--gold); font-weight:bold;">1/3</div>
                </div>
            </div>

            <canvas id="game-canvas" width="900" height="600"></canvas>
            
            <div class="target-hint" id="hint">DISPARA A LES NEGRES!</div>
        </div>
    </div>

    <script src="js/casino-common.js"></script>
    <script>
        Casino.Audio.init('music/background_music_galeriatir.mp3');
        Casino.UI.injectBasicUI('Galeria de Tir Rítmic');

        const TYPES = {
            'rodona': { img: 'images/rodona.jpg', v: 4, label: 'RODONES' },
            'blanca': { img: 'images/blanca.jpg', v: 2, label: 'BLANQUES' },
            'negra': { img: 'images/negra.jpg', v: 1, label: 'NEGRES' },
            'corxera': { img: 'images/corxera.jpg', v: 0.5, label: 'CORXERES' },
            'semicorxera': { img: 'images/semicorxera.jpg', v: 0.25, label: 'SEMICORXERES' }
        };

        class Target {
            constructor(type, y, speed, dir) {
                this.type = type;
                this.y = y;
                this.speed = speed;
                this.dir = dir;
                this.x = dir === 1 ? -50 : 950;
                this.r = (y > 250 && y < 350) ? 60 : 40;
                this.angle = 0;
                this.active = true;
                this.img = new Image();
                this.img.src = TYPES[type].img;
            }
            update() {
                this.x += this.speed * this.dir;
                this.angle += 0.05;
                if(this.x > 1000 || this.x < -100) this.active = false;
            }
            draw(ctx) {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.angle);
                ctx.beginPath();
                ctx.arc(0, 0, this.r, 0, Math.PI*2);
                ctx.fillStyle = '#fff';
                ctx.fill();
                ctx.strokeStyle = '#999';
                ctx.lineWidth = 3;
                ctx.stroke();
                if(this.img.complete) ctx.drawImage(this.img, -this.r*0.7, -this.r*0.7, this.r*1.4, this.r*1.4);
                ctx.restore();
            }
        }

        class ShootingGame {
            constructor() {
                this.canvas = document.getElementById('game-canvas');
                this.ctx = this.canvas.getContext('2d');
                this.score = 0;
                this.round = 1;
                this.targets = [];
                this.targetKey = 'negra';
                this.running = false;
                this.spawnTimer = 0;
                this.init();
            }

            init() {
                Casino.UI.showModal('tir-instr', 'L\'ARC D\'ARCANGELO CORELLI',
                    'Posa a prova la teva punteria disparant a les figures rítmiques sol·licitades.<br><br>' +
                    '<b>Repte:</b> Aconsegueix 1500 punts per guanyar l\'arc de violí original de Corelli!', 'CARREGAR ARMA',
                    () => this.nextRound()); // No spawns until the modal is closed

                this.canvas.addEventListener('mousedown', (e) => this.shoot(e));
                this.loop();
            }

            nextRound() {
                this.running = false;
                this.targets = [];
                this.spawnTimer = 0;
                const goals = ['negra', 'corxera', 'blanca'];
                this.targetKey = goals[this.round - 1];
                document.getElementById('hint').textContent = `DISPARA A LES ${TYPES[this.targetKey].label}!`;
                document.getElementById('round').textContent = `${this.round}/3`;
                
                setTimeout(() => this.running = true, 1000);
            }

            shoot(e) {
                if(!this.running) return;
                const r = this.canvas.getBoundingClientRect();
                const x = e.clientX - r.left;
                const y = e.clientY - r.top;

                Casino.Audio.playTone(150, 'square', 0.1); // Shot sound
                
                let hit = false;
                for(let i=this.targets.length-1; i>=0; i--) {
                    const t = this.targets[i];
                    const dist = Math.hypot(x - t.x, y - t.y);
                    if(dist < t.r) {
                        if(t.type === this.targetKey) {
                            this.score += 100;
                            Casino.Audio.playTone(800, 'sine', 0.1);
                        } else {
                            this.score = Math.max(0, this.score - 50);
                            Casino.Audio.playTone(100, 'sawtooth', 0.3);
                        }
                        this.targets.splice(i, 1);
                        hit = true;
                        break;
                    }
                }
                document.getElementById('score').textContent = this.score;
                if(!hit) return;
                if(this.score >= 1500) {
                    this.win(); // Completar la ronda 3 (1500) = victòria
                } else if(this.round < 3 && this.score >= this.round * 500) {
                    this.round++; // Nova ronda cada 500 punts nets
                    this.nextRound();
                }
            }

            update() {
                if(!this.running) return;
                this.spawnTimer++;
                if(this.spawnTimer > 40 - (this.round*5)) {
                    const keys = Object.keys(TYPES);
                    const k = Math.random() < 0.4 ? this.targetKey : keys[Math.floor(Math.random()*keys.length)];
                    this.targets.push(new Target(k, 100 + Math.random()*400, 3 + Math.random()*3 + this.round, Math.random() > 0.5 ? 1 : -1));
                    this.spawnTimer = 0;
                }
                this.targets.forEach(t => t.update());
                this.targets = this.targets.filter(t => t.active);
            }

            draw() {
                this.ctx.clearRect(0,0,900,600);
                this.targets.forEach(t => t.draw(this.ctx));
            }

            loop() {
                this.update();
                this.draw();
                if(this.score < 1500) requestAnimationFrame(() => this.loop());
            }

            win() {
                this.running = false;
                Casino.Audio.playWin();
                Casino.Rewards.saveProgress('reward_galeria');
                Casino.UI.showVictory("Punteria absoluta! L'arc de violí de Corelli és teu.", () => location.href = 'menu.html');
            }
        }

        const game = new ShootingGame();
    </script>
</body>
</html>
