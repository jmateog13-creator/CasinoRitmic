<!DOCTYPE html>
<html lang="ca">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desactivació Rítmica</title>
    <link rel="stylesheet" href="css/casino-common.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        .game-layout {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-around;
            flex: 1;
            padding: 20px;
        }

        #bomb-panel {
            width: 80%;
            max-width: 700px;
            background: linear-gradient(135deg, #1a1a1a, #000);
            border: 10px solid var(--gold);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 0 50px rgba(255,0,0,0.3);
            text-align: center;
            position: relative;
        }

        #timer {
            font-size: 5rem;
            color: #ff003c;
            font-weight: bold;
            background: #000;
            padding: 10px 30px;
            border-radius: 10px;
            border: 3px solid #333;
            text-shadow: 0 0 20px #ff0000;
            margin: 20px 0;
            display: inline-block;
        }

        .wires-area {
            display: flex;
            justify-content: center;
            gap: 20px;
            height: 250px;
            margin-top: 30px;
        }

        .wire {
            width: 20px;
            height: 100%;
            background: #ff4444;
            border-radius: 10px;
            cursor: pointer;
            position: relative;
            transition: all 0.2s;
            box-shadow: 5px 0 10px rgba(0,0,0,0.5);
        }

        .wire:hover { filter: brightness(1.2); transform: scaleX(1.1); }
        .wire.cut { height: 30%; opacity: 0.3; cursor: default; }

        .note-tag {
            position: absolute;
            bottom: -50px;
            left: -15px;
            width: 50px;
            height: 50px;
            background: white;
            border-radius: 5px;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 2px solid #333;
        }

        .note-tag img { width: 80%; pointer-events: none; }

        .stats-hud {
            font-size: 1.5rem;
            color: var(--gold);
            margin-bottom: 20px;
        }
    </style>
</head>

<body>
    <div class="casino-table">
        <div class="stats-hud">NIVELL: <span id="level">1</span> / 5</div>

        <div id="bomb-panel">
            <div id="timer">00:30</div>
            <div style="color:#aaa; font-style:italic;">ORDRE: MÉS LLARG A MÉS CURT</div>

            <div class="wires-area" id="wires">
                <!-- Wires injected by JS -->
            </div>
        </div>

        <button class="modal-btn" onclick="location.reload()" style="margin-top:20px; background:#444;">REINICIAR MISSIÓ</button>
    </div>

    <script src="js/casino-common.js"></script>
    <script>
        Casino.Audio.init('music/background_music_bomba.mp3');
        Casino.UI.injectBasicUI('Desactivació Rítmica');

        const NOTES = [
            { id: 'rodona', val: 4, img: 'images/rodona.jpg' },
            { id: 'blanca', val: 2, img: 'images/blanca.jpg' },
            { id: 'negra', val: 1, img: 'images/negra.jpg' },
            { id: 'corxera', val: 0.5, img: 'images/corxera.jpg' },
            { id: 'semicorxera', val: 0.25, img: 'images/semicorxera.jpg' }
        ];

        const COLORS = ['#ff003c', '#39ff14', '#00ffff', '#ffff00', '#ff00ff'];

        class BombaGame {
            constructor() {
                this.level = 1;
                this.timeLeft = 30;
                this.timerInterval = null;
                this.correctOrder = [];
                this.currentStep = 0;
                this.init();
            }

            init() {
                Casino.UI.showModal('bomb-instr', 'EL TEMPORITZADOR DE CAGE',
                    'Has de desactivar la bomba rítmica! Talla els cables (notes) en l\'ordre correcte segons la seva durada.<br><br>' +
                    '<b>ORDRE:</b> De més llarg (Rodona) a més curt (Semicorxera).<br><br>' +
                    'Completa 5 nivells per guanyar.', 'DESACTIVAR ARA',
                    () => this.startLevel());
            }

            startLevel() {
                if (this.level > 5) return this.win();
                
                document.getElementById('level').textContent = this.level;
                this.timeLeft = 35 - (this.level * 5);
                this.currentStep = 0;
                this.renderLevel();
                
                if(this.timerInterval) clearInterval(this.timerInterval);
                this.timerInterval = setInterval(() => this.tick(), 1000);
            }

            renderLevel() {
                const area = document.getElementById('wires');
                area.innerHTML = '';
                
                // Select 3 to 5 random notes
                const count = Math.min(3 + this.level, 5);
                const selected = [];
                for(let i=0; i<count; i++) selected.push(NOTES[Math.floor(Math.random()*NOTES.length)]);
                
                this.correctOrder = [...selected].sort((a,b) => b.val - a.val);
                
                selected.forEach((note, i) => {
                    const wire = document.createElement('div');
                    wire.className = 'wire';
                    wire.style.background = COLORS[i % COLORS.length];
                    wire.innerHTML = `<div class="note-tag"><img src="${note.img}"></div>`;
                    wire.onclick = () => this.cut(wire, note);
                    area.appendChild(wire);
                });
            }

            tick() {
                this.timeLeft--;
                document.getElementById('timer').textContent = `00:${this.timeLeft < 10 ? '0'+this.timeLeft : this.timeLeft}`;
                Casino.Audio.playTone(1000, 'sine', 0.05);
                if (this.timeLeft <= 0) this.fail();
            }

            cut(el, note) {
                if (el.classList.contains('cut')) return;
                
                if (note.val === this.correctOrder[this.currentStep].val) {
                    el.classList.add('cut');
                    Casino.Audio.playTone(200, 'square', 0.1);
                    this.currentStep++;
                    if (this.currentStep === this.correctOrder.length) {
                        clearInterval(this.timerInterval);
                        this.level++;
                        setTimeout(() => this.startLevel(), 1000);
                    }
                } else {
                    this.fail();
                }
            }

            fail() {
                clearInterval(this.timerInterval);
                Casino.Audio.playLose();
                Casino.UI.showModal('boom', 'B O O M !', 'Has tallat el cable incorrecte o se t\'ha acabat el temps.', 'REINTENTAR', () => location.reload());
            }

            win() {
                clearInterval(this.timerInterval);
                Casino.Audio.playWin();
                Casino.Rewards.saveProgress('reward_bomba');
                Casino.UI.showVictory("Missió complerta! Has desactivat el silenci de Cage.", () => location.href = 'menu.html');
            }
        }

        const game = new BombaGame();
    </script>
</body>
</html>
