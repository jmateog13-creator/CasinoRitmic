<!DOCTYPE html>
<html lang="ca">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conecta 4 Rítmic</title>
    <link rel="stylesheet" href="css/casino-common.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        .game-layout {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex: 1;
            padding: 20px;
        }

        .board-container {
            background: var(--wood-border);
            padding: 20px;
            border-radius: 15px;
            border: 8px solid var(--gold);
            box-shadow: 0 0 50px rgba(0,0,0,0.8);
        }

        .board-grid {
            display: grid;
            grid-template-columns: repeat(7, 70px);
            grid-template-rows: repeat(6, 70px);
            gap: 10px;
            background: var(--felt-green);
            padding: 15px;
            border-radius: 10px;
        }

        .slot {
            width: 70px;
            height: 70px;
            background: rgba(0,0,0,0.3);
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
            transition: background 0.2s;
        }

        .slot:hover { background: rgba(255,255,255,0.1); }

        .token {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 2px 4px 8px rgba(0,0,0,0.5);
            animation: dropEffect 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes dropEffect {
            from { transform: translateY(-400px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .token.p1 { background: #222; border: 3px solid #444; } /* Player - Negra */
        .token.p2 { background: #eee; border: 3px solid #ccc; } /* AI - Blanca */
        .token img { width: 70%; pointer-events: none; }

        .turn-indicator {
            font-size: 1.5rem;
            color: var(--gold);
            margin-bottom: 20px;
            text-shadow: 0 0 10px rgba(255,215,0,0.3);
        }
    </style>
</head>

<body>
    <div class="casino-table">
        <div class="game-layout">
            <div class="turn-indicator" id="turn-msg">Torn: JUGADOR (Negres)</div>
            
            <div class="board-container">
                <div class="board-grid" id="board">
                    <!-- Grid generated by JS -->
                </div>
            </div>

            <button class="modal-btn" onclick="location.reload()" style="margin-top:20px; background:#444;">REINICIAR TAULER</button>
        </div>
    </div>

    <script src="js/casino-common.js"></script>
    <script>
        Casino.Audio.init('music/background_music_conecta4.mp3');
        Casino.UI.injectBasicUI('Conecta 4 Rítmic');

        class Conecta4Game {
            constructor() {
                this.rows = 6;
                this.cols = 7;
                this.board = Array(6).fill().map(() => Array(7).fill(0));
                this.turn = 1; // 1=Player, 2=AI
                this.gameOver = false;
                this.init();
            }

            init() {
                Casino.UI.showModal('c4-instr', 'EL CAFÈ DE BACH', 
                    'Fes una línia de 4 fitxes (horitzontal, vertical o diagonal) per guanyar.<br><br>' +
                    '<b>Tu:</b> Fitxes Negres (x1).<br><b>IA:</b> Fitxes Blanques (x2).', 'SIURE AL TAULER');
                this.render();
            }

            render() {
                const grid = document.getElementById('board');
                grid.innerHTML = '';
                for(let r=0; r<this.rows; r++) {
                    for(let c=0; c<this.cols; c++) {
                        const slot = document.createElement('div');
                        slot.className = 'slot';
                        slot.onclick = () => this.playerMove(c);
                        if(this.board[r][c] !== 0) {
                            const token = document.createElement('div');
                            token.className = 'token p' + this.board[r][c];
                            token.innerHTML = `<img src="images/${this.board[r][c] === 1 ? 'negra.jpg' : 'blanca.jpg'}">`;
                            slot.appendChild(token);
                        }
                        grid.appendChild(slot);
                    }
                }
            }

            playerMove(col) {
                if(this.turn !== 1 || this.gameOver) return;
                this.drop(col, 1);
            }

            drop(col, player) {
                for(let r=this.rows-1; r>=0; r--) {
                    if(this.board[r][col] === 0) {
                        this.board[r][col] = player;
                        Casino.Audio.playTone(player === 1 ? 400 : 300, 'sine', 0.1);
                        this.render();
                        if(this.checkWin(player)) return this.end(player);
                        this.turn = (player === 1) ? 2 : 1;
                        document.getElementById('turn-msg').textContent = this.turn === 1 ? "Torn: JUGADOR (Negres)" : "Torn: IA (Blanques)...";
                        if(this.turn === 2) setTimeout(() => this.aiMove(), 1000);
                        return;
                    }
                }
            }

            aiMove() {
                if(this.gameOver) return;
                // Simple AI: first available or win if possible
                let col = Math.floor(Math.random() * this.cols);
                while(this.board[0][col] !== 0) col = Math.floor(Math.random() * this.cols);
                this.drop(col, 2);
            }

            checkWin(p) {
                // Horizontal
                for(let r=0; r<6; r++) for(let c=0; c<4; c++) 
                    if(this.board[r][c]===p && this.board[r][c+1]===p && this.board[r][c+2]===p && this.board[r][c+3]===p) return true;
                // Vertical
                for(let r=0; r<3; r++) for(let c=0; c<7; c++) 
                    if(this.board[r][c]===p && this.board[r+1][c]===p && this.board[r+2][c]===p && this.board[r+3][c]===p) return true;
                // Diagonal /
                for(let r=3; r<6; r++) for(let c=0; c<4; c++) 
                    if(this.board[r][c]===p && this.board[r-1][c+1]===p && this.board[r-2][c+2]===p && this.board[r-3][c+3]===p) return true;
                // Diagonal \
                for(let r=0; r<3; r++) for(let c=0; c<4; c++) 
                    if(this.board[r][c]===p && this.board[r+1][c+1]===p && this.board[r+2][c+2]===p && this.board[r+3][c+3]===p) return true;
                return false;
            }

            end(player) {
                this.gameOver = true;
                if(player === 1) {
                    Casino.Audio.playWin();
                    Casino.Rewards.saveProgress('reward_conecta4');
                    Casino.UI.showVictory("Has superat la IA! La cafetera de Bach és teva.", () => location.href = 'menu.html');
                } else {
                    Casino.Audio.playLose();
                    Casino.UI.showModal('fail', 'HAS PERDUT', 'La IA ha fet línia de 4 abans que tu.', 'REINTENTAR', () => location.reload());
                }
            }
        }

        const game = new Conecta4Game();
    </script>
</body>
</html>
