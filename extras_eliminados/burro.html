<!DOCTYPE html>
<html lang="ca">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El Burro Rítmic</title>
    <link rel="stylesheet" href="css/casino-common.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        .game-layout {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex: 1;
            padding: 20px;
        }

        .casino-circle {
            width: 700px;
            height: 700px;
            background: radial-gradient(circle, var(--felt-green), var(--felt-dark));
            border: 20px solid var(--wood-border);
            border-radius: 50%;
            position: relative;
            box-shadow: 0 0 50px rgba(0,0,0,0.8);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .player-area {
            position: absolute;
            display: flex;
            gap: 10px;
            padding: 10px;
        }

        .p-bottom { bottom: 40px; }
        .p-top { top: 40px; transform: rotate(180deg); }
        .p-left { left: 40px; transform: rotate(90deg); }
        .p-right { right: 40px; transform: rotate(-90deg); }

        .card {
            width: 70px;
            height: 100px;
            background: white;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
            cursor: pointer;
            transition: all 0.2s;
        }

        .card:hover { transform: translateY(-10px); box-shadow: 0 8px 15px rgba(0,0,0,0.5); }
        .card img { width: 80%; pointer-events: none; }
        
        .card-back {
            background: repeating-linear-gradient(45deg, #1a237e, #1a237e 10px, #0d47a1 10px, #0d47a1 20px);
            border: 2px solid white;
        }

        #burro-btn {
            width: 150px;
            height: 150px;
            background: radial-gradient(circle, #ff1744, #b71c1c);
            border: 5px solid var(--gold);
            border-radius: 50%;
            color: white;
            font-size: 2rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 0 30px rgba(255,0,0,0.6);
            display: none;
            z-index: 100;
            transition: transform 0.1s;
        }

        #burro-btn:active { transform: scale(0.9); }

        .streak-counter {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 1.2rem;
            color: var(--gold);
        }
    </style>
</head>

<body>
    <div class="casino-table">
        <div class="streak-counter">VICTÒRIES: <span id="streak">0</span> / 2</div>
        
        <div class="game-layout">
            <div class="casino-circle">
                <div class="player-area p-top" id="hand-top"></div>
                <div class="player-area p-left" id="hand-left"></div>
                <div class="player-area p-right" id="hand-right"></div>
                <div class="player-area p-bottom" id="hand-player"></div>

                <button id="burro-btn" onclick="game.claim()">BURRO!</button>
                <div style="color:rgba(0,0,0,0.2); font-size:3rem; font-weight:bold; pointer-events:none;">CASINO</div>
            </div>
        </div>
    </div>

    <script src="js/casino-common.js"></script>
    <script>
        Casino.Audio.init('music/background_music_main.mp3');
        Casino.UI.injectBasicUI('El Burro Rítmic');

        const NOTES = ['rodona', 'blanca', 'negra', 'corxera'];
        const IMGS = { 'rodona': 'images/rodona.jpg', 'blanca': 'images/blanca.jpg', 'negra': 'images/negra.jpg', 'corxera': 'images/corxera.jpg' };

        class BurroGame {
            constructor() {
                this.streak = 0;
                this.hands = [[], [], [], []]; // 0=Player, 1=Left, 2=Top, 3=Right
                this.isPassing = false;
                this.init();
            }

            init() {
                Casino.UI.showModal('burro-instr', 'EL PÒQUER DE GOULD', 
                    'Aconsegueix 4 figures iguals passant una carta al jugador del costat.<br><br>' +
                    '<b>Instruccions:</b> Fes clic a una de les teves cartes per passar-la. Quan tinguis 4 iguals, prem ràpidament el botó <b>BURRO!</b>', 'ENTENDRE EL JOC');
                this.resetRound();
            }

            resetRound() {
                let deck = [];
                NOTES.forEach(n => { for(let i=0; i<4; i++) deck.push(n); });
                deck.sort(() => Math.random() - 0.5);
                
                this.hands = [deck.splice(0,4), deck.splice(0,4), deck.splice(0,4), deck.splice(0,4)];
                this.isPassing = false;
                document.getElementById('burro-btn').style.display = 'none';
                this.render();
            }

            render() {
                const pHand = document.getElementById('hand-player');
                pHand.innerHTML = '';
                this.hands[0].forEach((n, i) => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.innerHTML = `<img src="${IMGS[n]}">`;
                    card.onclick = () => this.pass(i);
                    pHand.appendChild(card);
                });

                ['left', 'top', 'right'].forEach((id, idx) => {
                    const h = document.getElementById('hand-' + id);
                    h.innerHTML = '';
                    for(let i=0; i<4; i++) {
                        const c = document.createElement('div');
                        c.className = 'card card-back';
                        h.appendChild(c);
                    }
                });

                if (this.checkWin(0)) {
                    document.getElementById('burro-btn').style.display = 'block';
                    Casino.Audio.playTone(800, 'sine', 0.2);
                }
            }

            pass(idx) {
                if (this.isPassing) return;
                this.isPassing = true;

                // Simple AI logic: pass the first card that doesn't match a pair
                const aiPasses = [this.getAIPass(1), this.getAIPass(2), this.getAIPass(3)];
                
                const c0 = this.hands[0].splice(idx, 1)[0];
                const c1 = this.hands[1].splice(aiPasses[0], 1)[0];
                const c2 = this.hands[2].splice(aiPasses[1], 1)[0];
                const c3 = this.hands[3].splice(aiPasses[2], 1)[0];

                this.hands[3].push(c0);
                this.hands[2].push(c3);
                this.hands[1].push(c2);
                this.hands[0].push(c1);

                Casino.Audio.playTone(400, 'triangle', 0.05);
                
                setTimeout(() => {
                    this.isPassing = false;
                    this.render();
                    this.checkAIWins();
                }, 300);
            }

            getAIPass(pIdx) {
                const h = this.hands[pIdx];
                const counts = h.reduce((acc, n) => { acc[n] = (acc[n] || 0) + 1; return acc; }, {});
                for(let i=0; i<h.length; i++) if (counts[h[i]] === 1) return i;
                return 0;
            }

            checkWin(pIdx) {
                const h = this.hands[pIdx];
                return h.every(n => n === h[0]);
            }

            checkAIWins() {
                for(let i=1; i<=3; i++) {
                    if (this.checkWin(i)) {
                        this.isPassing = true;
                        Casino.Audio.playLose();
                        Casino.UI.showModal('lose', 'MÉS RÀPID!', 'Una IA ha cantat BURRO abans que tu!', 'REINTENTAR', () => location.reload());
                        return;
                    }
                }
            }

            claim() {
                this.streak++;
                document.getElementById('streak').textContent = this.streak;
                Casino.Audio.playWin();
                
                if (this.streak >= 2) {
                    Casino.Rewards.saveProgress('reward_burro');
                    Casino.UI.showVictory("Ets el virtuós més ràpid! La cadira de Glenn Gould és teva.", () => location.href = 'menu.html');
                } else {
                    Casino.UI.showModal('win-round', 'VICTÒRIA!', 'Has estat el més ràpid d\'aquesta ronda.', 'SEGÜENT RONDA', () => this.resetRound());
                }
            }
        }

        const game = new BurroGame();
    </script>
</body>
</html>
