<!DOCTYPE html>
<html lang="ca">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Craps Rítmic</title>
    <link rel="stylesheet" href="css/casino-common.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        .game-layout {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-around;
            flex: 1;
            padding: 20px;
        }

        .betting-grid {
            display: grid;
            grid-template-columns: repeat(3, 200px);
            gap: 20px;
            margin-bottom: 40px;
        }

        .bet-zone {
            background: rgba(0,0,0,0.4);
            border: 3px solid var(--glass-border);
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            backdrop-filter: blur(10px);
        }

        .bet-zone:hover { background: rgba(255,255,255,0.05); border-color: var(--gold); }
        .bet-zone.selected { border-color: var(--gold); background: rgba(255,215,0,0.1); box-shadow: 0 0 20px rgba(255,215,0,0.2); }
        .bet-zone h2 { color: var(--gold); margin: 0; font-size: 1.5rem; }
        .bet-zone p { color: #aaa; font-size: 0.9rem; margin: 10px 0; }
        .payout { color: var(--gold); font-weight: bold; }

        .dice-area {
            display: flex;
            gap: 30px;
            margin-bottom: 40px;
        }

        .die {
            width: 100px;
            height: 100px;
            background: #fff;
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
            transition: transform 0.5s;
        }

        .die img { width: 80%; }
        .shaking { animation: shakeEffect 0.1s infinite; }
        @keyframes shakeEffect {
            0% { transform: translate(2px, 2px) rotate(0deg); }
            50% { transform: translate(-2px, -2px) rotate(5deg); }
            100% { transform: translate(2px, 2px) rotate(0deg); }
        }

        .stats-hud {
            display: flex;
            gap: 50px;
            font-size: 1.5rem;
            color: var(--gold);
            margin-bottom: 30px;
        }
    </style>
</head>

<body>
    <div class="casino-table">
        <div class="stats-hud">
            <div>FITXES: <span id="chips">500</span></div>
            <div>OBJECTIU: 2000</div>
        </div>

        <div class="game-layout">
            <div class="betting-grid">
                <div class="bet-zone" id="zone-A" onclick="game.select('A')">
                    <h2>BAIXA</h2>
                    <p>< 1.5 Temps</p>
                    <span class="payout">PAGA x2</span>
                </div>
                <div class="bet-zone" id="zone-B" onclick="game.select('B')">
                    <h2>MITJANA</h2>
                    <p>1.5 - 2.5 Temps</p>
                    <span class="payout">PAGA x3</span>
                </div>
                <div class="bet-zone" id="zone-C" onclick="game.select('C')">
                    <h2>ALTA</h2>
                    <p>> 2.5 Temps</p>
                    <span class="payout">PAGA x4</span>
                </div>
            </div>

            <div class="dice-area">
                <div id="die1" class="die"><img src="images/negra.jpg"></div>
                <div id="die2" class="die"><img src="images/negra.jpg"></div>
            </div>

            <div style="display:flex; gap:20px;">
                <button class="modal-btn" onclick="game.openBonus()" id="bonus-btn" style="background:#800;">BONUS DE SORT 🍀</button>
                <button class="modal-btn" onclick="game.roll()" id="roll-btn" disabled>LLANÇAR DAUS! 🎲</button>
            </div>
        </div>
    </div>

    <script src="js/casino-common.js"></script>
    <script>
        Casino.Audio.init('music/background_music_craps.mp3');
        Casino.UI.injectBasicUI('Craps Rítmic');

        const FACES = [
            { val: 0.25, img: 'images/semicorxera.jpg' },
            { val: 0.5, img: 'images/corxera.jpg' },
            { val: 1, img: 'images/negra.jpg' },
            { val: 2, img: 'images/blanca.jpg' }
        ];

        class CrapsGame {
            constructor() {
                this.chips = 500;
                this.selected = null;
                this.bet = 100;
                this.bonusActive = false;
                this.init();
            }

            init() {
                Casino.UI.showModal('craps-instr', 'EL BARRET DE VERDI', 
                    'Aposta al resultat de la suma de dos daus musicals. Arriba a 2000 fitxes per guanyar.<br><br>' +
                    '<b>Saps Música?</b> Respon la pregunta bonus per carregar els daus al teu favor!', 'PROVAR SORT');
            }

            select(zone) {
                this.selected = zone;
                document.querySelectorAll('.bet-zone').forEach(z => z.classList.remove('selected'));
                document.getElementById('zone-'+zone).classList.add('selected');
                document.getElementById('roll-btn').disabled = false;
                Casino.Audio.playTone(600, 'sine', 0.05);
            }

            openBonus() {
                const q = { q: "Quantes Negres sumen una Rodona?", a: ["2", "3", "4", "8"], c: 2 };
                Casino.UI.showModal('bonus-modal', 'RETE MUSICAL', q.q + '<br><br>' +
                    q.a.map((ans, i) => `<button class="modal-btn" style="margin:5px; font-size:1rem;" onclick="game.checkBonus(${i === q.c})">${ans}</button>`).join(''), '');
            }

            checkBonus(correct) {
                if(correct) {
                    this.bonusActive = true;
                    Casino.UI.showModal('bonus-win', 'CORRECTE!', 'Daus de la sort activats! Major probabilitat de guanyar l\'aposta seleccionada.', 'CONTINUAR');
                    document.getElementById('bonus-btn').disabled = true;
                } else {
                    Casino.UI.showModal('bonus-lose', 'INCORRECTE', 'Daus normals per aquesta tirada.', 'CONTINUAR');
                }
            }

            roll() {
                if(this.chips < this.bet) return;
                this.chips -= this.bet;
                document.getElementById('chips').textContent = this.chips;
                document.getElementById('roll-btn').disabled = true;

                const d1 = document.getElementById('die1');
                const d2 = document.getElementById('die2');
                d1.classList.add('shaking'); d2.classList.add('shaking');
                Casino.Audio.playTone(200, 'square', 0.5);

                setTimeout(() => {
                    d1.classList.remove('shaking'); d2.classList.remove('shaking');
                    let r1, r2, sum;
                    
                    // Rigged logic if bonus active
                    let attempts = 0;
                    do {
                        r1 = FACES[Math.floor(Math.random() * FACES.length)];
                        r2 = FACES[Math.floor(Math.random() * FACES.length)];
                        sum = r1.val + r2.val;
                        attempts++;
                    } while(this.bonusActive && !this.isWinning(sum) && attempts < 5);

                    this.bonusActive = false;
                    document.getElementById('bonus-btn').disabled = false;
                    d1.innerHTML = `<img src="${r1.img}">`;
                    d2.innerHTML = `<img src="${r2.img}">`;

                    this.resolve(sum);
                }, 1000);
            }

            isWinning(sum) {
                if(this.selected === 'A' && sum < 1.5) return true;
                if(this.selected === 'B' && sum >= 1.5 && sum <= 2.5) return true;
                if(this.selected === 'C' && sum > 2.5) return true;
                return false;
            }

            resolve(sum) {
                const win = this.isWinning(sum);
                if(win) {
                    const mult = this.selected === 'A' ? 2 : (this.selected === 'B' ? 3 : 4);
                    this.chips += this.bet * mult;
                    Casino.Audio.playWin();
                    Casino.UI.showModal('res-win', 'VICTÒRIA!', `Suma: ${sum} Temps. Guanyes ${this.bet * mult} fitxes!`, 'CONTINUAR');
                } else {
                    Casino.Audio.playLose();
                    Casino.UI.showModal('res-lose', 'DERROTA', `Suma: ${sum} Temps. Has perdut l'aposta.`, 'CONTINUAR');
                }
                document.getElementById('chips').textContent = this.chips;
                if(this.chips >= 2000) this.winGame();
                if(this.chips <= 0) location.reload();
            }

            winGame() {
                Casino.Audio.playWin();
                Casino.Rewards.saveProgress('reward_craps');
                Casino.UI.showVictory("Ets el rei dels daus! El barret de copa de Verdi és teu.", () => location.href = 'menu.html');
            }
        }

        const game = new CrapsGame();
    </script>
</body>
</html>
