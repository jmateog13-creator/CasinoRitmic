<!DOCTYPE html>
<html lang="ca">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slots Rítmics</title>
    <link rel="stylesheet" href="css/casino-common.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        .game-layout {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-around;
            flex: 1;
        }

        #slot-machine {
            background: rgba(0,0,0,0.5);
            border: 10px solid var(--wood-border);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 0 50px rgba(0,0,0,0.8);
            position: relative;
        }

        .reels-frame {
            display: flex;
            gap: 15px;
            background: #fff;
            padding: 10px;
            border-radius: 10px;
            border: 5px solid #333;
            height: 200px;
            align-items: center;
        }

        .reel {
            width: 120px;
            height: 180px;
            background: #f0f0f0;
            border: 2px solid #ccc;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .symbol img {
            width: 90%;
            height: auto;
            max-height: 100%;
            object-fit: contain;
            transition: transform 0.1s;
        }

        .blur-spin {
            filter: blur(5px);
            animation: spinFast 0.1s infinite linear;
        }

        @keyframes spinFast {
            from { transform: translateY(-5px); }
            to { transform: translateY(5px); }
        }

        .lever-arm {
            position: absolute;
            right: -60px;
            top: 50px;
            width: 20px;
            height: 120px;
            background: silver;
            border-radius: 10px;
            transform-origin: bottom center;
            cursor: pointer;
            transition: transform 0.5s;
        }

        .lever-knob {
            width: 40px;
            height: 40px;
            background: #ff4444;
            border-radius: 50%;
            position: absolute;
            top: -20px;
            left: -10px;
            box-shadow: inset -5px -5px 10px rgba(0,0,0,0.5);
        }

        .pulled { transform: rotateX(60deg) scaleY(0.8); }

        .bet-panel {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        #message-area {
            font-size: 1.5rem;
            color: var(--gold);
            height: 2rem;
            text-align: center;
            font-weight: bold;
            margin-top: 15px;
        }
    </style>
</head>

<body>
    <div class="casino-table">
        <div class="game-layout">
            <div style="display:flex; justify-content:space-around; width:100%; font-size:1.5rem; color:var(--gold);">
                <div>FITXES: <span id="balance">1000</span> 🪙</div>
                <div>APOSTA: <span id="current-bet-display">100</span> 🪙</div>
            </div>

            <div id="slot-machine">
                <div class="reels-frame">
                    <div class="reel" id="reel-1"><div class="symbol"></div></div>
                    <div class="reel" id="reel-2"><div class="symbol"></div></div>
                    <div class="reel" id="reel-3"><div class="symbol"></div></div>
                </div>

                <div class="lever-arm" id="lever" onclick="game.spin()">
                    <div class="lever-knob"></div>
                </div>

                <div id="message-area">Tira de la palanca!</div>
            </div>

            <div class="bet-panel">
                <button class="modal-btn" style="min-width:80px;" onclick="game.setBet(50)">50</button>
                <button class="modal-btn" style="min-width:80px;" onclick="game.setBet(100)">100</button>
                <button class="modal-btn" style="min-width:80px;" onclick="game.setBet(250)">250</button>
                <button class="modal-btn" style="min-width:120px; background:#ff4444; color:white;" onclick="game.setBet(500)">TOT O RES</button>
            </div>
            
            <button class="modal-btn" style="background:var(--felt-dark); color:white;" onclick="game.boost()">✨ BOOST DE SORT</button>
        </div>
    </div>

    <script src="js/casino-common.js"></script>
    <script>
        Casino.Audio.init('music/background_music_tragaperras.mp3');
        Casino.UI.injectBasicUI('Slots Rítmics');

        const SYMBOLS = [
            { id: 'rodona', val: 50, img: 'images/rodona.jpg', name: 'RODONA' },
            { id: 'blanca', val: 20, img: 'images/blanca.jpg', name: 'BLANCA' },
            { id: 'negra', val: 10, img: 'images/negra.jpg', name: 'NEGRA' },
            { id: 'corxera', val: 5, img: 'images/corxera.jpg', name: 'CORXERA' },
            { id: 'semicorxera', val: 2, img: 'images/semicorxera.jpg', name: 'SEMICORXERA' }
        ];

        class SlotsGame {
            constructor() {
                this.balance = 1000;
                this.currentBet = 100;
                this.isSpinning = false;
                this.isBoosted = false;

                // Initial symbols
                [1,2,3].forEach(i => this.setReel(i, SYMBOLS[Math.floor(Math.random()*SYMBOLS.length)]));
                setTimeout(() => this.showInstructions(), 500);
            }

            showInstructions() {
                Casino.UI.showModal('slots-instr', 'LES MÀQUINES DE L\'ATZAR', 
                    'Fes girar els rodets i aconsegueix combinacions de figures musicals!<br><br>' +
                    '<b>3 IGUALS</b>: Premi segons la figura.<br>' +
                    '<b>2 IGUALS</b>: Recuperes l\'aposta.<br><br>' +
                    'Monedes per guanyar: 5.000.', 'PROVAR SORT');
            }

            setBet(val) {
                if (this.isSpinning) return;
                this.currentBet = val;
                document.getElementById('current-bet-display').textContent = this.currentBet;
                Casino.Audio.playClick();
            }

            setReel(id, sym) {
                document.getElementById(`reel-${id}`).querySelector('.symbol').innerHTML = `<img src="${sym.img}">`;
            }

            boost() {
                if (this.isSpinning || this.isBoosted) return;
                Casino.UI.showModal('quiz', 'PREGUNTA RÍTMICA', 
                    'Si encertes la pregunta, la teva propera tirada tindrà una sort espectacular!', 
                    'COMENÇAR RECTO', () => {
                        const q = "Quant sumen Blanca + Negra?";
                        Casino.UI.showModal('quiz-q', 'PREGUNTA', q + '<br><br><button class="modal-btn" onclick="game.resolveQuiz(true)">3 Temps</button> <button class="modal-btn" onclick="game.resolveQuiz(false)">2 Temps</button>', 'CANCELLAR');
                    });
            }

            resolveQuiz(correct) {
                if (correct) {
                    this.isBoosted = true;
                    Casino.Audio.playWin();
                    document.getElementById('message-area').textContent = "✨ SORT AUGMENTADA!";
                    document.getElementById('message-area').style.color = "#00ff00";
                } else {
                    Casino.Audio.playLose();
                    document.getElementById('message-area').textContent = "MALA SORT...";
                }
            }

            async spin() {
                if (this.isSpinning) return;
                if (this.balance < this.currentBet) return alert("No tens prous fitxes!");

                this.isSpinning = true;
                this.balance -= this.currentBet;
                this.updateUI();

                const lever = document.getElementById('lever');
                lever.classList.add('pulled');
                Casino.Audio.playTone(100, 'sawtooth', 0.1);
                setTimeout(() => lever.classList.remove('pulled'), 500);

                let result = [Math.floor(Math.random()*5), Math.floor(Math.random()*5), Math.floor(Math.random()*5)];
                if (this.isBoosted && Math.random() > 0.5) result = [0,0,0]; // Force Rodona Jackpot half time
                this.isBoosted = false;

                const reels = [1,2,3];
                const animations = reels.map((id, i) => {
                    return new Promise(resolve => {
                        const img = document.getElementById(`reel-${id}`).querySelector('img');
                        img.classList.add('blur-spin');
                        
                        setTimeout(() => {
                            img.classList.remove('blur-spin');
                            this.setReel(id, SYMBOLS[result[i]]);
                            Casino.Audio.playTone(200, 'square', 0.1);
                            resolve();
                        }, 2000 + (i * 500));
                    });
                });

                await Promise.all(animations);
                this.checkWin(result);
                this.isSpinning = false;
            }

            checkWin(res) {
                const s1 = SYMBOLS[res[0]], s2 = SYMBOLS[res[1]], s3 = SYMBOLS[res[2]];
                let win = 0, msg = "Res...";

                if (s1.id === s2.id && s2.id === s3.id) {
                    win = this.currentBet * s1.val;
                    msg = `TRIPLE ${s1.name}! +${win} 🪙`;
                    Casino.Audio.playWin();
                } else if (s1.id === s2.id || s2.id === s3.id || s1.id === s3.id) {
                    win = this.currentBet;
                    msg = "PARELLA! Recuperes l'aposta.";
                    Casino.Audio.playTone(440, 'sine', 0.2);
                } else {
                    Casino.Audio.playTone(100, 'square', 0.3);
                }

                this.balance += win;
                document.getElementById('message-area').textContent = msg;
                document.getElementById('message-area').style.color = win > 0 ? "#00ff00" : "#fff";
                this.updateUI();
            }

            updateUI() {
                document.getElementById('balance').textContent = this.balance;
                if (this.balance >= 5000) {
                    Casino.Rewards.saveProgress('reward_slots');
                    Casino.UI.showVictory("Has buidat la banca! El Fonògraf d'Edison és teu.", () => location.href = 'menu.html');
                } else if (this.balance <= 0) {
                    Casino.UI.showModal('gameover', 'SENSE FITXES', 'Torna demà amb més quartos!', 'OK', () => location.reload());
                }
            }
        }

        const game = new SlotsGame();
    </script>
</body>
</html>
