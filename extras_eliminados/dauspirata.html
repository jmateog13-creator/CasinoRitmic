<!DOCTYPE html>
<html lang="ca">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daus Pirata</title>
    <link rel="stylesheet" href="css/casino-common.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        .game-layout {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            flex: 1;
            padding: 20px;
            width: 100%;
        }

        .avatar { font-size: 3rem; margin-bottom: 10px; }
        .dice-row { display: flex; gap: 10px; justify-content: center; min-height: 60px; margin: 10px 0; }
        .die { width: 50px; height: 50px; background: #fff; border-radius: 8px; display: flex; justify-content: center; align-items: center; box-shadow: 2px 4px 8px rgba(0,0,0,0.3); }
        .die img { width: 40px; }
        .die.hidden { background: #333; color: #666; font-size: 1.5rem; font-weight: bold; border: 2px solid #555; }

        .bet-info {
            background: rgba(0,0,0,0.5);
            border: 2px solid var(--gold);
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            min-width: 300px;
            backdrop-filter: blur(10px);
        }

        #current-bet { font-size: 1.5rem; color: var(--gold); font-weight: bold; margin: 10px 0; }

        .controls { display: flex; gap: 20px; margin-top: 20px; }
        
        .bet-selector { display: flex; flex-direction: column; gap: 15px; align-items: center; padding: 20px; }
        .type-selector { display: flex; gap: 10px; }
        .type-btn { width: 60px; height: 60px; border: 2px solid transparent; border-radius: 10px; cursor: pointer; background: white; }
        .type-btn.selected { border-color: var(--gold); box-shadow: 0 0 10px var(--gold); }
        .type-btn img { width: 80%; }
    </style>
</head>

<body>
    <div class="casino-table">
        <div class="game-layout">
            <div id="pirate-area">
                <div class="avatar">🏴‍☠️</div>
                <div style="color:#aaa; text-align:center;">CAPITÀ BARBA-RITME</div>
                <div class="dice-row" id="pirate-dice"></div>
            </div>

            <div class="bet-info">
                <div style="color:#aaa; font-size:0.8rem; text-transform:uppercase;">Aposta a la Taula</div>
                <div id="current-bet">Cap aposta encara</div>
                <div id="msg" style="color:#ddd; font-style:italic; font-size:0.9rem;">El teu torn, camarada!</div>
            </div>

            <div id="player-area">
                <div class="dice-row" id="player-dice"></div>
                <div style="color:var(--gold); text-align:center; font-weight:bold;">ELS TEUS DAUS</div>
                
                <div class="controls">
                    <button class="modal-btn" onclick="game.openBet()">APOSTAR 🎲</button>
                    <button class="modal-btn" onclick="game.liar()" id="liar-btn" style="background:#800;" disabled>MENTIDA! 🤨</button>
                </div>
            </div>
        </div>
    </div>

    <script src="js/casino-common.js"></script>
    <script>
        Casino.Audio.init('music/background_music_dauspirata.mp3');
        Casino.UI.injectBasicUI('Daus Pirata');

        const TYPES = [
            { id: 'negra', img: 'images/negra.jpg', val: 1 },
            { id: 'blanca', img: 'images/blanca.jpg', val: 2 },
            { id: 'rodona', img: 'images/rodona.jpg', val: 4 }
        ];

        class PirateGame {
            constructor() {
                this.pDice = [];
                this.cDice = [];
                this.bet = { qty: 0, typeIdx: -1 };
                this.turn = 'player';
                this.pCount = 3;
                this.cCount = 3;
                this.selectedType = 0;
                this.init();
            }

            init() {
                Casino.UI.showModal('pirate-instr', 'LES CAMPANES DE KÍEV', 
                    'Endevina quants daus d\'un tipus hi ha en total a la taula. Pots pujar l\'aposta o dir que el pirata menteix.<br><br>' +
                    '<b>Objectiu:</b> Fes que el Pirata es quedi sense daus abans que tu!', 'PUJAR A BORD');
                this.startHand();
            }

            startHand() {
                this.pDice = Array.from({length: this.pCount}, () => TYPES[Math.floor(Math.random()*3)]);
                this.cDice = Array.from({length: this.cCount}, () => TYPES[Math.floor(Math.random()*3)]);
                this.bet = { qty: 0, typeIdx: -1 };
                this.turn = 'player';
                this.render();
                Casino.Audio.playTone(300, 'square', 0.5);
            }

            render() {
                const pRow = document.getElementById('player-dice');
                pRow.innerHTML = '';
                this.pDice.forEach(d => pRow.innerHTML += `<div class="die"><img src="${d.img}"></div>`);

                const cRow = document.getElementById('pirate-dice');
                cRow.innerHTML = '';
                this.cDice.forEach(() => cRow.innerHTML += `<div class="die hidden">?</div>`);

                const betDiv = document.getElementById('current-bet');
                if(this.bet.qty === 0) betDiv.textContent = "Cap aposta encara";
                else betDiv.innerHTML = `${this.bet.qty} x <img src="${TYPES[this.bet.typeIdx].img}" style="width:30px; vertical-align:middle;">`;

                document.getElementById('liar-btn').disabled = this.bet.qty === 0;
            }

            openBet() {
                const content = `
                    <div class="bet-selector">
                        <input type="number" id="b-qty" value="${Math.max(1, this.bet.qty)}" min="1" max="6" style="font-size:2rem; width:80px; text-align:center; background:#000; color:#fff; border:2px solid var(--gold);">
                        <div class="type-selector">
                            ${TYPES.map((t, i) => `
                                <button class="type-btn ${this.selectedType === i ? 'selected' : ''}" id="t-btn-${i}" onclick="game.selectT(${i})">
                                    <img src="${t.img}">
                                </button>
                            `).join('')}
                        </div>
                        <button class="modal-btn" onclick="game.submitBet()">CONFIRMAR APOSTA</button>
                    </div>
                `;
                Casino.UI.showModal('bet-modal', 'FES LA TEVA APOSTA', content, '');
            }

            selectT(i) {
                this.selectedType = i;
                document.querySelectorAll('.type-btn').forEach(b => b.classList.remove('selected'));
                document.getElementById('t-btn-'+i).classList.add('selected');
            }

            submitBet() {
                const q = parseInt(document.getElementById('b-qty').value);
                const t = this.selectedType;
                
                if(q > this.bet.qty || (q === this.bet.qty && t > this.bet.typeIdx)) {
                    this.bet = { qty: q, typeIdx: t };
                    Casino.UI.closeModal('bet-modal');
                    this.render();
                    this.turn = 'pirate';
                    document.getElementById('msg').textContent = "El pirata està rumiant...";
                    setTimeout(() => this.aiTurn(), 1500);
                } else {
                    alert("Has de pujar l'aposta!");
                }
            }

            aiTurn() {
                const myMatch = this.cDice.filter(d => d.id === TYPES[this.bet.typeIdx].id).length;
                const totalTarget = this.bet.qty;
                
                if(totalTarget > myMatch + 1.5) {
                    this.liar('pirate');
                } else {
                    let nextQ = this.bet.qty;
                    let nextT = this.bet.typeIdx + 1;
                    if(nextT > 2) { nextT = 0; nextQ++; }
                    this.bet = { qty: nextQ, typeIdx: nextT };
                    this.render();
                    this.turn = 'player';
                    document.getElementById('msg').textContent = "El pirata ha pujat l'aposta!";
                }
            }

            liar(caller = 'player') {
                const t = TYPES[this.bet.typeIdx];
                const realCount = [...this.pDice, ...this.cDice].filter(d => d.id === t.id).length;
                const win = caller === 'player' ? realCount < this.bet.qty : realCount >= this.bet.qty;
                
                const cRow = document.getElementById('pirate-dice');
                cRow.innerHTML = '';
                this.cDice.forEach(d => cRow.innerHTML += `<div class="die"><img src="${d.img}"></div>`);

                const resultText = `Hi havia ${realCount} de ${t.id}. L'aposta era ${this.bet.qty}.`;
                if(win) {
                    Casino.Audio.playWin();
                    if(caller === 'player') this.cCount--; else this.pCount--;
                    Casino.UI.showModal('hand-res', 'GUANYES LA RONDA!', resultText, 'SEGÜENT RONDA', () => this.checkGame());
                } else {
                    Casino.Audio.playLose();
                    if(caller === 'player') this.pCount--; else this.cCount--;
                    Casino.UI.showModal('hand-res', 'PERDS LA RONDA...', resultText, 'SEGÜENT RONDA', () => this.checkGame());
                }
            }

            checkGame() {
                if(this.pCount === 0) location.reload();
                else if(this.cCount === 0) {
                    Casino.Rewards.saveProgress('reward_dauspirata');
                    Casino.UI.showVictory("Has derrotat al Capità Barba-ritme! Les campanes de Kíev són teves.", () => location.href = 'menu.html');
                } else {
                    this.startHand();
                }
            }
        }

        const game = new PirateGame();
    </script>
</body>
</html>
