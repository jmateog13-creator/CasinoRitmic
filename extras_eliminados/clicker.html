<!DOCTYPE html>
<html lang="ca">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El Clicker del Crupier</title>
    <link rel="stylesheet" href="css/casino-common.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        .game-layout {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex: 1;
            padding: 20px;
            gap: 40px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            width: 100%;
            max-width: 600px;
        }

        .stat-panel {
            background: rgba(0,0,0,0.5);
            border: 2px solid var(--glass-border);
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            backdrop-filter: blur(10px);
        }

        .stat-val {
            font-size: 2.5rem;
            color: var(--gold);
            font-weight: bold;
            text-shadow: 0 0 15px rgba(255,215,0,0.3);
        }

        #click-btn {
            width: 250px;
            height: 250px;
            background: radial-gradient(circle, #333, #000);
            border: 8px solid var(--gold);
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 50px rgba(255,215,0,0.4);
            transition: transform 0.1s;
        }

        #click-btn:active { transform: scale(0.95); }
        #click-btn img { width: 60%; pointer-events: none; }

        .upgrades-container {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .upgrade-card {
            width: 160px;
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--glass-border);
            border-radius: 10px;
            padding: 15px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            opacity: 0.6;
        }

        .upgrade-card.affordable { opacity: 1; border-color: var(--gold); background: rgba(255,255,255,0.1); }
        .upgrade-card img { width: 40px; margin-bottom: 10px; }
        .cost-tag { color: var(--gold); font-weight: bold; font-size: 0.9rem; }
    </style>
</head>

<body>
    <div class="casino-table">
        <div class="game-layout">
            <div class="stats-grid">
                <div class="stat-panel">
                    <div style="color:#aaa;">PUNTS ACUMULATS</div>
                    <div class="stat-val" id="score">0</div>
                </div>
                <div class="stat-panel">
                    <div style="color:#aaa;">GENERACIÓ AUTO</div>
                    <div class="stat-val" id="gps">0.0</div>
                </div>
            </div>

            <button id="click-btn" onclick="game.click()">
                <img src="images/semicorxera.jpg">
            </button>

            <div class="upgrades-container" id="upgrades">
                <!-- Upgrades generated by JS -->
            </div>
            
            <div style="color:var(--gold); font-style:italic;">Objectiu: 250 de Generació Auto</div>
        </div>
    </div>

    <script src="js/casino-common.js"></script>
    <script>
        Casino.Audio.init('music/background_music_main.mp3');
        Casino.UI.injectBasicUI('El Clicker del Crupier');

        const UPG_DATA = [
            { id: 'negra', name: 'NEGRA', cost: 10, val: 1.0, img: 'images/negra.jpg' },
            { id: 'blanca', name: 'BLANCA', cost: 50, val: 5.0, img: 'images/blanca.jpg' },
            { id: 'rodona', name: 'RODONA', cost: 200, val: 20.0, img: 'images/rodona.jpg' }
        ];

        class ClickerGame {
            constructor() {
                this.score = 0;
                this.gps = 0;
                this.upgrades = UPG_DATA.map(u => ({...u}));
                this.init();
            }

            init() {
                Casino.UI.showModal('clicker-instr', 'LA REVOLUCIÓ DE CRISTOFORI', 
                    'Genera ritme prement la semicorxera i compra millores per automatitzar la producció.<br><br>' +
                    '<b>Objectiu:</b> Arriba a 250 de generació automàtica per segon.', 'ENTRAR A LA FÀBRICA');
                this.renderUpgrades();
                this.loop();
            }

            renderUpgrades() {
                const container = document.getElementById('upgrades');
                container.innerHTML = '';
                this.upgrades.forEach((u, i) => {
                    const card = document.createElement('div');
                    card.className = 'upgrade-card' + (this.score >= u.cost ? ' affordable' : '');
                    card.innerHTML = `<img src="${u.img}"><div>${u.name}</div><div class="cost-tag">${u.cost} TEMPS</div><div style="font-size:0.7rem; color:#0f0;">+${u.val}/s</div>`;
                    card.onclick = () => this.buy(i);
                    container.appendChild(card);
                });
            }

            click() {
                this.score += 1;
                Casino.Audio.playTone(800, 'sine', 0.05);
                this.updateUI();
            }

            buy(idx) {
                const u = this.upgrades[idx];
                if(this.score >= u.cost) {
                    this.score -= u.cost;
                    this.gps += u.val;
                    u.cost = Math.floor(u.cost * 1.5);
                    Casino.Audio.playTone(1200, 'sine', 0.1);
                    this.updateUI();
                    this.renderUpgrades();
                    if(this.gps >= 250) this.win();
                }
            }

            updateUI() {
                document.getElementById('score').textContent = Math.floor(this.score);
                document.getElementById('gps').textContent = this.gps.toFixed(1);
                // Refresh affordables
                document.querySelectorAll('.upgrade-card').forEach((el, i) => {
                    if(this.score >= this.upgrades[i].cost) el.classList.add('affordable');
                    else el.classList.remove('affordable');
                });
            }

            loop() {
                setInterval(() => {
                    if(this.gps > 0) {
                        this.score += this.gps / 10;
                        this.updateUI();
                    }
                }, 100);
            }

            win() {
                Casino.Audio.playWin();
                Casino.Rewards.saveProgress('reward_clicker');
                Casino.UI.showVictory("Has completat la revolució del teclat! El piano de Cristofori és teu.", () => location.href = 'menu.html');
            }
        }

        const game = new ClickerGame();
    </script>
</body>
</html>
