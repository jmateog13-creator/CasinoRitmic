<!DOCTYPE html>
<html lang="ca">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Cabina de Vent Rítmica</title>
    <link rel="stylesheet" href="css/casino-common.css?v=3">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        .game-layout {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-around;
            flex: 1;
            padding: 20px;
        }

        #cabin {
            width: 600px;
            height: 700px;
            background: rgba(200, 230, 255, 0.1);
            border: 10px solid var(--gold);
            border-radius: 20px;
            box-shadow: 0 0 50px rgba(255, 215, 0, 0.3), inset 0 0 100px rgba(255,255,255,0.1);
            position: relative;
            z-index: 10;
            overflow: hidden;
            cursor: crosshair;
            backdrop-filter: blur(5px);
        }

        #gameCanvas { display: block; background: transparent; }

        .led-panel {
            width: 100%;
            max-width: 600px;
            background: #000;
            border: 2px solid #0f0;
            padding: 5px;
            text-align: center;
            color: #0f0;
            font-family: 'Courier New', monospace;
            font-size: 1.2rem;
            margin-bottom: 10px;
            box-shadow: 0 0 15px rgba(0,255,0,0.5);
        }

        .stats-hud {
            display: flex;
            gap: 50px;
            font-size: 1.5rem;
            color: var(--gold);
            margin-top: 20px;
        }
    </style>
</head>

<body>
    <div class="casino-table">
        <div class="game-layout">
            <div class="led-panel" id="led-msg">ATRAPA LES NOTES RÀPIDES (MENYS D'1 TEMPS)!</div>
            
            <div id="cabin">
                <canvas id="gameCanvas" width="600" height="700"></canvas>
            </div>

            <div class="stats-hud">
                <div>PUNTS: <span id="score">0</span> / 1500</div>
                <div>TEMPS: <span id="time">45</span>s</div>
            </div>
        </div>
    </div>

    <script src="js/casino-common.js?v=3"></script>
    <script>
        Casino.Audio.init('music/background_music_cabinavent.mp3');
        Casino.UI.injectBasicUI('La Cabina de Vent');

        const NOTES = [
            { id: 'rodona', val: 4, img: 'images/rodona.jpg' },
            { id: 'blanca', val: 2, img: 'images/blanca.jpg' },
            { id: 'negra', val: 1, img: 'images/negra.jpg' },
            { id: 'corxera', val: 0.5, img: 'images/corxera.jpg' },
            { id: 'semicorxera', val: 0.25, img: 'images/semicorxera.jpg' }
        ];

        class Particle {
            constructor(level) {
                const note = NOTES[Math.floor(Math.random() * NOTES.length)];
                this.val = note.val;
                this.img = new Image();
                this.img.src = note.img;
                this.x = Math.random() * 500 + 50;
                this.y = 750;
                this.vx = (Math.random() - 0.5) * 6;
                this.vy = -(Math.random() * 8 + 4);
                this.rotation = Math.random() * Math.PI * 2;
                this.rotSpeed = (Math.random() - 0.5) * 0.1;
                this.size = Math.random() < 0.3 ? 80 : 50;
                this.active = true;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.vy += 0.05; // Light gravity
                this.vx += (Math.random() - 0.5) * 0.5; // Wind gust
                this.rotation += this.rotSpeed;
                if (this.x < 0 || this.x > 600) this.vx *= -1;
                if (this.y > 800) this.active = false;
            }

            draw(ctx) {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation);
                ctx.fillStyle = 'white';
                ctx.fillRect(-this.size/2, -this.size/2, this.size, this.size);
                try { ctx.drawImage(this.img, -this.size/2.5, -this.size/2.5, this.size/1.25, this.size/1.25); } catch(e){}
                ctx.restore();
            }

            hit(x, y) {
                return (Math.abs(x - this.x) < this.size/2 && Math.abs(y - this.y) < this.size/2);
            }
        }

        class CabinGame {
            constructor() {
                this.score = 0;
                this.timeLeft = 45;
                this.particles = [];
                this.level = 1;
                this.isRunning = false;
                this.canvas = document.getElementById('gameCanvas');
                this.ctx = this.canvas.getContext('2d');
                
                this.canvas.onclick = (e) => this.click(e);
                this.init();
            }

            init() {
                Casino.UI.showModal('cabin-start', 'LA MISSIÓ DE SCHUBERT',
                    'Atrapa les notes indicades que volen per la cabina!<br><br>' +
                    '<b>Nivell 1:</b> Atrapa Corxeres i Semicorxeres (Notes ràpides).<br>' +
                    '<b>Puntuació:</b> 1.500 punts per guanyar.', 'COMENÇAR VENT',
                    () => {
                        this.isRunning = true;
                        this.loop();
                        this.timer = setInterval(() => {
                            this.timeLeft--;
                            document.getElementById('time').textContent = this.timeLeft;
                            if(this.timeLeft <= 0) this.end(false);
                        }, 1000);
                    });
            }

            click(e) {
                if(!this.isRunning) return;
                const rect = this.canvas.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;

                for(let i=this.particles.length-1; i>=0; i--) {
                    const p = this.particles[i];
                    if(p.hit(x, y)) {
                        const target = p.val < 1; // Level 1 logic
                        if(target) {
                            this.score += 100;
                            Casino.Audio.playTone(1000, 'sine', 0.1);
                        } else {
                            this.score -= 50;
                            Casino.Audio.playLose();
                        }
                        this.particles.splice(i, 1);
                        document.getElementById('score').textContent = this.score;
                        if(this.score >= 1500) this.end(true);
                        break;
                    }
                }
            }

            loop() {
                if(!this.isRunning) return;
                this.ctx.clearRect(0, 0, 600, 700);
                if(Math.random() < 0.1) this.particles.push(new Particle(this.level));
                this.particles.forEach(p => { p.update(); p.draw(this.ctx); });
                this.particles = this.particles.filter(p => p.active);
                requestAnimationFrame(() => this.loop());
            }

            end(win) {
                this.isRunning = false;
                clearInterval(this.timer);
                if(win) {
                    Casino.Audio.playWin();
                    Casino.Rewards.saveProgress('reward_cabinavent');
                    Casino.UI.showVictory("Ets un mestre de l'aire! Les ulleres de Schubert són teves.", () => location.href = 'menu.html');
                } else {
                    Casino.Audio.playLose();
                    Casino.UI.showModal('fail', 'TEMPS ESGOTAT', 'No has atrapat prou notes. El vent ha parat.', 'REINTENTAR', () => location.reload());
                }
            }
        }

        const game = new CabinGame();
    </script>
</body>
</html>
