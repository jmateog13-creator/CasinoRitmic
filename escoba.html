<!DOCTYPE html>
<html lang="ca">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Escoba Rítmica</title>
    <link rel="stylesheet" href="css/casino-common.css?v=2">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&display=swap" rel="stylesheet">
    <style>
        .game-layout {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            flex: 1;
            padding: 20px;
            width: 100%;
        }

        .cpu-area { height: 120px; display: flex; gap: 10px; margin-bottom: 20px; }
        .table-area { flex: 1; display: flex; justify-content: center; align-items: center; gap: 15px; flex-wrap: wrap; background: rgba(0,0,0,0.1); border-radius: 20px; width: 90%; padding: 20px; }
        .player-area { height: 180px; display: flex; flex-direction: column; align-items: center; gap: 15px; margin-top: 20px; }
        .hand { display: flex; gap: 10px; }

        .card {
            width: 80px;
            height: 120px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.2s;
            border: 3px solid transparent;
        }
        .card img { width: 70%; pointer-events: none; }
        .card .val { color: #333; font-weight: bold; font-family: 'Cinzel', serif; margin-top: 5px; }
        .card.selected { border-color: var(--gold); transform: translateY(-10px); box-shadow: 0 0 20px var(--gold); }
        .card.back { background: linear-gradient(45deg, #1a0505, #3e2723); border: 2px solid white; cursor: default; }

        .escoba-msg {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 5rem;
            color: var(--gold);
            text-shadow: 0 0 30px #000;
            z-index: 100;
            display: none;
            font-family: 'Cinzel', serif;
        }
    </style>
</head>

<body>
    <div class="casino-table">
        <div class="game-layout">
            <div class="escoba-msg" id="escoba-msg">ESCOMBRA!</div>

            <div class="cpu-area" id="cpu-hand"></div>

            <div class="table-area" id="table-cards"></div>

            <div class="player-area">
                <div class="hand" id="player-hand"></div>
                <div style="display:flex; gap:15px;">
                    <button class="modal-btn" onclick="game.play()">CAPTURAR 🧹</button>
                    <button class="modal-btn" onclick="game.discard()" style="background:#800;">DESCARTAR 🃏</button>
                </div>
            </div>
            
            <div style="color:var(--gold); margin-top:10px;">OBJECTIU SUMA: 2 | ESCOMBRES: <span id="esc-count">0</span>/2</div>
        </div>
    </div>

    <script src="js/casino-common.js?v=2"></script>
    <script>
        Casino.Audio.init('music/background_music_escoba.mp3');
        Casino.UI.injectBasicUI('La Escoba Rítmica');

        const TYPES = [
            { id: 'blanca', v: 2, img: 'images/blanca.jpg' },
            { id: 'negra', v: 1, img: 'images/negra.jpg' },
            { id: 'corxera', v: 0.5, img: 'images/corxera.jpg' },
            { id: 'semicorxera', v: 0.25, img: 'images/semicorxera.jpg' }
        ];

        class EscobaGame {
            constructor() {
                this.deck = [];
                this.pHand = [];
                this.cHand = [];
                this.table = [];
                this.escobas = 0;
                this.pCaptures = 0;
                this.cCaptures = 0;
                this.gameOver = false;
                this.selP = null;
                this.selT = [];
                this.turn = 'player';
                this.init();
            }

            init() {
                Casino.UI.showModal('escoba-instr', 'LES CASTANYOLES DE FALLA', 
                    'Captura cartes de la taula que sumin exactament 2 temps amb una de les teves cartes.<br><br>' +
                    '<b>Escoba:</b> Si neteges tota la taula d\'una vegada, fas una escombra. En necessites 2 per guanyar!', 'COMENÇAR PARTIDA');
                
                for(let i=0; i<10; i++) TYPES.forEach(t => this.deck.push({...t, uid: Math.random()}));
                this.deck.sort(() => Math.random()-0.5);
                
                this.table = this.deck.splice(0, 4);
                this.deal();
            }

            deal() {
                if(this.deck.length === 0) { this.endGame(); return; }
                this.pHand = this.deck.splice(0, 3);
                this.cHand = this.deck.splice(0, 3);
                this.render();
            }

            render() {
                const pH = document.getElementById('player-hand');
                pH.innerHTML = '';
                this.pHand.forEach(c => {
                    const el = this.createC(c);
                    if(this.selP === c.uid) el.classList.add('selected');
                    el.onclick = () => { this.selP = c.uid; this.render(); };
                    pH.appendChild(el);
                });

                const cH = document.getElementById('cpu-hand');
                cH.innerHTML = '';
                this.cHand.forEach(() => {
                    const el = document.createElement('div');
                    el.className = 'card back';
                    cH.appendChild(el);
                });

                const tH = document.getElementById('table-cards');
                tH.innerHTML = '';
                this.table.forEach(c => {
                    const el = this.createC(c);
                    if(this.selT.includes(c.uid)) el.classList.add('selected');
                    el.onclick = () => {
                        if(this.selT.includes(c.uid)) this.selT = this.selT.filter(u => u !== c.uid);
                        else this.selT.push(c.uid);
                        this.render();
                    };
                    tH.appendChild(el);
                });

                document.getElementById('esc-count').textContent = this.escobas;
            }

            createC(c) {
                const el = document.createElement('div');
                el.className = 'card';
                el.innerHTML = `<img src="${c.img}"><div class="val">${c.v}</div>`;
                return el;
            }

            play() {
                if(this.turn !== 'player' || !this.selP || this.selT.length === 0) return;
                const pCard = this.pHand.find(c => c.uid === this.selP);
                const tCards = this.table.filter(c => this.selT.includes(c.uid));
                const sum = pCard.v + tCards.reduce((a, b) => a + b.v, 0);

                if(Math.abs(sum - 2) < 0.01) {
                    this.capture(pCard, tCards, 'player');
                } else {
                    Casino.Audio.playTone(200, 'sawtooth', 0.5);
                    alert("Suma incorrecta! Ha de ser 2.");
                }
            }

            discard() {
                if(this.turn !== 'player' || !this.selP) return;
                const c = this.pHand.find(x => x.uid === this.selP);
                this.pHand = this.pHand.filter(x => x.uid !== this.selP);
                this.table.push(c);
                this.next();
            }

            capture(pCard, tCards, who) {
                if(who === 'player') this.pHand = this.pHand.filter(c => c.uid !== pCard.uid);
                else this.cHand = this.cHand.filter(c => c.uid !== pCard.uid);

                const ids = tCards.map(c => c.uid);
                this.table = this.table.filter(c => !ids.includes(c.uid));

                if(who === 'player') this.pCaptures += tCards.length + 1;
                else this.cCaptures += tCards.length + 1;

                Casino.Audio.playTone(800, 'sine', 0.2);
                if(this.table.length === 0) {
                    this.showMsg();
                    if(who === 'player') {
                        this.escobas++;
                        if(this.escobas >= 2) this.win();
                    }
                }
                this.next();
            }

            showMsg() {
                const el = document.getElementById('escoba-msg');
                el.style.display = 'block';
                Casino.Audio.playTone(1000, 'sine', 1);
                setTimeout(() => el.style.display = 'none', 1500);
            }

            next() {
                this.selP = null; this.selT = [];
                this.render();
                if(this.pHand.length === 0 && this.cHand.length === 0) this.deal();
                if(this.gameOver) return;

                if(this.turn === 'player') {
                    this.turn = 'cpu';
                    setTimeout(() => this.ai(), 1500);
                } else {
                    this.turn = 'player';
                }
            }

            ai() {
                if(this.gameOver) return;
                if(this.cHand.length === 0) { this.next(); return; }
                let move = null;
                for(let c of this.cHand) {
                    const subset = this.find(this.table, 2 - c.v);
                    if(subset && subset.length > 0) { move = {c, t: subset}; break; }
                }
                if(move) { this.capture(move.c, move.t, 'cpu'); }
                else { this.table.push(this.cHand.pop()); this.next(); }
            }

            find(arr, target) {
                if(target < 0) return null;
                if(Math.abs(target) < 0.01) return [];
                for(let i=0; i<arr.length; i++) {
                    const res = this.find(arr.slice(i+1), target - arr[i].v);
                    if(res) return [arr[i], ...res];
                }
                return null;
            }

            endGame() {
                this.gameOver = true;
                if(this.pCaptures > this.cCaptures) { this.win(); return; }
                Casino.Audio.playLose();
                const msg = this.pCaptures === this.cCaptures ?
                    `S'han acabat les cartes! Empat a ${this.pCaptures} cartes capturades.` :
                    `S'han acabat les cartes! La IA n'ha capturat ${this.cCaptures} i tu ${this.pCaptures}.`;
                Casino.UI.showModal('escoba-end', 'FI DE LA PARTIDA', msg, 'REINTENTAR', () => location.reload());
            }

            win() {
                this.gameOver = true;
                Casino.Audio.playWin();
                Casino.Rewards.saveProgress('reward_escoba');
                Casino.UI.showVictory("Ets un mestre del ritme flamenc! Les castanyoles d'en Falla són teves.", () => location.href = 'menu.html');
            }
        }

        const game = new EscobaGame();
    </script>
</body>
</html>
