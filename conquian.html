<!DOCTYPE html>
<html lang="ca">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conquián Rítmic</title>
    <link rel="stylesheet" href="css/casino-common.css?v=2">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        .game-layout {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            flex: 1;
            padding: 20px;
            width: 100%;
        }

        .hand-area {
            width: 90%;
            height: 140px;
            background: rgba(0,0,0,0.3);
            border: 2px solid var(--glass-border);
            border-radius: 15px;
            display: flex;
            align-items: center;
            padding: 10px;
            gap: 10px;
            overflow-x: auto;
            backdrop-filter: blur(10px);
        }

        .table-center {
            display: flex;
            gap: 50px;
            align-items: center;
        }

        .pile {
            width: 80px;
            height: 120px;
            border: 2px dashed var(--gold);
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: rgba(0,0,0,0.2);
            cursor: pointer;
            position: relative;
        }

        .pile img { width: 80%; pointer-events: none; }
        .card { width: 80px; height: 120px; background: white; border-radius: 8px; box-shadow: 2px 4px 8px rgba(0,0,0,0.5); cursor: pointer; transition: transform 0.2s; position: relative; flex-shrink: 0; }
        .card.selected { transform: translateY(-20px); border: 3px solid var(--gold); }
        .card img { width: 100%; border-radius: 8px; }

        .melds-container {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            min-height: 100px;
        }

        .action-bar { display: flex; gap: 20px; }
    </style>
</head>

<body>
    <div class="casino-table">
        <div class="game-layout">
            <div id="cpu-status" style="color:var(--gold)">IA: 9 Cartes</div>
            
            <div class="melds-container" id="melds">
                <!-- Melds here -->
            </div>

            <div class="table-center">
                <div class="pile" id="stock" onclick="game.draw('stock')">
                    <div style="position:absolute; top:-25px; color:#aaa; font-size:0.8rem;">MAÇ</div>
                    <div class="card" style="background:#800; border:2px solid gold;"></div>
                </div>
                <div class="pile" id="discard" onclick="game.draw('discard')">
                    <div style="position:absolute; top:-25px; color:#aaa; font-size:0.8rem;">DESCART</div>
                    <!-- Top card here -->
                </div>
            </div>

            <div class="action-bar">
                <button class="modal-btn" id="meld-btn" onclick="game.meld()">MUNTAR COMPÀS</button>
                <button class="modal-btn" id="disc-btn" onclick="game.discard()" style="background:#444;">DESCARTAR</button>
            </div>

            <div class="hand-area" id="player-hand">
                <!-- Player cards here -->
            </div>
        </div>
    </div>

    <script src="js/casino-common.js?v=2"></script>
    <script>
        Casino.Audio.init('music/background_music_main.mp3');
        Casino.UI.injectBasicUI('Conquián Rítmic');

        const CARDS = [
            { val: 4, img: 'images/rodona.jpg' }, { val: 2, img: 'images/blanca.jpg' },
            { val: 1, img: 'images/negra.jpg' }, { val: 0.5, img: 'images/corxera.jpg' }
        ];

        class ConquianGame {
            constructor() {
                this.deck = [];
                this.pHand = [];
                this.cHand = [];
                this.discardPile = [];
                this.selected = new Set();
                this.phase = 'draw'; // draw, play
                this.init();
            }

            init() {
                Casino.UI.showModal('conq-instr', 'LA FLAUTA DEL REI FREDERIC', 
                    'Forma grups de cartes que sumin 2, 3 o 4 temps. Roba del maç o del descart.<br><br>' +
                    '<b>Objectiu:</b> Queda\'t sense cartes a la mà.', 'ENTRAR AL SALÓ');
                this.setupDeck();
                this.deal();
                this.render();
            }

            setupDeck() {
                this.deck = [];
                CARDS.forEach(c => { for(let i=0; i<8; i++) this.deck.push({...c, id: Math.random()}); });
                this.deck.sort(() => Math.random() - 0.5);
            }

            deal() {
                for(let i=0; i<9; i++) { this.pHand.push(this.deck.pop()); this.cHand.push(this.deck.pop()); }
                this.discardPile.push(this.deck.pop());
            }

            refillStock() {
                if(this.deck.length > 0) return true;
                if(this.discardPile.length > 1) {
                    const top = this.discardPile.pop();
                    this.deck = this.discardPile.sort(() => Math.random() - 0.5);
                    this.discardPile = [top];
                    return true;
                }
                return false;
            }

            endTie() {
                Casino.Audio.playLose();
                Casino.UI.showModal('conq-end', 'PARTIDA EN TAULES',
                    'El maç s\'ha esgotat i no queden cartes per barallar. Ningú guanya la flauta... aquesta vegada.',
                    'REINTENTAR', () => location.reload());
            }

            draw(type) {
                if(this.phase !== 'draw') return;
                if(type === 'stock' && !this.refillStock()) { this.endTie(); return; }
                if(type === 'discard' && this.discardPile.length === 0) return;
                const card = type === 'stock' ? this.deck.pop() : this.discardPile.pop();
                this.pHand.push(card);
                this.phase = 'play';
                Casino.Audio.playTone(600, 'sine', 0.1);
                this.render();
            }

            toggle(idx) {
                if(this.selected.has(idx)) this.selected.delete(idx);
                else this.selected.add(idx);
                this.render();
            }

            meld() {
                if(this.phase !== 'play') return;
                const selCards = Array.from(this.selected).map(i => this.pHand[i]);
                const sum = selCards.reduce((a, b) => a + b.val, 0);
                if([2, 3, 4].includes(sum)) {
                    this.pHand = this.pHand.filter((_, i) => !this.selected.has(i));
                    const meldDiv = document.createElement('div');
                    meldDiv.style.display = 'flex';
                    selCards.forEach(c => {
                        const img = document.createElement('img');
                        img.src = c.img; img.style.width='40px'; img.style.height='60px'; img.style.margin='2px';
                        meldDiv.appendChild(img);
                    });
                    document.getElementById('melds').appendChild(meldDiv);
                    this.selected.clear();
                    Casino.Audio.playWin();
                    this.checkWin();
                } else {
                    Casino.Audio.playLose();
                }
                this.render();
            }

            discard() {
                if(this.phase !== 'play' || this.selected.size !== 1) return;
                const idx = Array.from(this.selected)[0];
                this.discardPile.push(this.pHand[idx]);
                this.pHand.splice(idx, 1);
                this.selected.clear();
                this.phase = 'draw';
                Casino.Audio.playTone(400, 'sine', 0.1);
                this.render();
                setTimeout(() => this.aiTurn(), 1000);
            }

            aiTurn() {
                if(!this.refillStock()) { this.endTie(); return; }
                const c = this.deck.pop();
                this.cHand.push(c);
                if(Math.random() < 0.3 && this.cHand.length > 1) this.cHand.pop(); // Simulate meld
                this.discardPile.push(this.cHand.pop());
                this.checkWin();
                this.render();
            }

            checkWin() {
                if(this.pHand.length === 0) {
                    Casino.Audio.playWin();
                    Casino.Rewards.saveProgress('reward_conquian');
                    Casino.UI.showVictory("Has dominat l'estructura formal! La flauta del Rei Frederic és teva.", () => location.href = 'menu.html');
                }
            }

            render() {
                const container = document.getElementById('player-hand');
                container.innerHTML = '';
                this.pHand.forEach((c, i) => {
                    const div = document.createElement('div');
                    div.className = 'card' + (this.selected.has(i) ? ' selected' : '');
                    div.innerHTML = `<img src="${c.img}">`;
                    div.onclick = () => this.toggle(i);
                    container.appendChild(div);
                });

                const disc = document.getElementById('discard');
                if(this.discardPile.length > 0) {
                    const top = this.discardPile[this.discardPile.length - 1];
                    disc.innerHTML = `<div style="position:absolute; top:-25px; color:#aaa; font-size:0.8rem;">DESCART</div><img src="${top.img}">`;
                }

                document.getElementById('cpu-status').textContent = `IA: ${this.cHand.length} Cartes`;
                document.getElementById('meld-btn').disabled = this.phase !== 'play';
                document.getElementById('disc-btn').disabled = this.phase !== 'play' || this.selected.size !== 1;
            }
        }

        const game = new ConquianGame();
    </script>
</body>
</html>
