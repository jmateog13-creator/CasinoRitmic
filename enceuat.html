<!DOCTYPE html>
<html lang="ca">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Encreuat Rítmic</title>
    <link rel="stylesheet" href="css/casino-common.css?v=3">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        .game-layout {
            display: flex;
            flex-direction: row;
            align-items: flex-start;
            justify-content: center;
            flex: 1;
            padding: 40px;
            gap: 40px;
            width: 100%;
        }

        #grid-container {
            background: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            display: grid;
            grid-template-columns: repeat(10, 40px);
            grid-template-rows: repeat(10, 40px);
            gap: 2px;
            border: 5px solid var(--gold);
        }

        .cell {
            width: 40px;
            height: 40px;
            background: #eee;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 4px;
        }

        .cell.active { background: white; border: 1px solid #ccc; }
        .cell.black { background: #222; }

        .cell input {
            width: 100%;
            height: 100%;
            border: none;
            background: transparent;
            text-align: center;
            font-size: 1.2rem;
            text-transform: uppercase;
            font-weight: bold;
            color: #333;
            outline: none;
        }

        .cell-num {
            position: absolute;
            top: 2px;
            left: 2px;
            font-size: 0.6rem;
            color: #777;
            pointer-events: none;
        }

        .clues-panel {
            width: 350px;
            background: rgba(0,0,0,0.5);
            border: 2px solid var(--glass-border);
            border-radius: 15px;
            padding: 20px;
            backdrop-filter: blur(10px);
            max-height: 80vh;
            overflow-y: auto;
        }

        .clue-group h3 { color: var(--gold); border-bottom: 1px solid var(--gold); padding-bottom: 5px; margin-bottom: 10px; font-size: 1.1rem; }
        .clue-item { margin-bottom: 10px; font-size: 0.9rem; line-height: 1.4; color: #ccc; cursor: pointer; }
        .clue-item:hover { color: var(--gold); }
        .clue-item b { color: var(--gold); margin-right: 5px; }

        .check-container { position: absolute; bottom: 40px; right: 40px; }
    </style>
</head>

<body>
    <div class="casino-table">
        <div class="game-layout">
            <div id="grid-container">
                <!-- Grid injected here -->
            </div>

            <div class="clues-panel">
                <div class="clue-group">
                    <h3>HORITZONTAL</h3>
                    <div id="hor-clues"></div>
                </div>
                <div class="clue-group" style="margin-top:20px;">
                    <h3>VERTICAL</h3>
                    <div id="ver-clues"></div>
                </div>
            </div>
        </div>

        <div class="check-container">
            <button class="modal-btn" onclick="game.check()">COMPROVAR PUZLE ✅</button>
        </div>
    </div>

    <script src="js/casino-common.js?v=3"></script>
    <script>
        Casino.Audio.init('music/High Stakes Love-2.mp3');
        Casino.UI.injectBasicUI('Encreuat Rítmic');

        const WORDS = [
            { id: 1, w: 'BLANCA', r: 2, c: 1, d: 'H', q: 'Figura que equival a dos temps.' },
            { id: 2, w: 'SILENCI', r: 0, c: 2, d: 'V', q: 'Nom genèric de la pausa.' },
            { id: 3, w: 'NEGRA', r: 2, c: 4, d: 'V', q: 'La figura que dura un temps.' },
            { id: 4, w: 'RODONA', r: 5, c: 4, d: 'H', q: 'La figura que dura quatre temps.' },
            { id: 5, w: 'POLS', r: 4, c: 7, d: 'V', q: 'La unitat bàsica de mesura.' }
        ];

        class CrosswordGame {
            constructor() {
                this.grid = Array(10).fill().map(() => Array(10).fill(null));
                this.solutions = {};
                this.init();
            }

            init() {
                Casino.UI.showModal('cross-instr', 'LES PLOMES D\'OR', 
                    'Resol les definicions musicals i completa la graella per trobar el tresor d\'en Händel.<br><br>' +
                    '<b>Consell:</b> Fixa\'t bé en les lletres compartides entre paraules!', 'ESCRIURE EL DESTÍ');
                
                this.build();
                this.render();
            }

            build() {
                WORDS.forEach(w => {
                    for(let i=0; i<w.w.length; i++) {
                        let r = w.r + (w.d === 'V' ? i : 0);
                        let c = w.c + (w.d === 'H' ? i : 0);
                        this.grid[r][c] = { char: w.w[i], num: (i === 0 ? w.id : null) };
                        this.solutions[`${r}-${c}`] = w.w[i];
                    }
                    const list = document.getElementById(w.d === 'H' ? 'hor-clues' : 'ver-clues');
                    list.innerHTML += `<div class="clue-item"><b>${w.id}.</b> ${w.q}</div>`;
                });
            }

            render() {
                const container = document.getElementById('grid-container');
                container.innerHTML = '';
                for(let r=0; r<10; r++) {
                    for(let c=0; c<10; c++) {
                        const cell = document.createElement('div');
                        const data = this.grid[r][c];
                        if(data) {
                            cell.className = 'cell active';
                            if(data.num) cell.innerHTML = `<span class="cell-num">${data.num}</span>`;
                            const input = document.createElement('input');
                            input.maxLength = 1;
                            input.id = `c-${r}-${c}`;
                            cell.appendChild(input);
                        } else {
                            cell.className = 'cell black';
                        }
                        container.appendChild(cell);
                    }
                }
            }

            check() {
                let allCorrect = true;
                for(let key in this.solutions) {
                    const input = document.getElementById(`c-${key}`);
                    if(input.value.toUpperCase() !== this.solutions[key]) {
                        allCorrect = false;
                        input.style.color = '#ff4444';
                    } else {
                        input.style.color = '#2ecc71';
                    }
                }

                if(allCorrect) {
                    Casino.Audio.playWin();
                    Casino.Rewards.saveProgress('reward_enceuat');
                    Casino.UI.showVictory("Has completat l'encreuat mestre! La ploma de Händel és teva.", () => location.href = 'menu.html');
                } else {
                    Casino.Audio.playTone(200, 'sawtooth', 0.5);
                    alert("Encara hi ha lletres que no quadren!");
                }
            }
        }

        const game = new CrosswordGame();
    </script>
</body>
</html>
