<!DOCTYPE html>
<html lang="ca">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bolera Rítmica</title>
    <link rel="stylesheet" href="css/casino-common.css?v=3">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        .game-layout {
            display: flex;
            width: 100%;
            height: 100%;
            gap: 20px;
            padding: 20px;
        }

        .deck-panel {
            width: 250px;
            background: rgba(0, 0, 0, 0.4);
            border: 2px solid var(--glass-border);
            border-radius: 15px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            backdrop-filter: blur(10px);
        }

        .card {
            width: 100%;
            aspect-ratio: 3/4;
            background: white;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: grab;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            transition: transform 0.2s;
        }

        .card:hover { transform: scale(1.05); }
        .card img { width: 60%; pointer-events: none; }
        .card-val { color: #000; font-weight: bold; margin-top: 5px; font-size: 1.2rem; }

        .lane-panel {
            flex: 1;
            background: rgba(0,0,0,0.2);
            border: 5px solid var(--wood-border);
            border-radius: 10px;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .pins-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            padding: 40px;
        }

        .pin-slot {
            width: 80px;
            height: 120px;
            border: 2px dashed var(--gold);
            border-radius: 50% 50% 10px 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(255,215,0,0.05);
            transition: all 0.3s;
        }

        .pin-slot.has-card { background: white; border: none; }
        .pin-slot img { width: 60%; }

        #ball {
            position: absolute;
            bottom: -100px;
            width: 100px;
            height: 100px;
            background: radial-gradient(circle at 30% 30%, #444, #000);
            border-radius: 50%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            transition: bottom 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .stats-hud {
            font-size: 1.5rem;
            color: var(--gold);
            text-align: center;
            margin-bottom: 20px;
            display: flex;
            justify-content: center;
            gap: 50px;
        }
    </style>
</head>

<body>
    <div class="casino-table">
        <div class="stats-hud">
            <div>OBJECTIU: <span id="target">0</span></div>
            <div>SUMA: <span id="current">0</span></div>
        </div>

        <div class="game-layout">
            <div class="deck-panel" id="deck">
                <!-- Cards here -->
            </div>

            <div class="lane-panel">
                <div class="pins-grid" id="pins">
                    <!-- Pin slots here -->
                </div>
                <div id="ball"></div>
            </div>
        </div>

        <button class="modal-btn" onclick="game.shoot()" style="margin-top:20px;">LLANÇAR BOLA 🎳</button>
    </div>

    <script src="js/casino-common.js?v=3"></script>
    <script>
        Casino.Audio.init('music/background_music_main.mp3');
        Casino.UI.injectBasicUI('Bolera Rítmica');

        const NOTES = [
            { id: 'rodona', val: 4, img: 'images/rodona.jpg' },
            { id: 'blanca', val: 2, img: 'images/blanca.jpg' },
            { id: 'negra', val: 1, img: 'images/negra.jpg' },
            { id: 'corxera', val: 0.5, img: 'images/corxera.jpg' }
        ];

        class BoleraGame {
            constructor() {
                this.target = Math.floor(Math.random() * 15) + 5;
                if (Math.random() > 0.5) this.target += 0.5;
                this.current = 0;
                this.pinValues = Array(8).fill(0);
                this.isRolling = false;

                this.init();
            }

            init() {
                document.getElementById('target').textContent = this.target;
                this.renderDeck();
                this.renderPins();
                
                setTimeout(() => {
                    Casino.UI.showModal('bolera-instr', 'EL PLENO DE BEETHOVEN', 
                        'Arrossega les notes als bolos per donar-los valor. L\'objectiu és aconseguir la suma exacta rítmica.<br><br>' +
                        '<b>Objectiu</b>: ' + this.target + ' temps.', 'COMENÇAR');
                }, 500);
            }

            renderDeck() {
                const deck = document.getElementById('deck');
                NOTES.forEach(note => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.draggable = true;
                    card.innerHTML = `<img src="${note.img}"><div class="card-val">${note.val}</div>`;
                    card.ondragstart = (e) => e.dataTransfer.setData('text', JSON.stringify(note));
                    deck.appendChild(card);
                });
            }

            renderPins() {
                const pins = document.getElementById('pins');
                for (let i = 0; i < 8; i++) {
                    const slot = document.createElement('div');
                    slot.className = 'pin-slot';
                    slot.ondragover = (e) => e.preventDefault();
                    slot.ondrop = (e) => {
                        const note = JSON.parse(e.dataTransfer.getData('text'));
                        this.updatePin(i, note, slot);
                    };
                    slot.onclick = () => this.updatePin(i, { val: 0, img: '' }, slot);
                    pins.appendChild(slot);
                }
            }

            updatePin(idx, note, slot) {
                if (this.isRolling) return;
                this.pinValues[idx] = note.val;
                slot.innerHTML = note.img ? `<img src="${note.img}">` : '';
                slot.className = note.img ? 'pin-slot has-card' : 'pin-slot';
                Casino.Audio.playTone(400 + (note.val * 100), 'sine', 0.1);
                this.updateScore();
            }

            updateScore() {
                this.current = this.pinValues.reduce((a, b) => a + b, 0);
                document.getElementById('current').textContent = this.current;
            }

            shoot() {
                if (this.isRolling) return;
                this.isRolling = true;
                const ball = document.getElementById('ball');
                Casino.Audio.playTone(100, 'triangle', 0.8);
                ball.style.bottom = '400px';

                setTimeout(() => {
                    if (this.current === this.target) {
                        Casino.Audio.playWin();
                        Casino.Rewards.saveProgress('reward_bolera');
                        Casino.UI.showVictory("Strike! Has harmonitzat la bolera.", () => location.href = 'menu.html');
                    } else {
                        Casino.Audio.playLose();
                        Casino.UI.showModal('miss', 'CANALETA', 'La suma no és correcta (' + this.current + '). Torna-ho a intentar!', 'REINTENTAR', () => location.reload());
                    }
                }, 1000);
            }
        }

        const game = new BoleraGame();
    </script>
</body>
</html>
